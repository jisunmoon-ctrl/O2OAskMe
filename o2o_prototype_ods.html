/* ══════════ 시트 핸들 드래그 ══════════════════════════════════════
   O2O 홈: Container 핸들을 아래로 끌면 지도가 커지며 드러나고, 임계치를 넘기면
   같은 지도 위에 Map Discovery 컴포넌트(주변 업체 시트·핀·popover)가 올라온다.
   Map Discovery: 시트 핸들로 높이를 조절하고, peek 아래로 더 내리면 홈으로 돌아온다. */
const DRAG_GO  = 72;    /* 화면 전환 임계치(px) */
/* BottomSheet 높이는 고정 px 이 아니라 화면 비율(fractional)로 잡는다 —
   기기 높이가 달라져도 두 화면이 같은 비율을 유지한다. */
const SHEET_FR_HOME = 0.60;   /* O2O 홈 Container — 화면 전체 높이 기준 */
const SHEET_FR_DISC = 0.40;   /* Map Discovery BottomSheet */
const SHEET_FR_PEEK = 0.16;   /* 시트를 접었을 때 (핸들 + 제목만) */
const screenH = () => screen.clientHeight || 750;
/* 홈 지도 높이 — Container 상단이 화면의 (1-SHEET_FR_HOME) 지점에 오도록 역산한다.
   상단 sticky 헤더(Search Nav + Location)와 Container 의 -30px 겹침을 함께 뺀다. */
const chTopH  = () => screen.querySelector('.ch-top')?.offsetHeight || 86;
const chmBase = () => Math.max(120,
  Math.round(screenH() * (1 - SHEET_FR_HOME)) - chTopH() + 30);
const msFull  = () => Math.round(screenH() * SHEET_FR_DISC);
const msPeek  = () => Math.round(screenH() * SHEET_FR_PEEK);
/* --chm-h 는 루트에 한 번만 심는다. .ch 는 렌더마다 새로 만들어지므로
   여기에 값을 주면 CSS 기본값(240px)에서 트랜지션이 걸려 첫 페인트가 어긋난다. */
function syncSheetVars(){
  document.documentElement.style.setProperty('--chm-h', chmBase()+'px');
}
window.addEventListener('resize', syncSheetVars);

function dragHandle(el, onMove, onEnd, onStart){
  if(!el) return;
  let id = null, y0 = 0;
  el.addEventListener('pointerdown', e=>{
    if(id!==null) return;
    id = e.pointerId; y0 = e.clientY;
    try{ el.setPointerCapture(id); }catch(_){}
    e.preventDefault();
    onStart && onStart();
  });
  el.addEventListener('pointermove', e=>{
    if(e.pointerId!==id) return;
    onMove(e.clientY - y0);
  });
  const end = e=>{
    if(e.pointerId!==id) return;
    const dy = e.clientY - y0;
    try{ el.releasePointerCapture(id); }catch(_){}
    id = null;
    onEnd(dy);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

function bindHomeHandleDrag(){
  const ch = screen.querySelector('.ch');
  const handle = screen.querySelector('.ch-tab .ct-handle');
  if(!ch || !handle) return;
  dragHandle(handle,
    dy=>{
      if(dy <= 0){ ch.dataset.drag='0'; ch.style.removeProperty('--chm-h');   /* 루트의 비율값으로 복귀 */ mapNudge(); return; }
      ch.dataset.drag = '1';
      /* 임계치를 넘으면 저항을 줘 전환이 임박했음을 알린다 */
      const v = dy <= DRAG_GO ? dy : DRAG_GO + (dy-DRAG_GO)*0.35;
      ch.style.setProperty('--chm-h', (chmBase() + Math.min(v, 200))+'px');
      mapNudge();
    },
    dy=>{
      ch.dataset.drag = '0';
      ch.style.removeProperty('--chm-h');   /* 루트의 비율값으로 복귀 */
      if(dy > DRAG_GO){
        S.mdPin=null; S.mdCard=null; S.msH = msFull();
        go('cMapDisc');
        return;
      }
      setTimeout(mapNudge, 260);
    });
}

function setMsH(px){
  const n = Math.max(24, Math.round(px)) + 'px';
  screen.querySelector('.md-page')?.style.setProperty('--ms-h', n);
}
function bindSheetDrag(){
  const sheet = screen.querySelector('.md-sheet');
  const handle = sheet && sheet.querySelector('.ms-handle');
  if(!handle) return;
  let base = S.msH || msFull();
  dragHandle(handle,
    dy=>{
      sheet.dataset.drag = '1';
      screen.querySelector('.md-page')?.setAttribute('data-drag','1');
      setMsH(Math.max(24, Math.min(msFull(), base - dy)));
      mapNudge();
    },
    dy=>{
      sheet.dataset.drag = '0';
      screen.querySelector('.md-page')?.setAttribute('data-drag','0');
      /* peek 보다 더 내리면 O2O 홈으로 돌아간다 */
      if(base - dy < msPeek() - DRAG_GO){ S.msH = msFull(); go('cHome'); return; }
      S.msH = dy > DRAG_GO ? msPeek() : (dy < -DRAG_GO ? msFull() : base);
      setMsH(S.msH);
      setTimeout(mapNudge, 260);
    },
    ()=>{ base = S.msH || msFull(); });
}

/* 핀 탭 — 라운지는 popover, 콘텐츠·업체 핀은 active 토글(+ 카드 동기화) */
function mdPinTap(id){
  const p = MD_PINS.find(x=>x.id===id);
  if(!p) return;
  /* 선택은 한 번에 하나. 다시 누르면 해제되고 기본 시트로 돌아간다. */
  const off = S.mdPin===p.id;
  S.mdPin  = off ? null : p.id;
  S.mdCard = off ? null : (p.card || null);
  S.msH    = msFull();      /* 시트를 접어둔 상태였다면 다시 펼친다 */
  if(S.screen!=='cMapDisc') go('cMapDisc'); else render();
  screen.querySelector('.ms-card[aria-current="true"]')?.scrollIntoView({block:'nearest'});
}
/* 핀이 활성화된 상태에서 핀 바깥(지도 배경)을 누르면 Map Discovery BottomSheet 를 닫고
   O2O 홈 Container BottomSheet 를 다시 노출한다.
   핀은 clickable CustomOverlay / bubblingMouseEvents:false 라 지도 click 이 발생하지 않는다. */
function mdDeselect(){
  if(S.screen !== 'cMapDisc' || !S.mdPin) return;
  S.mdPin = null; S.mdCard = null; S.msH = msFull();
  go('cHome');
  mapGoHome();
}

  root.querySelectorAll('[data-mdpin][data-act="1"]').forEach(b=> b.onclick=()=> mdPinTap(b.dataset.mdpin));
}

      <span class="msc-nm">
        <b class="t-body16L20 w-bold">${p.name}</b>
        <img class="msc-std" src="${MD_ASSET}badge-standard.svg" alt="오늘의집 스탠다드" width="109" height="18">
      </span>
      <span class="msc-det">
        <span class="msc-row t-detail12L16">
          <span class="msc-star">${ic('IconStarFilled',12)}<b class="w-bold">${p.star}</b></span>
          <span class="w-bold">리뷰 ${p.reviews}</span>
          <span class="msc-sep">・</span>
          <span class="w-bold">최근계약 ${p.contracts}</span>
          <span class="msc-sep">・</span>
          <span class="w-bold">${p.dist} (${p.area})</span>
        </span>
        <span class="msc-badges">${p.badges.map(b=>sqBadge(b,'neutral300','16')).join('')}</span>
      </span>
      <span class="msc-price t-detail12L16 w-regular">${p.price}${ic('IconInfoCircle',14)}</span>
    </span>
    <span class="msc-rail">${photos}</span>
  </button>`;
}

/* Floating BottomSheet (917:14710) — 선택한 핀 종류에 따라 본문이 바뀐다.
   기본(미선택)·업체 핀 = 주변 업체 목록 / 콘텐츠 핀 = 시공사례 목록 / 라운지 핀 = 라운지 정보 */
function mdSheetTitle(){
  const kind = mdSheetKind();
  if(kind==='lounge')   return {t:MD_LOUNGE.name, n:'', icon:true};
  if(kind==='contents') return {t:`${(MD_CONTENTS[S.mdPin]||{}).name||''} 시공사례`,
                                n:String((MD_CONTENTS[S.mdPin]||{cases:[]}).cases.length)};
  return {t:MD_TITLE, n:String(MD_COUNT)};
}
function mdSheetBody(){
  const kind = mdSheetKind();
  if(kind==='lounge')   return mdLoungeBody();
  if(kind==='contents') return mdContentsBody();
  return `<div class="ms-filter">
      <button class="ms-sort t-body14L18 w-regular" type="button">추천순${ic('IconChevronDown',18)}</button>
      <button class="ms-std" type="button">
        ${cbxIndicator(false,'medium')}
        <img class="msd-logo" src="${MD_ASSET}logo-standard-blue.svg" alt="오늘의집 스탠다드" width="121" height="20">
        ${ic('IconInfoCircle',16)}
      </button>
    </div>
    <div class="ms-list">
      <div class="ms-adhead">
        <div class="ms-adrow">
          <span class="t-detail12L16 w-bold">프리미엄</span>
          <span class="ods-sqbadge" data-size="16" data-variant="base2_outline">광고${ic('IconInfoCircle',12)}</span>
        </div>
        <div class="ms-div" aria-hidden="true"></div>
      </div>
      <div class="ms-cards">${MD_PARTNERS.map(mdCard).join('')}</div>
    </div>`;
}
function mdSheet(){
  const {t, n, icon} = mdSheetTitle();
  return `<div class="md-sheet" role="region" aria-label="${t}">
    <div class="ms-handle" aria-hidden="true"><i></i></div>
    <div class="ms-scroll">
      <div class="ms-top">
        <div class="mt-txt">
          ${icon?chOdsSvg('AssetOhouseSymbol/ohouse-symbol.svg', 20):''}
          <b class="t-body16L20 w-bold">${t}</b>
          ${n?`<span class="t-body16L20 w-semibold">${n}</span>`:''}
        </div>
      </div>
      ${mdSheetBody()}
    </div>
  </div>`;
}

VIEW.cMapDisc = ()=>{
  const msH = S.msH || msFull();
  screen.innerHTML = `<div class="md-page" style="--ms-h:${msH}px">
    <div class="search-nav" role="navigation" aria-label="글로벌 내비게이션">
      <button class="sn-icon" type="button" aria-label="메뉴">${ic('IconLine3Horizontal',24)}</button>
      <div class="sn-search">
        <span class="sn-ic">${ic('IconMagnifyingGlass',18)}</span>
        <span class="sn-ph t-body14L20 w-regular">오늘의집 통합검색</span>
      </div>
      <button class="sn-icon" type="button" aria-label="알림">${ic('IconBell',24)}</button>
      <button class="sn-icon" type="button" aria-label="북마크">${ic('IconBookmark',24)}</button>
      <button class="sn-icon" type="button" aria-label="장바구니">${ic('IconCart',24)}</button>
    </div>
    ${bundleLocation()}
    <div class="md-map" aria-label="우리집 주변 지도">
      ${mapSlot()}
      ${mapResearchBtn()}
      ${mdSheet()}
    </div>
    ${mapActions()}
  </div>`;

  mapMount();
  bindSheetDrag();
  const rerender = keepScroll => {
    const sc = screen.querySelector('.ms-scroll');
    const y = keepScroll && sc ? sc.scrollTop : 0;
    render();
    const sc2 = screen.querySelector('.ms-scroll');
    if(sc2 && y) sc2.scrollTop = y;
  };
  screen.querySelectorAll('[data-mdcard]').forEach(b=> b.onclick=()=>{
    const off = S.mdCard===b.dataset.mdcard;
    S.mdCard = off ? null : b.dataset.mdcard;
    S.mdPin  = off ? null : (MD_PINS.find(p=>p.card===S.mdCard)||{}).id || null;
    rerender(true);
  });
};

/* ══════════ 03 시공 신청폼 ════════════════════════════════════════
   메뉴만 신설한 단계 — 플로우(문항·제출)는 아직 연결하지 않는다. */

    <div class="mt-body">
      ${asset('houseDrill',96)}

      <p class="t-body14L18">메뉴만 먼저 신설한 단계예요.<br>입력 플로우는 아직 연결하지 않았습니다.</p>
    </div>
  </div>`;
  $('#mdBack2').onclick = ()=> go('cMapDisc');

function bootFlowC(){
  document.body.classList.add('view4');
  resetFlowC();
  S.screen = 'cHome';

initPreviewToggle();
syncSheetVars();

render();
