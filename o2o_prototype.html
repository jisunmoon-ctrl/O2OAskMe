<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>O2O 통합 오퍼링 — 인터랙티브 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* ─────────────────────────────────────────────────────────
   토큰 — 도면(blueprint) 위에 올려둔 한 대의 폰
   stage: 청사진 네이비 · 격자 / phone: 백지 / 치수선: 초크
   ───────────────────────────────────────────────────────── */
:root{
  --navy:#0C2A55;
  --navy-2:#0A2246;
  --grid:rgba(255,255,255,.075);
  --grid-strong:rgba(255,255,255,.14);
  --chalk:#DFEAFB;
  --chalk-dim:#8DACD8;
  --mint:#79E6C0;          /* 치수·수치 전용 */
  --paper:#FFFFFF;
  --ink:#12161D;
  --ink-2:#454F5E;
  --ink-3:#8792A3;
  --line:#E6EAF1;
  --line-2:#F1F4F8;
  --brand:#1B3FE0;
  --brand-ink:#0F2AA8;
  --brand-soft:#EDF1FF;
  --ok:#0B7A5F;
  --ok-soft:#E6F6F0;
  --amber:#B45309;
  --r-s:6px; --r-m:10px; --r-l:16px; --r-xl:22px;
  --ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ui);
  color:var(--chalk);
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(var(--grid-strong) 1px,transparent 1px) 0 0/140px 140px,
    linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px) 0 0/140px 140px,
    radial-gradient(1100px 700px at 62% 12%, #123566 0%, var(--navy) 45%, var(--navy-2) 100%);
  -webkit-font-smoothing:antialiased;
  padding:26px 22px 60px;
}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:4px}

/* ── 레이아웃 — 폰 + 두 개의 메뉴 ─────────────── */
.stage{max-width:700px;margin:0 auto;display:flex;gap:52px;align-items:flex-start;justify-content:center}
.panel{position:sticky;top:26px;width:196px;flex:0 0 auto;padding-top:6px;display:flex;flex-direction:column;gap:34px}
.panel h3{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mint);font-weight:400;margin-bottom:14px}
.panel ul,.panel ol{list-style:none}

/* CASE 메뉴 */
#caseMenu li{margin-bottom:1px}
#caseMenu button{
  width:100%;text-align:left;background:none;border:0;cursor:pointer;font-family:var(--ui);
  font-size:12px;letter-spacing:-.02em;color:var(--chalk-dim);padding:7px 9px;border-radius:6px;
  display:flex;gap:9px;align-items:baseline;transition:.14s;
}
#caseMenu button i{font-style:normal;font-family:var(--mono);font-size:9.5px;opacity:.6;flex:0 0 22px}
#caseMenu button:hover{background:rgba(255,255,255,.07);color:var(--chalk)}
#caseMenu button[aria-current="true"]{background:rgba(121,230,192,.14);color:#fff;font-weight:700}
#caseMenu button[aria-current="true"] i{color:var(--mint);opacity:1}

/* FLOW 메뉴 */
#rail{position:relative}
#rail::before{content:"";position:absolute;left:5px;top:8px;bottom:12px;width:1px;background:rgba(255,255,255,.18)}
#rail li{position:relative}
#rail li button{
  width:100%;text-align:left;background:none;border:0;cursor:pointer;font-family:var(--ui);
  font-size:12.5px;letter-spacing:-.02em;color:var(--chalk-dim);padding:5px 6px 5px 24px;border-radius:6px;
  margin-bottom:9px;transition:.14s;
}
#rail li button::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:50%;
  border:1px solid rgba(255,255,255,.35);background:var(--navy)}
#rail li button .n{font-family:var(--mono);font-size:10px;opacity:.55;margin-right:7px}
#rail li button:hover{background:rgba(255,255,255,.07);color:var(--chalk)}
#rail li.done button{color:rgba(223,234,251,.6)}
#rail li.done button::before{background:var(--chalk-dim);border-color:var(--chalk-dim)}
#rail li.now button{color:#fff;font-weight:700}
#rail li.now button::before{background:var(--mint);border-color:var(--mint);box-shadow:0 0 0 4px rgba(121,230,192,.2)}
#rail li.split{padding:2px 0 12px 24px}
.modesw{margin:2px 0 0 24px;display:flex;flex-direction:column;gap:2px;
  border-top:1px dashed rgba(255,255,255,.2);padding-top:12px}
.modesw button{
  text-align:left;background:none;border:0;cursor:pointer;font-family:var(--ui);
  font-size:11.5px;letter-spacing:-.02em;color:var(--chalk-dim);padding:6px 8px;border-radius:6px;transition:.14s;
  display:flex;gap:8px;align-items:baseline;
}
.modesw button i{font-style:normal;font-family:var(--mono);font-size:9.5px;opacity:.6}
.modesw button:hover{background:rgba(255,255,255,.07);color:var(--chalk)}
.modesw button[aria-pressed="true"]{background:rgba(121,230,192,.14);color:#fff;font-weight:700}
.modesw button[aria-pressed="true"] i{color:var(--mint);opacity:1}
#rail li.split span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--chalk-dim);
  border-top:1px dashed rgba(255,255,255,.25);display:block;padding-top:11px}

/* phone */
.phone-col{display:flex;flex-direction:column;align-items:center;gap:14px}
.phone{
  width:392px;height:800px;background:var(--paper);border-radius:38px;
  box-shadow:0 0 0 9px #0B1B33, 0 0 0 10px rgba(255,255,255,.14), 0 40px 80px -20px rgba(0,0,0,.55);
  overflow:hidden;position:relative;display:flex;flex-direction:column;color:var(--ink);
}
.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--ink);background:var(--paper);position:relative;z-index:5}
.statusbar .sig{display:flex;gap:3px;align-items:flex-end}
.statusbar .sig i{display:block;width:3px;background:var(--ink);border-radius:1px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin}
.screen::-webkit-scrollbar{width:0}

/* ─────────────────────────────────────────────────
   폰 내부 UI
   ───────────────────────────────────────────────── */
.p-pad{padding:0 20px}
.apphead{display:flex;align-items:center;justify-content:space-between;padding:2px 20px 12px}
.apphead .logo{font-size:17px;font-weight:800;letter-spacing:-.04em}
.apphead .ico{display:flex;gap:14px;color:var(--ink-3)}
.tabs{display:flex;gap:20px;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:4}
.tabs span{font-size:14px;font-weight:600;color:var(--ink-3);padding:0 0 11px;letter-spacing:-.02em}
.tabs span.on{color:var(--ink);font-weight:800;box-shadow:inset 0 -2px 0 var(--ink)}

/* 진입 후크 */
.hook{margin:16px 20px 0;background:linear-gradient(158deg,#12203F 0%,#1B3FE0 108%);border-radius:var(--r-xl);padding:22px 20px 20px;color:#fff;cursor:pointer;position:relative;overflow:hidden}
.hook::after{content:"";position:absolute;inset:0;background:
  linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/22px 22px,
  linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/22px 22px;pointer-events:none}
.hook .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#9CF0D3;margin-bottom:10px}
.hook h3{font-size:20px;line-height:1.4;letter-spacing:-.035em;font-weight:800;margin-bottom:8px}
.hook p{font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.74);letter-spacing:-.01em;margin-bottom:16px}
.prompt{background:rgba(255,255,255,.97);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.prompt .txt{flex:1;font-size:13.5px;color:var(--ink-3);letter-spacing:-.02em}
.prompt .txt b{color:var(--ink);font-weight:600}
.prompt .go{width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:0 0 auto}
.caret{display:inline-block;width:1.5px;height:14px;background:var(--brand);vertical-align:-2px;margin-left:1px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.sec-t{font-size:15px;font-weight:800;letter-spacing:-.03em;margin:26px 20px 4px}
.sec-s{font-size:12px;color:var(--ink-3);letter-spacing:-.015em;margin:0 20px 14px}
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px;padding:0 14px}
.svc-grid button{background:none;border:0;cursor:pointer;padding:12px 2px;border-radius:var(--r-m);display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--ui)}
.svc-grid button:hover{background:var(--line-2)}
.svc-grid .bg{width:46px;height:46px;border-radius:15px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand-ink)}
.svc-grid span{font-size:11.5px;color:var(--ink-2);letter-spacing:-.03em;font-weight:600}
.strip{display:flex;gap:10px;padding:2px 20px 22px;overflow:hidden}
.strip .card{flex:0 0 132px}
.strip .thumb{height:96px;border-radius:12px;background:linear-gradient(140deg,#DCE4F2,#C7D3E8)}
.strip .card:nth-child(2) .thumb{background:linear-gradient(140deg,#EFE3D8,#DFCBBA)}
.strip .card:nth-child(3) .thumb{background:linear-gradient(140deg,#D9E9E2,#C2DCD2)}
.strip .card p{font-size:11.5px;color:var(--ink-2);margin-top:7px;letter-spacing:-.02em;line-height:1.4}

/* 공통 헤더/제목 */
.navbar{display:flex;align-items:center;gap:12px;padding:2px 16px 10px;position:sticky;top:0;background:var(--paper);z-index:4}
.navbar button{background:none;border:0;cursor:pointer;color:var(--ink);padding:6px;border-radius:8px;display:grid;place-items:center}
.navbar button:hover{background:var(--line-2)}
.navbar .t{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.h-lead{padding:14px 20px 6px}
.h-lead h2{font-size:23px;line-height:1.38;letter-spacing:-.04em;font-weight:800}
.h-lead p{font-size:13px;color:var(--ink-3);letter-spacing:-.02em;margin-top:9px;line-height:1.6}

/* 서비스 선택 */
.picks{padding:14px 20px 120px;display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:13px;border:1.5px solid var(--line);border-radius:var(--r-l);padding:15px 16px;cursor:pointer;background:var(--paper);transition:.15s;text-align:left;font-family:var(--ui);width:100%}
.pick:hover{border-color:#C9D2E4}
.pick .ic{width:40px;height:40px;border-radius:12px;background:var(--line-2);display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto}
.pick .tt{flex:1;min-width:0}
.pick .tt b{display:block;font-size:14.5px;letter-spacing:-.03em;font-weight:700}
.pick .tt span{display:block;font-size:11.5px;color:var(--ink-3);letter-spacing:-.02em;margin-top:3px}
.pick .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid #D5DCE8;flex:0 0 auto;display:grid;place-items:center}
.pick[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pick[aria-pressed="true"] .ic{background:#fff;color:var(--brand)}
.pick[aria-pressed="true"] .chk{background:var(--brand);border-color:var(--brand)}
.pick[aria-pressed="true"] .chk svg{display:block}
.pick .chk svg{display:none}

/* 하단 고정 CTA */
.dock{position:sticky;bottom:0;z-index:6;padding:13px 20px 20px;background:var(--paper);
  border-top:1px solid var(--line);box-shadow:0 -8px 20px -14px rgba(18,22,29,.35)}
.btn{width:100%;border:0;border-radius:14px;padding:16px;font-family:var(--ui);font-size:15px;font-weight:700;letter-spacing:-.03em;cursor:pointer;background:var(--brand);color:#fff;transition:.15s}
.btn:hover{background:var(--brand-ink)}
.btn:disabled{background:#E3E7EF;color:#A9B2C0;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink-2);font-size:13.5px;font-weight:600;padding:13px;text-decoration:underline;text-underline-offset:3px}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.dock .hint{text-align:center;font-size:11.5px;color:var(--ink-3);letter-spacing:-.02em;margin-bottom:10px}
.dock2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dock2 .btn{padding:14px 6px;font-size:13.5px;line-height:1.35}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.alt:hover{background:var(--line-2)}
.dock .hint b{color:var(--ok);font-weight:700}

/* 로딩 — 항목 조립 */
.assembling{padding:80px 26px 0;display:flex;flex-direction:column;align-items:center}
.spinner{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--brand);animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.assembling h2{font-size:19px;letter-spacing:-.035em;font-weight:800;margin:24px 0 6px;text-align:center}
.assembling>p{font-size:12.5px;color:var(--ink-3);letter-spacing:-.02em;margin-bottom:26px}
.asm-list{width:100%;display:flex;flex-direction:column;gap:9px}
.asm{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:-.025em;color:var(--ink-2);opacity:0;transform:translateY(6px);animation:pop .32s ease forwards}
.asm .dotx{width:16px;height:16px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:0 0 auto}
.asm.skip{color:var(--ink-3);text-decoration:line-through;text-decoration-color:#C9D2E4}
.asm.skip .dotx{background:var(--line-2);color:var(--ink-3)}
@keyframes pop{to{opacity:1;transform:none}}

/* ── A안 대화형 ─────────────────────────────────── */
.chat{padding:12px 18px 30px;display:flex;flex-direction:column;gap:12px}
.svc-tag{align-self:flex-start;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);background:var(--line-2);border-radius:20px;padding:5px 10px;margin-top:8px}
.bub{max-width:82%;padding:13px 15px;font-size:13.5px;line-height:1.65;letter-spacing:-.025em;border-radius:16px;animation:pop .26s ease both}
.bub.bot{align-self:flex-start;background:var(--line-2);border-bottom-left-radius:5px;color:var(--ink)}
.bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:5px;font-weight:600}
.bub.note{align-self:flex-start;background:var(--ok-soft);color:#0A5D49;border-bottom-left-radius:5px}
.bub.note b{font-weight:700}
.typing{align-self:flex-start;background:var(--line-2);border-radius:16px;border-bottom-left-radius:5px;padding:15px 16px;display:flex;gap:4px}
.typing i{width:5px;height:5px;border-radius:50%;background:#B4BDCB;animation:bounce .9s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.chatdock{position:sticky;bottom:0;z-index:6;background:var(--paper);
  box-shadow:0 -10px 22px -16px rgba(18,22,29,.4)}
.quick{display:flex;flex-wrap:wrap;gap:7px;padding:12px 18px;justify-content:flex-end}
.qr{border:1.5px solid var(--brand);color:var(--brand);background:#fff;border-radius:20px;padding:9px 15px;font-size:13px;font-weight:600;letter-spacing:-.025em;cursor:pointer;font-family:var(--ui);transition:.14s}
.qr:hover{background:var(--brand-soft)}
.qr[aria-pressed="true"]{background:var(--brand);color:#fff}
.qr.pale{border-color:#D9DFE9;color:var(--ink-3)}
.qr.pale:hover{background:var(--line-2)}
.chatbar{border-top:1px solid var(--line);padding:12px 18px 20px;display:flex;gap:9px;align-items:center;background:var(--paper)}
.chatbar .fake{flex:1;background:var(--line-2);border-radius:20px;padding:11px 15px;font-size:12.5px;color:var(--ink-3);letter-spacing:-.02em}

/* ── B안 스텝형 ─────────────────────────────────── */
.prog{padding:4px 20px 0}
.prog .bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--brand);border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.prog .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3);margin-top:9px}
.form{padding:8px 20px 130px}
.fsec{margin-top:26px}
.fsec:first-child{margin-top:14px}
.fsec-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.fsec-h b{font-size:15px;letter-spacing:-.03em;font-weight:800}
.fsec-h .tagx{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--brand);background:var(--brand-soft);border-radius:5px;padding:4px 7px}
.fsec>p.desc{font-size:12px;color:var(--ink-3);letter-spacing:-.02em;line-height:1.6;margin-bottom:14px}
.field{margin-top:18px}
.field .lb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:-.025em;margin-bottom:9px}
.field .lb .req{color:var(--brand);font-size:11px}
.field .lb .opt{font-size:10.5px;color:var(--ink-3);font-weight:600;background:var(--line-2);border-radius:4px;padding:2px 6px}
.field .why{font-size:11.5px;color:var(--ink-3);letter-spacing:-.02em;margin:-4px 0 9px;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;font-size:13px;letter-spacing:-.025em;color:var(--ink-2);cursor:pointer;font-family:var(--ui);font-weight:600;transition:.14s}
.opt:hover{border-color:#C9D2E4}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.prefill{display:flex;align-items:center;gap:8px;background:var(--ok-soft);border-radius:10px;padding:12px 13px;font-size:12.5px;color:#0A5D49;letter-spacing:-.025em;line-height:1.5}
.prefill b{font-weight:700}
.attach{display:flex;gap:8px;margin-top:4px}
.attach button{flex:1;border:1.5px dashed var(--line);background:#fff;border-radius:12px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-family:var(--ui);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:-.02em}
.attach button:hover{border-color:var(--brand);color:var(--brand)}
.attach button[aria-pressed="true"]{border-style:solid;border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}

/* 결과 분기 */
.summary{margin:16px 20px 0;border:1px solid var(--line);border-radius:var(--r-l);padding:16px}
.summary .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);margin-bottom:12px}
.summary .row{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;letter-spacing:-.025em;padding:7px 0;border-top:1px solid var(--line-2)}
.summary .row:first-of-type{border-top:0}
.summary .row span{color:var(--ink-3);flex:0 0 auto}
.summary .row b{font-weight:600;text-align:right}

/* 업체 추천 */
.filterbar{margin:14px 20px 0;background:#0E1726;color:#fff;border-radius:var(--r-l);padding:15px 16px}
.filterbar .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.filterbar .top b{font-size:13px;letter-spacing:-.025em}
.filterbar .top span{font-family:var(--mono);font-size:11px;color:var(--mint)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font-size:11px;letter-spacing:-.02em;background:rgba(255,255,255,.11);border-radius:6px;padding:5px 8px;display:flex;align-items:center;gap:5px;color:rgba(255,255,255,.88)}
.fchip i{color:var(--mint);font-style:normal}
.plist{padding:14px 20px 130px;display:flex;flex-direction:column;gap:10px}
.pcard{border:1px solid var(--line);border-radius:var(--r-l);padding:16px;cursor:pointer;background:#fff;transition:.15s;text-align:left;font-family:var(--ui);width:100%}
.pcard:hover{border-color:#C9D2E4;box-shadow:0 6px 18px -10px rgba(18,22,29,.25)}
.pcard[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pcard .ph{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.pcard .av{width:38px;height:38px;border-radius:12px;flex:0 0 auto;background:linear-gradient(140deg,#D6DEEE,#B9C6DE);display:grid;place-items:center;font-size:13px;font-weight:800;color:#41506B}
.pcard .nm{flex:1;min-width:0}
.pcard .nm b{display:block;font-size:14.5px;letter-spacing:-.03em;font-weight:700}
.pcard .nm span{font-size:11.5px;color:var(--ink-3);letter-spacing:-.02em}
.pcard .rk{font-family:var(--mono);font-size:10px;color:var(--ink-3);background:var(--line-2);border-radius:5px;padding:4px 7px}
.pcard .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.pcard .tags i{font-style:normal;font-size:11px;letter-spacing:-.02em;color:var(--ink-2);background:var(--line-2);border-radius:5px;padding:5px 8px}
.pcard .why2{font-size:12px;line-height:1.6;letter-spacing:-.025em;color:#0A5D49;background:var(--ok-soft);border-radius:9px;padding:10px 11px}
.pcard .why2 b{font-weight:700}

/* 완료 */
.done{padding:44px 24px 30px;text-align:center}
.seal{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 20px;animation:pop .4s ease both}
.done h2{font-size:21px;line-height:1.42;letter-spacing:-.04em;font-weight:800;margin-bottom:10px}
.done h2 mark{background:linear-gradient(transparent 58%,#C9F0E1 58%);color:inherit}
.done>p{font-size:13px;color:var(--ink-2);line-height:1.65;letter-spacing:-.025em}
.expect{margin:24px 0 0;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;text-align:left}
.expect .er{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line-2);align-items:flex-start}
.expect .er:first-child{border-top:0}
.expect .er .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3);flex:0 0 44px;padding-top:2px}
.expect .er .v{font-size:12.5px;line-height:1.6;letter-spacing:-.025em;color:var(--ink)}
.expect .er .v b{font-weight:700}
.optout{margin-top:16px;font-size:12px;color:var(--ink-3);letter-spacing:-.02em;line-height:1.6}
.optout u{cursor:pointer;text-underline-offset:3px}
.optout u:hover{color:var(--ink)}
.chipsum{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:22px}
.chipsum i{font-style:normal;font-size:11.5px;letter-spacing:-.02em;color:var(--ink-2);background:var(--line-2);border-radius:20px;padding:6px 11px}

/* 조합별 처리 규칙 */
.caseblk{margin-top:24px;border:1px solid rgba(255,255,255,.16);border-radius:var(--r-m);padding:16px 17px;max-width:56ch;background:rgba(255,255,255,.035)}
.cb-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:14px}
.cb-h span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--mint)}
.cb-h i{font-style:normal;font-size:12px;color:var(--chalk);letter-spacing:-.02em;font-weight:700}
.cb-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.12)}
.cb-cols b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--chalk-dim);font-weight:400;margin-bottom:8px}
.cb-cols ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.cb-cols li{font-size:11.5px;line-height:1.45;letter-spacing:-.02em;color:var(--chalk)}
.cb-cols li.none{color:var(--chalk-dim)}
.cb-rules{list-style:none;counter-reset:r;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.cb-rules li{counter-increment:r;position:relative;padding-left:22px;font-size:12px;line-height:1.62;letter-spacing:-.02em;color:var(--chalk-dim)}
.cb-rules li::before{content:counter(r);position:absolute;left:0;top:0;font-family:var(--mono);font-size:10px;color:var(--mint)}
.cb-rules li b{color:#fff;font-weight:700}
@media (max-width:520px){.cb-cols{grid-template-columns:1fr}}

.stepdesc{font-size:12.5px;line-height:1.6;letter-spacing:-.025em;color:var(--ink-3);margin:12px 0 -6px}

/* 서비스 선택 — 인라인 옵션 */
.svcopt{border:1.5px solid var(--brand);border-top:0;border-radius:0 0 var(--r-l) var(--r-l);
  padding:14px 15px 15px;margin:-8px 0 0;background:var(--brand-soft)}
.so-h{font-size:12.5px;font-weight:700;letter-spacing:-.03em;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.so-h em{font-style:normal;font-size:10px;font-weight:600;color:var(--brand-ink);background:#fff;border-radius:4px;padding:3px 6px}
.so-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.so-c{border:1.5px solid #D4DDF7;background:#fff;border-radius:9px;padding:9px 12px;font-family:var(--ui);
  font-size:12.5px;font-weight:600;letter-spacing:-.025em;color:var(--ink-2);cursor:pointer;transition:.14s}
.so-c:hover{border-color:var(--brand)}
.so-c[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.so-ok{width:100%;border:0;border-radius:10px;padding:12px;font-family:var(--ui);font-size:13px;font-weight:700;
  letter-spacing:-.03em;background:var(--brand);color:#fff;cursor:pointer}
.so-ok:hover{background:var(--brand-ink)}
.so-ok:disabled{background:#C7D0E6;cursor:not-allowed}
.so-sum{width:100%;display:flex;align-items:center;gap:10px;border:1.5px solid var(--brand);border-top:0;
  border-radius:0 0 var(--r-l) var(--r-l);padding:12px 15px;margin:-8px 0 0;background:var(--brand-soft);
  cursor:pointer;font-family:var(--ui);text-align:left}
.so-sum span{flex:1;min-width:0;font-size:12.5px;font-weight:600;letter-spacing:-.025em;color:var(--brand-ink)}
.so-sum em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.pick[aria-pressed="true"]:has(+ .svcopt),.pick[aria-pressed="true"]:has(+ .so-sum){border-bottom-left-radius:0;border-bottom-right-radius:0}

/* 컨펌폼 — 서비스별 신청서 */
.deck-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 9px}
.deck-nav span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3)}
.deck-dots{display:flex;gap:6px}
.deck-dots button{width:6px;height:6px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:#D5DCE8;transition:.18s}
.deck-dots button.on{width:18px;border-radius:3px;background:var(--ink)}
.deck{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px 4px;
  align-items:stretch;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.deck::-webkit-scrollbar{display:none}
.deck.single{padding-top:16px}
.deck > .sheet{flex:0 0 calc(100% - 40px);scroll-snap-align:start}
.deck.single > .sheet{flex:0 0 100%}
.sheet{border:1px solid var(--line);border-radius:var(--r-l);background:#fff;overflow:hidden;
  display:flex;flex-direction:column}
.sheet .sh-body{flex:1}
.sheet header{display:flex;align-items:center;gap:12px;padding:15px 15px 14px;
  background:var(--brand-soft);border-bottom:1px solid #DDE4FB}
.sheet .sh-ic{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;
  display:grid;place-items:center;flex:0 0 auto}
.sheet .sh-ic svg{width:21px;height:21px}
.sheet .sh-t{flex:1;min-width:0}
.sheet .sh-t b{display:block;font-size:19px;font-weight:800;letter-spacing:-.045em;color:var(--brand-ink);line-height:1.2}
.sheet .sh-t span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  color:var(--brand);opacity:.7;margin-top:5px}
.sheet .sh-body{padding-top:12px}
.sh-edit{border:0;background:#fff;border-radius:8px;padding:8px 12px;font-family:var(--ui);
  font-size:11.5px;font-weight:700;letter-spacing:-.02em;color:var(--brand-ink);cursor:pointer;flex:0 0 auto}
.sh-edit:hover{background:#F2F5FF}
.sh-body{padding:0 15px 12px}
.sh-row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--line-2);font-size:12px;letter-spacing:-.025em}
.sh-row:first-child{border-top:0}
.sh-row span{color:var(--ink-3);flex:0 0 auto}
.sh-row b{font-weight:600;text-align:right;display:flex;align-items:center;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.sh-row b i{font-style:normal;font-size:9px;font-family:var(--mono);letter-spacing:.08em;
  background:var(--line-2);color:var(--ink-3);border-radius:4px;padding:2px 5px}
.sh-row b i.auto{background:var(--ok-soft);color:var(--ok)}
.sh-est{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 15px 12px;padding:11px 12px;
  border-radius:10px;background:#0E1726;color:#fff}
.sh-est span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--mint)}
.sh-est b{font-size:15px;font-weight:800;letter-spacing:-.03em}
.sh-est em{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.6);letter-spacing:-.02em;flex-basis:100%}
.sh-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 15px;background:var(--line-2);font-size:11.5px;letter-spacing:-.025em}
.sh-f b{font-weight:700;color:var(--ink)}
.sh-f span{color:var(--ink-3)}
.sh-f em{font-style:normal;margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ok);
  background:var(--ok-soft);border-radius:5px;padding:4px 7px}
.sh-f.wait em{color:var(--brand-ink);background:var(--brand-soft)}

/* 완료 — 서비스별 접수 상태 */
.statlist{margin-top:22px;border:1px solid var(--line);border-radius:var(--r-l);padding:14px 15px;text-align:left}
.st-cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);margin-bottom:10px}
.st-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-2)}
.st-row:first-of-type{border-top:0}
.st-ic{width:28px;height:28px;border-radius:9px;background:var(--line-2);color:var(--ink-2);display:grid;place-items:center;flex:0 0 auto}
.st-ic svg{width:16px;height:16px}
.st-t{flex:1;min-width:0}
.st-t b{display:block;font-size:13px;font-weight:700;letter-spacing:-.03em}
.st-t span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:-.02em;margin-top:2px}
.st-b{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:-.02em;border-radius:5px;padding:5px 8px;
  background:var(--ok-soft);color:var(--ok)}
.st-b.wait{background:var(--brand-soft);color:var(--brand-ink)}
.st-note{font-size:11px;line-height:1.6;letter-spacing:-.02em;color:var(--ink-3);margin-top:11px;padding-top:11px;border-top:1px solid var(--line-2)}

/* 서비스 탭 */
.rtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 20px 12px;scrollbar-width:none}
.rtabs::-webkit-scrollbar{display:none}
.rtabs button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:20px;
  padding:9px 14px;font-family:var(--ui);font-size:12.5px;font-weight:700;letter-spacing:-.03em;
  color:var(--ink-3);cursor:pointer;transition:.14s}
.rtabs button:hover{border-color:#C9D2E4;color:var(--ink-2)}
.rtabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* 상품 카드 */
.prod{width:100%;text-align:left;font-family:var(--ui);border:1.5px solid var(--line);border-radius:var(--r-l);
  padding:15px;background:#fff;cursor:pointer;transition:.15s}
.prod:hover{border-color:#C9D2E4}
.prod[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pr-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pr-b{font-size:10.5px;font-weight:700;letter-spacing:-.02em;color:var(--brand-ink);
  background:var(--brand-soft);border-radius:5px;padding:4px 7px;flex:0 0 auto}
.prod[aria-pressed="true"] .pr-b{background:#fff}
.pr-n{flex:1;min-width:0;font-size:14.5px;font-weight:800;letter-spacing:-.035em;line-height:1.3}
.pr-chk{width:22px;height:22px;border-radius:50%;border:1.5px solid #D5DCE8;flex:0 0 auto;display:grid;place-items:center}
.pr-chk svg{display:none}
.prod[aria-pressed="true"] .pr-chk{background:var(--brand);border-color:var(--brand)}
.prod[aria-pressed="true"] .pr-chk svg{display:block}
.pr-price{font-size:17px;font-weight:800;letter-spacing:-.04em;margin-bottom:10px}

/* 파트너홈 */
.ph-head{padding:20px 20px 16px;text-align:center}
.ph-av{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px;
  background:linear-gradient(140deg,#D6DEEE,#B9C6DE);font-size:24px;font-weight:800;color:#41506B}
.ph-head h2{font-size:22px;font-weight:800;letter-spacing:-.045em}
.ph-head p{font-size:12.5px;color:var(--ink-3);letter-spacing:-.025em;margin:7px 0 12px}
.ph-head .tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.ph-head .tags i{font-style:normal;font-size:11px;letter-spacing:-.02em;color:var(--ink-2);
  background:var(--line-2);border-radius:5px;padding:5px 8px}
.ph-stat{display:grid;grid-template-columns:repeat(3,1fr);margin:0 20px;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.ph-stat div{padding:14px 8px;text-align:center;border-left:1px solid var(--line-2)}
.ph-stat div:first-child{border-left:0}
.ph-stat b{display:block;font-size:17px;font-weight:800;letter-spacing:-.04em}
.ph-stat span{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:-.02em;margin-top:4px}
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 20px}
.ph-th{aspect-ratio:4/3;border-radius:12px}
.ph-th.t0{background:linear-gradient(140deg,#DCE4F2,#C7D3E8)}
.ph-th.t1{background:linear-gradient(140deg,#EFE3D8,#DFCBBA)}
.ph-th.t2{background:linear-gradient(140deg,#D9E9E2,#C2DCD2)}
.ph-th.t3{background:linear-gradient(140deg,#E6E1EF,#D0C8E0)}
.ph-rev{padding:0 20px;display:flex;flex-direction:column;gap:8px}
.rv{border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px}
.rv b{font-size:12px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.rv p{font-size:12.5px;line-height:1.65;letter-spacing:-.025em;color:var(--ink-2);margin-top:6px}

/* 상단 고정 진입점 */
.pbar{
  position:sticky;top:36px;z-index:3;
  display:flex;align-items:center;gap:11px;
  margin:12px 20px 0;padding:13px 14px;border-radius:14px;
  border:1px solid var(--line);background:var(--paper);
  box-shadow:0 6px 16px -12px rgba(18,22,29,.5);
}
.pbar .pdot{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;white-space:nowrap;
  padding:5px 7px;border-radius:5px;background:var(--line-2);color:var(--ink-3);flex:0 0 auto;
}
.pbar .ptxt{flex:1;min-width:0}
.pbar .ptxt b{display:block;font-size:13px;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.pbar .ptxt span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:-.02em;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .pcta{
  flex:0 0 auto;font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:-.025em;
  border:0;border-radius:9px;padding:9px 12px;cursor:pointer;background:var(--ink);color:#fff;transition:.15s;
}
.pbar .pcta:hover{opacity:.84}
.pbar .pclear{flex:0 0 auto;border:0;background:none;color:#C2CAD6;font-size:17px;line-height:1;cursor:pointer;padding:4px 2px}
.pbar .pclear:hover{color:var(--ink-3)}
.pbar.draft{border-color:#D9DFE9}
.pbar.wait{border-color:#BFDCFA;background:#F5FAFF}
.pbar.wait .pdot{background:#E4F1FE;color:#1B4F8A}
.pbar.wait .pcta{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.pbar.act{border-color:#F5C99B;background:#FFF8F1}
.pbar.act .pdot{background:#FCE8D2;color:var(--amber)}
.pbar.act .pcta{background:var(--amber)}
.pbar.quoted{border-color:#A9E3CE;background:#F3FBF8}
.pbar.quoted .pdot{background:var(--ok-soft);color:var(--ok)}
.pbar.quoted .pcta{background:var(--ok)}

/* 레일 Phase 구분 */
.rail li.split{padding:2px 0 14px 24px;list-style:none}
.rail li.split::before{display:none}
.rail li.split span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--chalk-dim);border-top:1px dashed rgba(255,255,255,.25);display:block;padding-top:11px}
.rail li.p2{opacity:.78}

/* 조립 화면 구분선 */
.asm-div{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:#A9B2C0;margin:14px 0 4px;padding-top:12px;border-top:1px dashed var(--line);opacity:0;transform:translateY(6px);animation:pop .32s ease forwards}
.asm em{font-style:normal;font-size:10px;color:var(--ok);background:var(--ok-soft);border-radius:4px;padding:2px 5px;margin-left:4px}

/* Phase 2 안내 */
.ask{margin:0 20px;border:1px solid var(--line);border-radius:var(--r-l);padding:16px}
.ask-h{font-size:13.5px;font-weight:800;letter-spacing:-.03em;margin-bottom:12px}
.ask ul{list-style:none;display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.ask li{font-size:11.5px;letter-spacing:-.02em;color:var(--ink-2);background:var(--line-2);border-radius:5px;padding:5px 8px}
.ask p{font-size:12px;line-height:1.6;letter-spacing:-.025em;color:var(--ink-3)}
.ask p b{color:var(--ink);font-weight:700}
.runknown{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.16);font-size:11.5px;line-height:1.6;letter-spacing:-.02em;color:rgba(255,255,255,.68)}
.runknown b{color:var(--mint);font-weight:600}
.rdelta{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.16);font-size:11.5px;line-height:1.6;letter-spacing:-.02em;color:rgba(255,255,255,.68)}
.rdelta b{color:var(--mint);font-weight:700}

/* 예상 견적 range */
.estcard{margin:16px 20px 0;border-radius:var(--r-l);padding:22px 20px;background:#0E1726;color:#fff}
.estcard .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--mint);margin-bottom:14px}
.estcard .range{display:flex;align-items:baseline;gap:8px;letter-spacing:-.045em}
.estcard .range b{font-size:30px;font-weight:800}
.estcard .range span{font-size:18px;color:rgba(255,255,255,.45)}
.estcard .rbar{height:5px;border-radius:3px;background:rgba(255,255,255,.14);margin:18px 0 14px;overflow:hidden}
.estcard .rbar i{display:block;height:100%;width:56%;margin-left:18%;border-radius:3px;background:linear-gradient(90deg,#79E6C0,#5AA8FF)}
.estcard .rwhy{display:flex;flex-wrap:wrap;gap:5px}
.estcard .rwhy span{font-size:11px;letter-spacing:-.02em;background:rgba(255,255,255,.11);border-radius:5px;padding:5px 8px;color:rgba(255,255,255,.85)}
.estnote{margin:14px 20px 0;background:var(--brand-soft);border-radius:var(--r-m);padding:14px 15px;font-size:12.5px;line-height:1.65;letter-spacing:-.025em;color:var(--brand-ink)}
.estnote b{font-weight:700}
.estwarn{margin:10px 20px 0;font-size:11.5px;line-height:1.6;letter-spacing:-.02em;color:var(--ink-3)}

/* 접수 방식 레인 */
.lane{margin-top:14px;border-radius:var(--r-l);padding:15px 16px;background:var(--ok-soft);text-align:left}
.lane .lane-h{font-size:13px;font-weight:800;letter-spacing:-.03em;color:#0A5D49;margin-bottom:7px}
.lane p{font-size:12.5px;line-height:1.65;letter-spacing:-.025em;color:#0A5D49}
.lane p b{font-weight:700}
.lane.wait{background:var(--brand-soft)}
.lane.wait .lane-h,.lane.wait p{color:var(--brand-ink)}
.lane.warn{background:#FFF3E8}
.lane.warn .lane-h,.lane.warn p{color:var(--amber)}

/* ══════════════ 서비스 정의 ══════════════ */
const SERVICES = {

/* ── 입력 항목 계층 ──────────────────────────────────

   t:3 조율 가능 — 상담 파트너 확정 후 입력 (층수·엘베 · 거주상태 · 추가요청 · 사진)
   신청폼은 t1+t2만 받고, t3는 파트너 확정 시점으로 미룹니다. */
const COMMON = [
  {id:'addr', t:2, q:'새로 들어갈 집 주소를 알려주세요.', label:'신규 주거지 주소',

  {id:'size', t:1, q:'그 집은 몇 평인가요? 대략이면 돼요.', label:'평수',

  {id:'dday', t:2, q:'언제 들어가세요?', label:'입주 예정일',
    opts:['이번 달 안 (D-15)','다음 달 (D-40)','2~3개월 뒤 (D-75)','아직 미정']}
];

const Q = {
  full:[
    {id:'area', t:1, q:'어디를 손보고 싶으세요? 대략이면 충분해요.', label:'희망 시공 범위', multi:true,
      why:'정확한 범위는 상담에서 좁혀요',
      opts:['도배·장판','바닥·마루','주방','욕실','창호·샷시','조명·전기','확장·철거']},
    {id:'due', t:2, type:'prefill', label:'시공 희망 완료일',
      text:'시공 완료일은 <b>입주 3일 전</b>으로 잡아뒀어요.', ack:'좋아요'},
    {id:'live', t:3, q:'시공하는 동안 그 집에 사시나요?', label:'거주 상태',
      why:'공실이면 일정을 더 유연하게 잡을 수 있어요',
      opts:['시공 시 공실 예정','현재 공실','거주중·보관이사','거주하며 부분시공']}
  ],
  part:[
    {id:'area', t:1, atSelect:true, q:'어디를 손보고 싶으세요?', label:'희망 시공 범위', multi:true,
      why:'고른 분야를 하는 업체만 연결해요',
      opts:['도배·장판','바닥·마루','주방','욕실','창호·샷시','조명·전기','확장·철거']},
    {id:'due', t:2, type:'prefill', label:'시공 희망 완료일',
      text:'시공 완료일은 <b>입주 3일 전</b>으로 잡아뒀어요.', ack:'좋아요'},
    {id:'live', t:3, q:'시공할 때 그 집에 사시나요?', label:'거주 상태',
      opts:['시공 시 공실 예정','현재 공실','거주중·보관이사','거주하며 부분시공']}
  ],
  move:[
    {id:'reuse', t:1, type:'prefill', label:'도착지·평수',
      text:()=>`도착지 <b>${g('addr')}</b> · <b>${g('size')}</b>로 채웠어요.`,
      ack:'네, 맞아요'},
    {id:'type', t:1, q:'어떤 이사인가요?', label:'이사 유형',
      why:'포장 범위에 따라 금액 차이가 큽니다',
      opts:['가정이사','소형 포장','소형 반포장','소형 일반(용달)']},
    {id:'from', t:1, q:'지금 사는 곳(출발지) 주소를 알려주세요.', label:'출발지 주소',
      why:'거리를 알아야 금액이 나와요',
      opts:['서울 마포구','서울 강서구','경기 고양시','아직 안 정했어요']},
    {id:'mdate', t:2, q:'이사 날짜는 언제인가요?', label:'이사 예정일',
      opts:['입주일과 같은 날','입주 하루 전','손없는날로 맞출래요','아직 미정']},
    {id:'ffloor', t:3, q:'출발지는 몇 층이고, 엘리베이터가 있나요?', label:'출발지 층수·엘베',
      opts:['1~2층','3~5층 · 엘베 있음','3~5층 · 엘베 없음','6층 이상 · 엘베 있음','6층 이상 · 엘베 없음']},
    {id:'tfloor', t:3, q:'새 집은 몇 층이고, 엘리베이터가 있나요?', label:'도착지 층수·엘베',
      opts:['1~2층','3~5층 · 엘베 있음','3~5층 · 엘베 없음','6층 이상 · 엘베 있음','6층 이상 · 엘베 없음']},
    {id:'extra', t:3, q:'따로 챙겨야 할 짐이 있나요?', label:'추가 요청', multi:true,

  ],
  clean:[
    {id:'reuse', t:2, type:'prefill', label:'청소 장소',
      text:()=>`청소할 곳은 <b>${g('addr')} · ${g('size')}</b>입니다.`,
      ack:'네, 맞아요'},
    {id:'cday', t:2, q:'청소는 언제 할까요?', label:'청소 희망일',
      opts:()=> S.picked.has('move') ? ['이사 전날','이사 당일 오전','시공 끝난 직후','직접 고를게요']
                                      : ['입주 전날','입주 당일 오전','시공 끝난 직후','직접 고를게요']},
    {id:'cstate', t:3, q:'청소할 때 집은 비어 있나요?', label:'집 상태',

  net:[
    {id:'isp', t:2, q:'원하는 통신사가 있나요?', label:'희망 통신사', opts:['KT','SK브로드밴드','LG U+','상관없어요']},
    {id:'bundle', t:2, q:'TV도 함께 볼까요?', label:'결합 상품', opts:['인터넷만','인터넷 + TV']}
  ],
  rent:[
    {id:'item', t:2, q:'어떤 제품을 렌탈하시나요?', label:'렌탈 품목', multi:true,
      opts:['정수기','비데','공기청정기','매트리스','안마의자']}
  ],
  fix:[
    {id:'item', t:2, q:'무엇을 설치·수리하나요?', label:'품목', multi:true,
      opts:['에어컨','가전','가구','조명·전기','기타']},
    {id:'fdate', t:2, type:'prefill', label:'작업 희망일',
      text:'작업일은 <b>입주일 이후</b>로 잡을게요.', ack:'좋아요'}
  ]
};
const ATTACH = {id:'files', t:3, q:'사진이나 도면이 있으면 범위가 좁아져요.', label:'사진·도면', multi:true,
  opts:['공간 사진','도면','짐 사진','건너뛰기']};

/* 답변 조회 · 동적 문구 채우기 */
const g = k => (S.ans[k]||[]).join(', ') || '입력값';
const txt = f => typeof f.text==='function' ? f.text() : f.text;
const optsOf = f => typeof f.opts==='function' ? f.opts() : f.opts;
/* 입주 예정일 → D-day → 45일 분기 */
const DDAY = {'이번 달 안 (D-15)':15,'다음 달 (D-40)':40,'2~3개월 뒤 (D-75)':75,'아직 미정':null};
const dday = () => DDAY[(S.ans['dday']||[])[0]] ?? undefined;
const isReserve = () => { const d=dday(); return d==null || d>45; };

/* ══════════════ 상태 ══════════════ */
const LABELS = {entry:'진입',select:'서비스 선택',loading:'항목 조립',form:'최소 정보 입력',
  branch:'견적서 확인',partners:'파트너 보기',phome:'파트너홈',done:'신청 완료',match:'파트너 확정',more:'추가 정보 입력',final:'견적 확정'};
/* Phase 1 = 신청까지 · Phase 2 = 상담 파트너 확정 이후
   예상 견적 확인과 결과 선택을 한 화면으로 합쳐 퍼널을 한 단계 줄인다 */
const PHASE1 = ['entry','select','loading','form','branch','partners','phome','done'];
const PHASE2 = ['match','more','final'];
const flowKeys = () => [...PHASE1, ...PHASE2];
const afterForm = () => 'branch';
const S = {mode:'chat', screen:'entry', picked:new Set(['full']), ans:{}, log:[], qi:0, step:0, route:null, chosen:null, stage:'none', openPart:false, gen:false, rtab:null, pick:null, prod:{}};
const $ = s=>document.querySelector(s);
const screen = $('#screen');

/* 신청 진행 단계 — 재진입 시 상단 고정 진입점의 상태가 된다 */
const RANK = {none:0, draft:1, applied:2, matched:3, quoted:4};
const setStage = s => { if(RANK[s] > RANK[S.stage]) S.stage = s; };

/* ── 문항 순서 — 견적에 가장 유효한 항목부터 ──────────
   평수 → 시공 범위 → 이사 유형 → 주소 → 출발지 → 일정 → 현장 조건 */
const ORD = {
  'size':10,
  'full.area':20,'part.area':20,'move.type':30,
  'addr':40,'move.reuse':42,'move.from':45,
  'dday':50,
  'full.due':60,'part.due':60,'move.mdate':62,'move.tfloor':64,'move.ffloor':66,
  'clean.reuse':70,'clean.cday':72,'fix.item':74,'fix.fdate':76,'net.isp':78,'net.bundle':79,'rent.item':79.5,
  'full.live':80,'part.live':80,'move.extra':82,'clean.cstate':84,'files':90
};
const ordOf = f => ORD[keyOf(f)] ?? 99;

/* ── 주소지 기반 자동 채움 ─────────────────────────
   단지 정보가 있는 주소는 엘리베이터 유무를 조회해 채우고, 그 문항은 묻지 않는다 */
const ELEV_DB = {'서울 송파구':1,'서울 강남구':1,'경기 성남시':1,'서울 강서구':1,'경기 고양시':1};
const AUTOFILL = '엘베 있음 · 단지 정보';
const AUTO = {
  'move.tfloor': ()=> ELEV_DB[(S.ans['addr']||[])[0]]
    ? {v:AUTOFILL, text:'새 집은 <b>엘리베이터가 있는 단지</b>네요. 층수는 안 여쭤볼게요.'} : null,
  'move.ffloor': ()=> ELEV_DB[(S.ans['move.from']||[])[0]]
    ? {v:AUTOFILL, text:'출발지도 <b>엘리베이터가 있는 단지</b>네요.'} : null
};
function allFields(){
  const all = COMMON.map(q=>({...q, svc:null}));
  for(const k of ['full','part','move','clean','net','rent','fix']){
    if(S.picked.has(k)) (Q[k]||[]).forEach(q=>all.push({...q, svc:k}));
  }
  all.push({...ATTACH, svc:null});
  return all;
}
/* 주소가 바뀌면 자동 채움 값도 따라 갱신·해제된다 */
function syncAuto(){
  allFields().forEach(f=>{
    const A = AUTO[keyOf(f)]; if(!A) return;
    const a = A();
    if(a) S.ans[keyOf(f)] = [a.v];
    else if((S.ans[keyOf(f)]||[])[0]===AUTOFILL) delete S.ans[keyOf(f)];
  });
}
const resolveAuto = f => {
  const A = AUTO[keyOf(f)], a = A && A();
  return a ? {...f, type:'prefill', text:a.text, ack:'네, 맞아요'} : f;
};

/* 폼에서 묻는 항목 — 선택 화면에서 이미 받은 항목(atSelect)은 뺀다 */
const formQueue = () => queue(1).filter(f=>!f.atSelect);

/* 선택 서비스 기준 질문 큐
   phase 1 = t1·t2 / phase 2 = t3 + '잘 모르겠어요'로 답한 t2 항목(재확인 대상) */
const UNKNOWN = '잘 모르겠어요';
const isUnknown = f => (S.ans[keyOf(f)]||[])[0]===UNKNOWN;
function queue(phase=1){
  const all = allFields();
  const sel = phase===1
    ? all.filter(q=>(q.t||1)<=2)
    : all.filter(q=>(q.t===3 || (q.t===2 && isUnknown(q))) && (S.ans[keyOf(q)]||[])[0]!==AUTOFILL);
  return sel.map(resolveAuto).sort((a,b)=>ordOf(a)-ordOf(b));
}
const label = k => SERVICES[k].name;
const pickedList = () => [...S.picked];
/* 개별 신청 대비 안 물어본 항목 수 = 공통 반복분 + 서비스 간 prefill 재사용분 */
function saved(){
  const n = S.picked.size;
  const pre = pickedList().reduce((a,k)=>a+(Q[k]||[]).filter(f=>f.type==='prefill').length,0);
  return Math.max(0,(n-1)*COMMON.length + pre);
}

/* ══════════════ 렌더 ══════════════ */
function go(next){
  if(next==='done') setStage('applied');
  else if(next==='match') setStage('matched');
  else if(next==='final') setStage('quoted');
  else if(Object.keys(S.ans).length) setStage('draft');
  S.screen=next; render(); screen.scrollTop=0;
}
function render(){ syncAuto(); renderRail(); renderCases(); renderMode(); screen.innerHTML=''; VIEW[S.screen](); }

function renderRail(){
  const keys = flowKeys(), i = keys.indexOf(S.screen);
  $('#rail').innerHTML = keys.map((k,n)=>{
    const cls = [n<i?'done':(n===i?'now':''), PHASE2.includes(k)?'p2':''].join(' ');
    const div = k==='match' ? `<li class="split"><span>파트너 확정 이후</span></li>` : '';
    return div + `<li class="${cls}"><button data-step="${k}"><span class="n">${String(n+1).padStart(2,'0')}</span>${LABELS[k]}</button></li>`;
  }).join('');
  $('#rail').querySelectorAll('[data-step]').forEach(b=> b.onclick=()=>go(b.dataset.step));
}
function renderMode(){
  const M = [['chat','A','대화형'],['step','B','스텝형']];
  $('#modesw').innerHTML = M.map(([m,k,n])=>
    `<button data-mode="${m}" aria-pressed="${S.mode===m}"><i>${k}</i>${n}</button>`).join('');
  $('#modesw').querySelectorAll('[data-mode]').forEach(b=> b.onclick=()=>{
    S.mode=b.dataset.mode; S.qi=0; S.step=0; S.log=[]; render();
  });
}
function renderCases(){
  const cur = CASES.find(c=>c.s.length===S.picked.size && c.s.every(k=>S.picked.has(k)));
  $('#caseMenu').innerHTML = CASES.map(c=>
    `<li><button data-case="${c.id}" aria-current="${cur&&cur.id===c.id}"><i>${c.id}</i>${c.n}</button></li>`).join('');
  $('#caseMenu').querySelectorAll('[data-case]').forEach(b=> b.onclick=()=>{
    const c = CASES.find(x=>x.id===b.dataset.case);
    S.picked=new Set(c.s); S.ans={}; S.log=[]; S.qi=0; S.step=0;
    S.route=null; S.pick=null; S.prod={}; S.stage='none'; S.openPart=false; S.gen=false; S.rtab=null; S.pick=null; S.prod={};
    go('select');
  });
}

/* ── 상단 고정 진입점/* ── 상단 고정 진입점 — 진행 중인 신청으로 되돌아가는 자리 ── */
function progress(){
  if(S.stage==='none') return null;
  const svc = pickedList().map(label).join(' · ');
  if(S.stage==='draft'){
    const q1 = formQueue().filter(f=>!f.type);
    const n = q1.filter(f=>(S.ans[keyOf(f)]||[]).length).length;
    return {tone:'draft', dot:'작성 중', title:'작성하던 신청이 있어요',
      sub:`${svc} · ${n}/${q1.length} 입력함`, cta:'이어서 작성', to:'form', clear:true};
  }
  if(S.stage==='applied'){
    const wait = isReserve() && (S.picked.has('move')||S.picked.has('clean'));
    return wait
      ? {tone:'wait', dot:'예약 접수', title:'입주 45일 전에 자동으로 신청돼요',
         sub:`${svc} · 지금은 기다리시면 돼요`, cta:'내역 보기', to:'done'}
      : {tone:'wait', dot:'매칭 중', title:'업체를 찾고 있어요',
         sub:`${svc} · 영업일 1~2일 안에 견적이 도착해요`, cta:'내역 보기', to:'done'};
  }
  if(S.stage==='matched'){
    const left = queue(2).filter(f=>!(S.ans[keyOf(f)]||[]).length || isUnknown(f)).length;
    return {tone:'act', dot:'추가 정보 필요', title:'업체 3곳이 상담을 수락했어요',
      sub: left?`${left}가지만 더 채우면 견적 범위가 좁아져요`:'추가 정보를 다 채웠어요',
      cta: left?'입력하기':'견적 보기', to: left?'more':'final'};
  }
  const e = S.picked.has('move') ? estimate(2) : null;
  return {tone:'quoted', dot:'견적 도착', title: e?`예상 ${e.lo}~${e.hi}만원`:'확정 견적이 도착했어요',
    sub:`${svc} · 확인하고 계약까지 진행할 수 있어요`, cta:'견적 보기', to:'final'};
}
function progressBar(){
  const p = progress(); if(!p) return '';
  return `<div class="pbar ${p.tone}">
    <span class="pdot">${p.dot}</span>
    <div class="ptxt"><b>${p.title}</b><span>${p.sub}</span></div>
    <button class="pcta" data-pgo="${p.to}">${p.cta}</button>
    ${p.clear?`<button class="pclear" data-pclear="1" title="작성 중인 신청 지우기">×</button>`:''}
  </div>`;
}
function bindProgress(){
  const b = screen.querySelector('[data-pgo]');
  if(b) b.onclick = ()=>go(b.dataset.pgo);
  const c = screen.querySelector('[data-pclear]');
  if(c) c.onclick = ()=>{ S.ans={}; S.log=[]; S.qi=0; S.step=0; S.stage='none'; render(); };
}

/* ── A안 대화형 ─────────────────────────── */
function chatView(){
  const qs = formQueue();
  const cur = qs[S.qi];
  const done = S.qi>=qs.length;
  const ask = f => f.type ? txt(f) : f.q;

  screen.innerHTML = `
    <div class="navbar"><button id="bk">${I.back}</button><span class="t">통합 상담 신청</span></div>
    <div class="chat" id="chat"></div>
    <div class="chatdock">
      <div class="quick" id="quick"></div>
      <div class="chatbar"><span class="fake">직접 입력해도 돼요</span><span style="color:#8792A3">${I.mic}</span></div>
    </div>`;
  $('#bk').onclick = ()=>{
    if(S.qi===0) return go('select');
    S.qi--; S.log.splice(-2);
    const back = qs[S.qi]; if(back) delete S.ans[keyOf(back)];
    render();
  };

  const chat = $('#chat');
  chat.innerHTML = `<div class="bub bot"><b>${pickedList().map(label).join(' · ')}</b> 상담을 도와드릴게요.</div>`;
  let lastSvc = '__';
  S.log.forEach(m=>{
    if(m.svc && m.svc!==lastSvc){ chat.insertAdjacentHTML('beforeend',`<div class="svc-tag">${label(m.svc)}</div>`); lastSvc=m.svc; }
    if(!m.svc) lastSvc='__';
    chat.insertAdjacentHTML('beforeend',`<div class="bub ${m.who}">${m.text}</div>`);
  });

  /* 답할 때 봇 질문과 유저 답변을 함께 기록에 남긴다 */
  const answer = (text)=>{ S.log.push({who:'bot',text:ask(cur),svc:cur.svc},{who:'me',text,svc:cur.svc}); S.qi++; render(); };

  const quick = $('#quick');
  if(done){
    quick.innerHTML = `<button class="qr" id="fin">입력 완료</button>`;
    $('#fin').onclick = ()=>{ S.gen=true; go(afterForm()); };
  } else {
    if(cur.svc && cur.svc!==lastSvc) chat.insertAdjacentHTML('beforeend',`<div class="svc-tag">${label(cur.svc)}</div>`);
    if(cur.type==='note' || cur.type==='prefill'){
      chat.insertAdjacentHTML('beforeend',`<div class="bub note">${txt(cur)}</div>`);
      quick.innerHTML = `<button class="qr pale" id="ack">${cur.ack}</button>`;
      $('#ack').onclick = ()=>answer(cur.ack);
    } else {
      chat.insertAdjacentHTML('beforeend',
        `<div class="bub bot">${cur.q}${cur.why?`<br><span style="color:#8792A3;font-size:12px">${cur.why}</span>`:''}</div>`);
      const sel = S.ans[keyOf(cur)] || [];
      quick.innerHTML = optsOf(cur).map(o=>`<button class="qr" data-o="${o}" aria-pressed="${sel.includes(o)}">${o}</button>`).join('')
        + (cur.multi?`<button class="qr pale" id="ok" ${sel.length?'':'disabled style="opacity:.4"'}>고른 걸로 할게요</button>`:'');
      quick.querySelectorAll('[data-o]').forEach(b=> b.onclick=()=>{
        const o=b.dataset.o;
        if(cur.multi){
          const arr = S.ans[keyOf(cur)]||[];
          S.ans[keyOf(cur)] = arr.includes(o)?arr.filter(x=>x!==o):[...arr,o];
          render();
        } else { S.ans[keyOf(cur)]=[o]; answer(o); }
      });
      if(cur.multi) $('#ok') && ($('#ok').onclick=()=>{
        const arr=S.ans[keyOf(cur)]||[]; if(!arr.length) return;
        answer(arr.join(', '));
      });
    }
  }
  setTimeout(()=>{ screen.scrollTop = screen.scrollHeight; },10);
}
const keyOf = q => (q.svc?q.svc+'.':'')+q.id;

/* ── B안 스텝형 ─────────────────────────── */
function stepView(){
  const q1 = formQueue();
  /* 견적에 유효한 항목(평수·시공범위·이사유형·주소·출발지)을 1스텝에 모은다 */
  const groups = [q1.filter(f=>ordOf(f)<50), q1.filter(f=>ordOf(f)>=50)];
  const cur = groups[S.step], total = 2, pct = ((S.step+1)/total)*100;
  const titles = ['견적에 필요한 것','일정과 현장 정보'];
  const descs = ['여기까지만 채워도 예상 범위가 나옵니다.', ''];

  /* 서비스 단위로 묶어 표시하되 순서는 유지한다 */
  const blocks=[]; let last='__';
  cur.forEach(f=>{
    const key = f.svc||'공통';
    if(key!==last){ blocks.push({key, items:[]}); last=key; }
    blocks[blocks.length-1].items.push(f);
  });

  const body = blocks.map(b=>`
    <div class="fsec">
      <div class="fsec-h"><b>${b.key==='공통'?'우리 집':label(b.key)}</b>${b.key==='공통'&&S.step===0?'<span class="tagx">1회만 입력</span>':''}</div>
      ${b.items.map(f=>{
        if(f.type==='note'||f.type==='prefill')
          return `<div class="prefill" style="margin-top:14px">${I.check} <span>${txt(f)}</span></div>`;
        return fieldHTML(f);
      }).join('')}
    </div>`).join('') + (S.step===1?`
    <div class="fsec">
      <div class="fsec-h"><b>제출 전 확인</b></div>
      <p class="desc">나머지는 <b>업체가 정해진 뒤</b>에 받을게요.</p>
      <div class="field"><div class="lb">개인정보 제공 동의 <span class="req">필수</span></div>
        <p class="why"><b>업체 최대 5곳</b>에만 전달됩니다.</p>
        <div class="opts"><button class="opt" data-agree="1" aria-pressed="${!!S.ans['agree']}">동의하고 진행할게요</button></div>
      </div>
    </div>`:'');

  const canNext = cur.filter(f=>!f.type).every(f=>S.ans[keyOf(f)]?.length)
    && (S.step===1 ? !!S.ans['agree'] : true);

  screen.innerHTML = `
    <div class="navbar"><button id="bk">${I.back}</button><span class="t">통합 상담 신청</span></div>
    <div class="prog"><div class="bar"><i style="width:${pct}%"></i></div>
      <div class="meta"><span>STEP ${S.step+1} / ${total} · ${titles[S.step]}</span><span>${Math.round(pct)}%</span></div></div>
    <div class="form">${descs[S.step]?`<p class="stepdesc">${descs[S.step]}</p>`:''}${body}</div>
    <div class="dock">
      <button class="btn" id="next" ${canNext?'':'disabled'}>${S.step<1?'다음':'입력 완료'}</button>
    </div>`;

  $('#bk').onclick = ()=> S.step>0 ? (S.step--,render()) : go('select');
  screen.querySelectorAll('[data-f]').forEach(b=> b.onclick=()=>{
    const {f:key,o,multi}=b.dataset;
    if(multi==='1'){ const arr=S.ans[key]||[]; S.ans[key]=arr.includes(o)?arr.filter(x=>x!==o):[...arr,o]; }
    else S.ans[key]=[o];
    render();
  });
  const ag = screen.querySelector('[data-agree]'); if(ag) ag.onclick=()=>{ S.ans['agree']=!S.ans['agree']; render(); };
  $('#next').onclick = ()=>{ if(S.step<1){S.step++; render(); screen.scrollTop=0;} else { S.gen=true; go(afterForm()); } };
}
function fieldHTML(f){
  const key=keyOf(f), sel=S.ans[key]||[];
  return `<div class="field">
    <div class="lb">${f.label}${f.optional?'<span class="opt">선택</span>':'<span class="req">필수</span>'}</div>
    ${f.why?`<p class="why">${f.why}</p>`:''}
    <div class="opts">${optsOf(f).map(o=>`<button class="opt" data-f="${key}" data-o="${o}" data-multi="${f.multi?1:0}" aria-pressed="${sel.includes(o)}">${o}</button>`).join('')}</div>
  </div>`;
}

/* ── 예상 견적가 range (이사) ─────────────
   phase 1 = 최소 정보만 있는 상태 → 범위가 넓다
   phase 2 = 층수·엘베·추가짐까지 채운 상태 → 범위가 좁아진다 */
function estimate(phase){
  const size=(S.ans['size']||[])[0]||'30평대';
  const type=(S.ans['move.type']||[])[0]||'가정이사';
  const md=(S.ans['move.mdate']||[])[0]||'';
  const ff=(S.ans['move.ffloor']||[])[0], tf=(S.ans['move.tfloor']||[])[0];
  const ex=(S.ans['move.extra']||[]);
  const BASE={'10평 이하':38,'10평대':52,'20평대':68,'30평대':85,'40평대':105,'50평대':125,'60평대':145,'70평 이상':170};
  const MUL={'가정이사':1,'소형 포장':0.62,'소형 반포장':0.5,'소형 일반(용달)':0.38};
  const ladder = s => !s ? 0 : (s.includes('엘베 없음') ? (s.startsWith('6층')?25:12) : 0);
  let v=(BASE[size]||85)*(MUL[type]??1);
  const why=[type, size], unknown=[];
  const kn = s => s && s!==UNKNOWN;
  if((S.ans['move.from']||[])[0]==='아직 안 정했어요') unknown.push('출발지'); else why.push('수도권 내 이동');
  if(md==='손없는날로 맞출래요'){ v*=1.18; why.push('손없는날 +18%'); }
  if(kn(ff)&&kn(tf)){
    const L=ladder(ff)+ladder(tf); v+=L;
    why.push(L>0?`사다리차 ${L}만원`:'양쪽 엘베 있음');
  } else unknown.push('층수·엘베');
  if(phase===2){
    if(ex.includes('에어컨 이전설치')){ v+=12; why.push('에어컨 이전'); }
    if(ex.includes('보관이사')){ v*=1.25; why.push('보관이사'); }
    if(ex.includes('피아노·금고')){ v+=10; why.push('피아노·금고'); }
    if(!ex.length) unknown.push('추가 짐');
  } else unknown.push('추가 짐');
  const w = unknown.length===0 ? [0.9,1.12] : unknown.length===1 ? [0.86,1.28] : [0.82,1.5];
  return {lo:Math.round(v*w[0]/5)*5, hi:Math.round(v*w[1]/5)*5, why, unknown};
}

function serviceSheet(k, idx, total){
  const own = queue(1).filter(f=>f.svc===k && f.type!=='note');
  const common = COMMON.map(f=>`<div class="sh-row"><span>${f.label}</span><b>${g(f.id)}<i>공통</i></b></div>`).join('');
  const rows = own.map(f=>{
    const v = g(keyOf(f));
    const auto = v===AUTOFILL || f.type==='prefill';
    return `<div class="sh-row"><span>${f.label}</span><b>${v}${auto?'<i class="auto">자동</i>':''}</b></div>`;
  }).join('');
  const wait = (k==='move'||k==='clean') && isReserve();
  const e = k==='move' ? estimate(1) : null;
  return `<section class="sheet">
    <header>
      <span class="sh-ic">${SERVICES[k].icon}</span>
      <span class="sh-t"><b>${SERVICES[k].name}</b><span>견적서 ${idx}/${total}</span></span>
      <button class="sh-edit" data-edit="1">수정</button>
    </header>
    <div class="sh-body">${common}${rows}</div>
    ${e?`<div class="sh-est"><span>예상 견적</span><b>${e.lo}~${e.hi}만원</b>
      ${e.unknown.length?`<em>${e.unknown.join(' · ')} 미확인</em>`:''}</div>`:''}
    <footer class="sh-f ${wait?'wait':''}">
      <b>${LEAD[k].who}</b><span>${LEAD[k].what}</span>
      <em>${wait?'입주 45일 전 자동 접수':'바로 접수'}</em>
    </footer>
  </section>`;
}

        : '카드를 누르면 파트너홈으로 이동해요'}</p>
      <button class="btn" id="act" ${isProd&&selIdx===null?'disabled':''}>
        ${isProd?'이 상품으로 상담받기':'파트너 둘러보기'}</button>
    </div>`;

  $('#bk').onclick = ()=>go('branch');
  screen.querySelectorAll('[data-tab]').forEach(b=> b.onclick=()=>{ S.rtab=b.dataset.tab; render(); screen.scrollTop=0; });
  screen.querySelectorAll('[data-p]').forEach(b=> b.onclick=()=>{
    const i=+b.dataset.p;
    if(isProd){ S.prod=S.prod||{}; S.prod[k] = S.prod[k]===i?undefined:i; render(); }
    else { S.pick={svc:k,i}; go('phome'); }
  });
  $('#act').onclick = ()=>{
    if(isProd){ S.pick={svc:k,i:selIdx}; go('done'); }
    else { S.pick={svc:k,i:0}; go('phome'); }
  };
};

/* ── 파트너홈 ─────────────────────────── */
VIEW.phome = ()=>{
  const p = chosenRec(); if(!p) return go('partners');
  const k = S.pick.svc;
  screen.innerHTML = `
    <div class="navbar"><button id="bk">${I.back}</button><span class="t">${SERVICES[k].name} 파트너</span></div>
    <div class="ph-head">
      <span class="ph-av">${p.n.slice(0,1)}</span>
      <h2>${p.n}</h2>
      <p>★ ${p.r} · 리뷰 ${p.c}개 · ${g('addr')} 활동</p>
      <div class="tags">${p.tags.map(t=>`<i>${t}</i>`).join('')}</div>
    </div>
    <div class="ph-stat">
      <div><b>${p.c}</b><span>누적 리뷰</span></div>
      <div><b>${p.r}</b><span>평균 별점</span></div>
      <div><b>1일</b><span>평균 응답</span></div>
    </div>
    <h4 class="sec-t">시공 사례</h4>
    <div class="ph-grid">${[0,1,2,3].map(i=>`<div class="ph-th t${i}"></div>`).join('')}</div>
    <h4 class="sec-t">리뷰</h4>
    <div class="ph-rev">
      <div class="rv"><b>★ 5.0</b><p>상담부터 마무리까지 일정이 밀리지 않았어요. 사진으로 진행 상황을 계속 보내주셔서 편했습니다.</p></div>
      <div class="rv"><b>★ 4.8</b><p>예산 안에서 우선순위를 같이 정해주셔서 과하게 쓰지 않았어요.</p></div>
    </div>
    <div style="height:20px"></div>
    <div class="dock sticky">
      <div class="dock2">
        <button class="btn alt" id="more">다른 파트너 보기</button>
        <button class="btn" id="req">견적 요청하기</button>
      </div>
    </div>`;
  $('#bk').onclick = ()=>go('partners');
  $('#more').onclick = ()=>go('partners');
  $('#req').onclick = ()=>go('done');
};

/* ── 완료 ─────────────────────────────── */
VIEW.done = ()=>{
  const p = S.route==='browse' ? chosenRec() : null;
  const one = !!p, prod = one && PRODUCT_SVC.has(S.pick.svc);
  screen.innerHTML = `
    <div class="done">
      <div class="seal">${I.seal}</div>
      <h2>${one?(prod?`${p.n}으로<br>상담 신청했어요`:`${p.n}에<br>견적을 요청했어요`):`<mark>최대 5곳</mark>이<br>견적을 보내드릴게요`}</h2>
      <p>${one?(prod?`${p.brand} · ${p.price}`:'업체가 확인하면 알려드릴게요.'):'리뷰·포트폴리오가 좋은 업체만 골랐어요.'}</p>
      <div class="expect">
        <div class="er"><span class="k">누가</span><span class="v">${one?`<b>${p.n}</b> 1곳`:`<b>업체 최대 5곳</b>. 그 이상은 연락하지 않아요.`}</span></div>
        <div class="er"><span class="k">언제</span><span class="v"><b>영업일 1~2일</b> 안에 도착해요</span></div>
        <div class="er"><span class="k">어떻게</span><span class="v">앱 알림·메시지로 먼저, <b>원할 때만 통화</b></span></div>
      </div>
      ${(S.picked.has('move')||S.picked.has('clean'))?`
      <div class="lane ${isReserve()?'wait':''}">
        <div class="lane-h">${isReserve()?'이사·청소는 예약 접수했어요':'이사·청소는 바로 접수됐어요'}</div>
        <p>${isReserve()
          ? `<b>입주 45일 전</b>에 자동으로 신청하고 알려드릴게요.`
          : `입주까지 <b>${dday()}일</b> 남아 바로 매칭에 들어갔어요.`}</p>
      </div>`:''}
      ${(S.ans['move.from']||[])[0]==='아직 안 정했어요'?`
      <div class="lane warn">
        <div class="lane-h">출발지는 상담에서 확인할게요</div>
        <p><b>거리를 몰라 견적이 범위로만 나와요.</b> 업체가 상담에서 먼저 물어봅니다.</p>
      </div>`:''}
      <p class="optout"><u>언제든 연락 그만 받기</u></p>
      <div class="statlist">
        <div class="st-cap">접수된 견적서 ${pickedList().length}건</div>
        ${pickedList().map(k=>{
          const wait = (k==='move'||k==='clean') && isReserve();
          return `<div class="st-row">
            <span class="st-ic">${SERVICES[k].icon}</span>
            <span class="st-t"><b>${SERVICES[k].name}</b><span>${LEAD[k].who}</span></span>
            <span class="st-b ${wait?'wait':''}">${wait?'예약 접수':'매칭 중'}</span>
          </div>`;
        }).join('')}
        <p class="st-note">건마다 따로 진행되고, 하나만 취소할 수 있어요.</p>
      </div>
      <div style="margin-top:26px">
        <button class="btn" id="hub">신청 내역 보기</button>

        <button class="btn ghost" id="again">시공생활탭으로 나가기</button>
      </div>
    </div>`;
  $('#hub').onclick = ()=>go('match');
  $('#again').onclick = ()=>go('entry');
};

/* ══════════════ PHASE 2 — 상담 파트너 확정 이후 ══════════════ */
VIEW.match = ()=>{
  const q2 = queue(2);
  screen.innerHTML = `
    <div class="navbar"><button id="bk">${I.back}</button><span class="t">신청 내역</span></div>
    <div class="h-lead"><h2>업체 3곳이<br>상담을 수락했어요</h2>
      <p>신청할 때 안 여쭤본 것들을 지금 채우면 견적이 좁아져요.</p></div>
    <div class="plist" style="padding-bottom:20px">
      ${(RECS[recSvcs().find(k=>!PRODUCT_SVC.has(k))||'full']||[]).slice(0,3).map(p=>`
        <div class="pcard" style="cursor:default">
          <div class="ph">
            <span class="av">${p.n.slice(0,1)}</span>
            <span class="nm"><b>${p.n}</b><span>★ ${p.r} · 리뷰 ${p.c}</span></span>
            <span class="rk" style="color:var(--ok);background:var(--ok-soft)">수락</span>
          </div>
        </div>`).join('')}
    </div>
    <div class="ask">
      <div class="ask-h">업체가 견적을 확정하려면 ${q2.length}가지가 더 필요해요</div>
      <ul>${q2.map(f=>`<li>${f.svc?label(f.svc)+' · ':''}${f.label}</li>`).join('')}</ul>
      <p>지금 채우면 업체가 <b>전화로 다시 묻지 않아요.</b></p>
    </div>
    <div class="dock">
      <button class="btn" id="go2">추가 정보 입력하고 견적 좁히기</button>
      <button class="btn ghost" id="later">나중에 할게요</button>
    </div>`;
  $('#bk').onclick = ()=>go('done');
  $('#go2').onclick = ()=>{ S.step2=0; go('more'); };
  $('#later').onclick = ()=>go('entry');
};

VIEW.more = ()=>{
  const q2 = queue(2);
  const filled = q2.filter(f=>(S.ans[keyOf(f)]||[]).length).length;
  const pct = Math.round(filled/q2.length*100);
  const groups = {};
  q2.forEach(f=>{ const k=f.svc||'공통'; (groups[k]=groups[k]||[]).push(f); });
  screen.innerHTML = `
    <div class="navbar"><button id="bk">${I.back}</button><span class="t">추가 정보</span></div>
    <div class="prog"><div class="bar"><i style="width:${pct}%"></i></div>
      <div class="meta"><span>${filled} / ${q2.length} 항목</span><span>채울수록 범위가 좁아져요</span></div></div>
    <div class="form">
      ${Object.entries(groups).map(([k,fs])=>`
        <div class="fsec">
          <div class="fsec-h"><b>${k==='공통'?'사진·도면':label(k)}</b><span class="tagx" style="color:var(--ink-3);background:var(--line-2)">조율 가능</span></div>
          ${fs.map(f=>fieldHTML({...f, optional:true})).join('')}
        </div>`).join('')}
    </div>
    <div class="dock">
      <p class="hint">${filled===q2.length?'<b>다 채웠어요</b>':`${q2.length-filled}개 남음 · 멈춰도 저장돼요`}</p>
      <button class="btn" id="fin2">${filled?'입력 마치고 견적 보기':'건너뛰고 견적 보기'}</button>
    </div>`;
  $('#bk').onclick = ()=>go('match');
  screen.querySelectorAll('[data-f]').forEach(b=> b.onclick=()=>{
    const {f:key,o,multi}=b.dataset;
    if(multi==='1'){ const arr=S.ans[key]||[]; S.ans[key]=arr.includes(o)?arr.filter(x=>x!==o):[...arr,o]; }
    else S.ans[key]=[o];
    render();
  });
  $('#fin2').onclick = ()=>go('final');
};

VIEW.final = ()=>{
  const hasMove = S.picked.has('move');
  const e1 = hasMove ? estimate(1) : null;
  const e2 = hasMove ? estimate(2) : null;
  const narrowed = hasMove && (e1.hi-e1.lo) > (e2.hi-e2.lo);
  screen.innerHTML = `
    <div class="navbar"><button id="bk">${I.back}</button><span class="t">견적 확정</span></div>
    ${hasMove?`
    <div class="h-lead"><h2>${narrowed?'범위가 좁아졌어요':'아직 범위가 넓어요'}</h2>
      <p>${narrowed?'채워주신 정보로 다시 계산했어요.':'비어 있는 값이 있어 넉넉하게 잡았어요.'}</p></div>
    <div class="estcard">
      <div class="cap">확정 견적 범위</div>
      <div class="range"><b>${e2.lo}만</b><span>~</span><b>${e2.hi}만원</b></div>
      <div class="rbar"><i style="width:${narrowed?'34%':'76%'};margin-left:${narrowed?'30%':'8%'}"></i></div>
      <div class="rwhy">${e2.why.map(w=>`<span>${w}</span>`).join('')}</div>
      ${narrowed?`<div class="rdelta">${e1.lo}~${e1.hi} → ${e2.lo}~${e2.hi}만원 · <b>폭 ${Math.round((1-(e2.hi-e2.lo)/(e1.hi-e1.lo))*100)}% 감소</b></div>`:''}
      ${e2.unknown.length?`<div class="runknown">비어 있는 값 — ${e2.unknown.join(' · ')}</div>`:''}
    </div>`:`
    <div class="h-lead"><h2>추가 정보를<br>업체에 전달했어요</h2></div>`}
    <div class="expect" style="margin:20px 20px 0">
      <div class="er"><span class="k">다음</span><span class="v"><b>확정 견적서</b>가 도착하면 알림</span></div>
      <div class="er"><span class="k">계약</span><span class="v"><b>앱 안에서 계약</b>까지 진행</span></div>
      <div class="er"><span class="k">변경</span><span class="v">추가 정보는 <b>언제든 수정</b></span></div>
    </div>
    <div style="padding:24px 20px 30px">
      <button class="btn ghost" id="again">시공생활탭으로 나가기</button>
    </div>`;
  $('#bk').onclick = ()=>go('more');
  $('#again').onclick = ()=>go('entry');
};

/* ══════════════ 케이스 시나리오 ══════════════ */
const CASES = [
  {id:'C1',  n:'종합시공 단독',           s:['full']},
  {id:'C2',  n:'부분시공 단독',           s:['part']},
  {id:'C3',  n:'이사 단독',               s:['move']},
  {id:'C4',  n:'이사청소 단독',           s:['clean']},
  {id:'C5',  n:'종합시공 + 이사',         s:['full','move']},
  {id:'C6',  n:'종합시공 + 청소',         s:['full','clean']},
  {id:'C7',  n:'이사 + 청소',           s:['move','clean']},
  {id:'C8',  n:'시공 + 이사 + 청소',    s:['full','move','clean']},
  {id:'C9',  n:'부분시공 + 설치·수리',    s:['part','fix']},
  {id:'C10', n:'종합시공 + 인터넷',       s:['full','net']},
  {id:'C11', n:'이사 + 청소 + 인터넷',    s:['move','clean','net']},
  {id:'C12', n:'전체 선택',             s:['full','part','move','clean','net','rent','fix']}
];
render();
</script>
</body>
</html>
