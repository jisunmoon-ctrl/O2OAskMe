body.preview-only .phone:has(.home-gnb) .fab-entry{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.fab-entry .fe-roll{position:relative;z-index:1;flex:0 0 auto;height:24px;overflow:hidden}
.fab-entry .fe-track{display:flex;flex-direction:column;transition:transform .42s cubic-bezier(.65,0,.35,1)}
/* 라벨 그라디언트(96.19deg #3073E6→#00C6BC)는 ODS 토큰 미보유 → [예외 기록] raw 값 사용 */
.fab-entry .fe-item{height:24px;line-height:24px;white-space:nowrap;
  background:linear-gradient(96.19deg,#3073E6 16.94%,#00C6BC 110.57%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.fab-sizer{position:absolute;left:-9999px;top:0;white-space:nowrap;visibility:hidden}

.phone{
  width:392px;height:800px;background:var(--ods-background);border-radius:38px;
  box-shadow:0 0 0 10px var(--hz-bezel), 0 0 0 11px rgba(0,0,0,.28), 0 26px 60px -22px rgba(0,0,0,.35);
  overflow:hidden;position:relative;display:flex;flex-direction:column;color:var(--ods-foreground);
}
/* statusbar = OS chrome (Apple iOS 시스템 상태바). ODS 규칙 대상 아님 —
   시스템 폰트(SF)·OS 시스템 글리프(셀룰러/와이파이/배터리)를 사용한다. */
.statusbar{height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px 0 27px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;
  color:#000;background:var(--ods-background);position:relative;z-index:5}
.statusbar .sb-time{font-size:15px;font-weight:600;letter-spacing:.3px;line-height:1;font-variant-numeric:tabular-nums}
.statusbar .sb-icons{display:flex;align-items:center;gap:7px}
.statusbar .sb-icons svg{display:block;flex:0 0 auto}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin}
.screen::-webkit-scrollbar{width:0}

/* ═══════════════════════════════════════════════════════════
   ODS 컴포넌트 — @bucketplace/design-system 11.5.1 스펙 재현
   (self-contained HTML 이라 React 패키지를 못 쓰므로 스펙·토큰을 그대로 옮김)
   ═══════════════════════════════════════════════════════════ */

/* ── BoxButton ── src/components/ods/buttons/BoxButton ────── */
.ods-btn{
  font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  box-sizing:border-box;position:relative;flex-shrink:0;white-space:nowrap;
  border:1px solid;outline:none;background:none;
  transition:transform 111ms cubic-bezier(.2,0,.2,1.05);
}
.ods-btn:active:not([data-disabled]):not([data-loading]){transform:scale(.97)}
.ods-btn[data-disabled],.ods-btn[data-loading]{pointer-events:none;cursor:default}
.ods-btn[data-fullwidth]{width:100%}
.ods-btn[data-size="extra-large"]{height:48px;border-radius:var(--ods-radius-8)}
.ods-btn[data-size="large"]{height:44px;border-radius:var(--ods-radius-8)}
.ods-btn[data-size="medium"]{height:40px;border-radius:var(--ods-radius-8)}
.ods-btn[data-size="small"]{height:32px;border-radius:var(--ods-radius-6)}
.ods-btn[data-size="extra-small"]{height:28px;border-radius:var(--ods-radius-6)}
.ods-btn[data-variant="normal"]{background-color:var(--ods-background);border-color:var(--ods-border)}
.ods-btn[data-variant="subtle"]{background-color:var(--ods-background-weak);border-color:var(--ods-transparent)}
.ods-btn[data-variant="solid"]{background-color:var(--ods-background-inverse);border-color:var(--ods-transparent)}
.ods-btn[data-variant="solid"][data-disabled]{background-color:var(--ods-background-disabled)}
.ods-btn[data-variant="outlined"]{background-color:var(--ods-background);border-color:var(--ods-border-strong);border-width:1.5px}
.ods-btn[data-variant="outlined"][data-disabled]{border-color:var(--ods-border)}
.ods-btn[data-variant="brand-solid"]{background-color:var(--ods-background-brand);border-color:var(--ods-transparent)}
.ods-btn[data-variant="brand-solid"][data-disabled]{background-color:var(--ods-background-disabled)}
.ods-btn[data-variant="brand-outlined"]{background-color:var(--ods-background);border-color:var(--ods-border-brand)}
.ods-btn[data-variant="brand-outlined"][data-disabled]{border-color:var(--ods-border)}
/* BoxButton.Slot */
.ods-btn-slot{display:inline-flex;align-items:center;gap:4px}
.ods-btn[data-size="extra-large"] .ods-btn-slot[data-side="center"]{padding:0 19px}
.ods-btn[data-size="large"] .ods-btn-slot[data-side="center"]{padding:0 16px}
.ods-btn[data-size="medium"] .ods-btn-slot[data-side="center"]{padding:0 13px}
.ods-btn[data-size="small"] .ods-btn-slot[data-side="center"]{padding:0 10px}
.ods-btn[data-size="extra-small"] .ods-btn-slot[data-side="center"]{padding:0 8px}
/* BoxButton.Label */
.ods-btn-label{font-weight:500}
.ods-btn[data-size="extra-large"] .ods-btn-label{font-size:16px;line-height:20px;letter-spacing:-.3px}
.ods-btn[data-size="large"] .ods-btn-label{font-size:15px;line-height:24px;letter-spacing:-.3px}
.ods-btn[data-size="medium"] .ods-btn-label{font-size:14px;line-height:18px;letter-spacing:-.3px}
.ods-btn[data-size="small"] .ods-btn-label{font-size:13px;line-height:18px;letter-spacing:-.3px}
.ods-btn[data-size="extra-small"] .ods-btn-label{font-size:12px;line-height:16px;letter-spacing:-.3px}
.ods-btn[data-variant="normal"] .ods-btn-label,
.ods-btn[data-variant="subtle"] .ods-btn-label,
.ods-btn[data-variant="outlined"] .ods-btn-label{color:var(--ods-foreground)}
.ods-btn[data-variant="solid"] .ods-btn-label{color:var(--ods-foreground-inverse)}
.ods-btn[data-variant="brand-solid"] .ods-btn-label{color:#FFFFFF}
.ods-btn[data-variant="brand-outlined"] .ods-btn-label{color:var(--ods-foreground-brand)}
.ods-btn[data-disabled] .ods-btn-label{color:var(--ods-foreground-disabled)}
/* 줄바꿈 라벨(2행 CTA)은 높이 고정을 풀어 ODS 높이 규칙을 벗어나지 않게 auto 로 둔다 */
.ods-btn[data-multiline]{height:auto;min-height:48px;padding:10px 0}
.ods-btn[data-multiline] .ods-btn-label{white-space:normal;text-align:center;line-height:1.35}

/* ── TextButton ── src/components/ods/buttons/TextButton ──── */
.ods-textbtn{
  font-family:inherit;background:none;border:none;cursor:pointer;
  padding:4px 8px;border-radius:var(--ods-radius-4);display:inline-flex;align-items:center;gap:4px;
}
.ods-textbtn[data-size="14"]{font-size:14px;line-height:18px;letter-spacing:-.3px}
.ods-textbtn[data-size="16"]{font-size:16px;line-height:20px;letter-spacing:-.3px;font-weight:500}
.ods-textbtn[data-variant="primary"]{color:var(--ods-foreground-brand)}
.ods-textbtn[data-variant="neutral-500"]{color:var(--ods-foreground-weak)}
.ods-textbtn[data-variant="neutral-600"]{color:var(--ods-foreground)}
.ods-textbtn:hover{background:var(--ods-background-weak)}

/* ── Chip ── src/components/ods/chip ──────────────────────── */
.ods-chip{
  position:relative;display:inline-flex;align-items:center;flex-shrink:0;white-space:nowrap;
  border-radius:var(--ods-radius-full);box-sizing:border-box;height:38px;padding:0 8px;
  font-family:inherit;background:none;border:0;cursor:pointer;transition:.14s;
}
.ods-chip[data-size="sm"]{height:32px;padding:0 4px}
.ods-chip::before{content:"";position:absolute;inset:0;border-radius:inherit}
.ods-chip[data-variant="normal"]{background-color:var(--ods-background);color:var(--ods-foreground)}
.ods-chip[data-variant="normal"]::before{border:1px solid var(--ods-border)}
.ods-chip[data-variant="outlined"]{background-color:var(--ods-background);color:var(--ods-foreground)}
.ods-chip[data-variant="outlined"]::before{border:1px solid var(--ods-border-strong)}
.ods-chip[data-variant="solid"]{background-color:var(--ods-background-inverse);color:var(--ods-foreground-inverse)}
.ods-chip[data-variant="solid"]::before{border:1px solid var(--ods-transparent)}
.ods-chip[data-variant="subtle"]{background-color:var(--ods-background-weak);color:var(--ods-foreground)}
.ods-chip[data-variant="subtle"]::before{border:1px solid var(--ods-transparent)}
.ods-chip[data-disabled]{color:var(--ods-foreground-disabled);pointer-events:none}
.ods-chip[data-variant="solid"][data-disabled]{background-color:var(--ods-background-disabled)}
.ods-chip:hover:not([data-disabled])::before{border-color:var(--ods-palette-gray-200)}
.ods-chip[data-variant="outlined"]:hover::before,
.ods-chip[data-variant="solid"]:hover::before{border-color:var(--ods-transparent)}
/* Chip.Slot / Chip.Label */
.ods-chip-slot{position:relative;display:inline-flex;align-items:center;gap:4px}
.ods-chip-slot[data-side="center"]{padding:0 6px}
.ods-chip-label{font-size:14px;line-height:18px;letter-spacing:-.3px;font-weight:400}
.ods-chip[data-variant="outlined"] .ods-chip-label{font-weight:600}

/* ── Checkbox ── src/components/ods/checkbox ─────────────── */
.ods-cbx{display:inline-flex;align-items:center;gap:8px}
.ods-cbx-ind{
  display:inline-flex;align-items:center;justify-content:center;position:relative;
  border:1px solid var(--ods-border);border-radius:var(--ods-radius-4);box-sizing:border-box;
  background-color:var(--ods-background);transition:border-color .1s,background-color .1s;
  flex:0 0 auto;color:var(--ods-foreground-inverse);
}
.ods-cbx-ind[data-size="medium"]{width:20px;height:20px}
.ods-cbx-ind[data-size="small"]{width:18px;height:18px}
.ods-cbx-ind svg{display:none}
.ods-cbx-ind[data-state="checked"]{border-color:var(--ods-transparent);background-color:var(--ods-background-inverse)}
.ods-cbx-ind[data-state="checked"] svg{display:block}
.ods-cbx-label{color:var(--ods-foreground);font-size:14px;line-height:20px;letter-spacing:-.3px}

/* ── Tab ── src/components/ods/tab ───────────────────────── */
.ods-tablist{background-color:var(--ods-background);display:flex;align-items:stretch;
  overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.ods-tablist::-webkit-scrollbar{display:none}
.ods-tablist[data-scrollable]{padding:0 16px;gap:10px}
.ods-tablist:not([data-scrollable])>*{flex:1 0 0;min-width:0}
.ods-tab{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:10px 6px;gap:4px;color:var(--ods-foreground-weak);background:none;border:0;
  font-family:inherit;cursor:pointer}
.ods-tab::after{content:"";display:block;position:absolute;left:0;bottom:0;width:100%;height:2px;
  background-color:var(--ods-foreground);transition:transform .2s;transform:scale(0)}
.ods-tab[data-state="active"]{color:var(--ods-foreground)}
.ods-tab[data-state="active"]::after{transform:scale(1)}
.ods-tab-text{font-size:15px;line-height:24px;letter-spacing:-.3px;font-weight:700}

/* ── SquareBadge ── src/components/ods/badges ────────────── */
.ods-sqbadge{
  display:inline-flex;justify-content:center;align-items:center;flex-direction:row;gap:4px;flex-shrink:0;
  border-radius:var(--ods-radius-4);font-weight:700;letter-spacing:-.3px;
  background:var(--ods-background-critical);color:var(--ods-foreground-inverse);
}
.ods-sqbadge[data-size="16"]{font-size:10px;line-height:14px;height:16px;padding:0 4px}
.ods-sqbadge[data-size="20"]{font-size:12px;line-height:16px;height:20px;padding:0 6px}
.ods-sqbadge[data-size="24"]{font-size:12px;line-height:16px;height:24px;padding:0 6px}
.ods-sqbadge[data-variant="primary"]{background:var(--ods-background-brand);color:var(--ods-foreground-inverse)}
.ods-sqbadge[data-variant="accent"]{background:var(--ods-background-critical);color:var(--ods-foreground-inverse)}
.ods-sqbadge[data-variant="neutral300"]{background:var(--ods-background-weak);color:var(--ods-foreground-weak)}
.ods-sqbadge[data-variant="neutral500"]{background:var(--ods-foreground-weak);color:var(--ods-foreground-inverse)}
.ods-sqbadge[data-variant="base2_outline"]{background:var(--ods-background);border:1px solid var(--ods-border);
  color:var(--ods-foreground-weak);box-sizing:border-box}
.ods-sqbadge[data-variant="attention"]{background:var(--ods-background-attention-weak);color:var(--ods-foreground-attention)}
.ods-sqbadge[data-variant="brand-weak"]{background:var(--ods-background-brand-weak);color:var(--ods-foreground-brand)}

/* ── PillBadge ── */
.ods-pillbadge{display:inline-flex;justify-content:center;align-items:center;border-radius:47px;
  font-weight:700;letter-spacing:-.3px;background:var(--ods-background-critical);color:var(--ods-foreground-inverse);
  font-size:10px;line-height:14px;height:16px;padding:0 6px}

/* ── Spinner ── src/components/ods/spinner ───────────────── */
.ods-spinner{display:inline-block;color:var(--ods-foreground)}
.ods-spinner svg{display:block;animation:ods-rotate .9s linear infinite;transform-origin:center}
.ods-spinner .sp-track{stroke:currentColor;opacity:.18}
.ods-spinner .sp-arc{stroke:currentColor}
@keyframes ods-rotate{to{transform:rotate(360deg)}}

/* ── CautionBox ── src/components/ods/caution-box ────────── */
.ods-caution{padding:12px 16px;border:1px solid var(--ods-border);border-radius:var(--ods-radius-4);
  background-color:var(--ods-background-weak);color:var(--ods-foreground)}
.ods-caution .cb-head{display:flex;gap:6px;align-items:flex-start}
.ods-caution .cb-head svg{flex:0 0 auto;margin-top:3px}
.ods-caution .cb-title{font-size:16px;line-height:24px;letter-spacing:-.3px;font-weight:700}
.ods-caution .cb-desc{font-size:15px;line-height:24px;letter-spacing:-.3px;font-weight:400;margin-top:4px}
.ods-caution[data-tone="brand"]{background-color:var(--ods-background-brand-weak);border-color:var(--ods-background-brand-weak);color:var(--ods-foreground)}
.ods-caution[data-tone="brand"] svg{color:var(--ods-foreground-brand)}
.ods-caution[data-tone="attention"]{background-color:var(--ods-background-attention-weak);border-color:var(--ods-background-attention-weak);color:var(--ods-foreground-attention)}
.ods-caution[data-tone="attention"] svg{color:var(--ods-foreground-attention)}
.ods-caution[data-tone="critical"]{background-color:var(--ods-background-critical-weak);border-color:var(--ods-background-critical-weak);color:var(--ods-foreground-critical)}
.ods-caution[data-tone="critical"] svg{color:var(--ods-foreground-critical)}

/* ── Divider ── src/components/ods/divider ───────────────── */
.ods-divider{margin:0;padding:0;border:none;height:1px;background-color:var(--ods-border)}
.ods-divider[data-height="12"]{height:12px;background-color:var(--ods-background-weak)}

/* ── Avatar / Thumbnail ── */
.ods-avatar{border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:var(--ods-background-weak);color:var(--ods-foreground-weak);overflow:hidden}
.ods-thumb{border-radius:var(--ods-radius-8);background:var(--ods-background-weak);overflow:hidden}

/* ── Input(SearchField 계열) ── src/components/ods/input ─── */
.ods-input{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;
  border:1px solid var(--ods-border);border-radius:var(--ods-radius-4);background:var(--ods-background);
  color:var(--ods-foreground-weak);font-size:14px;line-height:20px;letter-spacing:-.3px}

/* ── surface(bordered container) ──────────────────────────
   ODS 에는 테두리 있는 범용 surface 컴포넌트가 없다(Card 는 gap 만 가진
   product layout primitive). Box + semantic 토큰으로 조합하고 사유를 남긴다. */
.ods-surface{border:1px solid var(--ods-border);border-radius:var(--ods-radius-8);background:var(--ods-background)}
.ods-surface[data-tone="inverse"]{background:var(--ods-background-inverse);color:var(--ods-foreground-inverse);border-color:var(--ods-transparent)}
.ods-surface[data-tone="brand-weak"]{background:var(--ods-background-brand-weak);border-color:var(--ods-background-brand-weak)}

/* ── prototype-ods · ActionDock ───────────────────────────
   src/prototype-ods/ActionDock.tsx (get_starter_files) */
.ods-dock{position:sticky;bottom:0;z-index:6;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--ods-background);border-top:1px solid var(--ods-border)}
.ods-dock .dock-hint{text-align:center;font-size:13px;line-height:18px;letter-spacing:-.3px;
  color:var(--ods-foreground-weak);margin:7px 0 9px}
.ods-dock .dock-hint b{color:var(--ods-foreground);font-weight:600}
.ods-dock[data-pattern="single"] .dock-row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;width:100%}
.ods-dock[data-pattern="dual-primary"] .dock-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.ods-dock[data-pattern="primary-secondary"] .dock-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;width:100%}
.ods-dock[data-pattern="primary-secondary"] .dock-row>*:first-child{grid-column:span 3}
.ods-dock[data-pattern="primary-secondary"] .dock-row>*:last-child{grid-column:span 7}
.ods-dock .dock-sub{margin-top:6px;display:flex;justify-content:center}

/* ── prototype-ods · TopNavigation ────────────────────────
   src/prototype-ods/TopNavigation.tsx (get_starter_files) */
.ods-topnav{display:flex;align-items:center;gap:16px;min-height:44px;padding:0 16px;
  background:var(--ods-background);position:sticky;top:0;z-index:4}
.ods-topnav .tn-left{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:12px}
.ods-topnav .tn-center{flex:0 0 auto;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ods-topnav .tn-right{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:12px}
.ods-topnav[data-center="fluid"] .tn-left{flex:0 0 auto}
.ods-topnav[data-center="fluid"] .tn-center{flex:1 1 0}
.ods-topnav[data-center="fluid"] .tn-right{flex:0 0 auto}
.ods-topnav .tn-title{font-size:16px;line-height:20px;letter-spacing:-.3px;font-weight:700;color:var(--ods-foreground);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ods-iconbtn{position:relative;width:24px;height:24px;padding:0;border:none;background:transparent;
  color:var(--ods-foreground);display:inline-flex;align-items:center;justify-content:center;
  line-height:0;cursor:pointer;flex:0 0 auto}
.ods-iconbtn[disabled]{opacity:.32;cursor:not-allowed}

/* ═══════════ 화면 조립 (레이아웃) ═══════════ */
.p-pad{padding:0 16px}
.apphead{display:flex;align-items:center;justify-content:space-between;padding:2px 16px 8px}
.apphead .ico{display:flex;gap:14px;color:var(--ods-foreground)}

/* ═══ O2O 홈 (Figma 37:10085) ═══════════════════════════ */
/* 홈은 회색 배경 위에 흰 카드가 올라가는 구조 */
.o2o-home{background:var(--ods-background-weak);min-height:100%}
/* Search Top Navigation (GNB) — Figma 112:27089.
   서비스 공통 chrome 이라 원칙상 프리뷰 제외(가이드 §2)이나 명시 요청으로 구현.
   chrome 이므로 ODS 아이콘 규칙(§5) 비대상 — bell/cart/magnifier 는 ODS 아웃라인 아이콘 재사용,
   hamburger/bookmark 는 stroke 글리프(대응 ODS path 미보유). */
.search-nav{display:flex;align-items:center;gap:14px;height:44px;padding:0 16px;background:var(--ods-background)}
.search-nav .sn-icon{flex:0 0 auto;width:24px;height:24px;display:grid;place-items:center;
  background:none;border:0;cursor:pointer;color:var(--ods-foreground);padding:0}
.search-nav .sn-search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:36px;
  padding:0 12px;border-radius:100px;background:var(--ods-background-weak)}
.search-nav .sn-search .sn-ic{flex:0 0 auto;display:grid;place-items:center;color:var(--ods-foreground-weak)}
.search-nav .sn-search .sn-ph{flex:1;min-width:0;color:var(--ods-foreground-weak);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 주소 행 — 페이지 전용(글로벌 GNB 아님) */
/* 주소 행 — Figma 112:27090: gap12 · py12(h50) · label(아이콘+텍스트) gap4 · 텍스트 body14L20 regular */
.addrbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--ods-background)}
.addrbar .ab-label{flex:1;min-width:0;display:flex;align-items:center;gap:4px;color:var(--ods-foreground)}
.addrbar .a-txt{flex:1;min-width:0;color:var(--ods-foreground);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Offering — 배경 그라디언트 (Figma 112:26801: #E5EDF2 → #F5F5F5, 거의 수직)
   하단 스톱은 backgroundWeak 토큰과 동일. 상단 #E5EDF2 는 대응 토큰이 없는
   [토큰 예외] 장식용 그라디언트 색이라 Figma 실측값을 그대로 둔다. */
.offering{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;
  position:relative;overflow:hidden;
  /* 하단은 background-weak 로 끝나 아래 메뉴 블록과 같은 색으로 이어진다.
     그림자를 두면 같은 색 위에 경계선이 생겨 분리돼 보이므로 제거한다. */
  background:linear-gradient(180.3deg, #E5EDF2 1%, var(--ods-background-weak) 99%)}
/* 배경 위를 천천히 떠다니는 브랜드 블루 글로우(장식)
   [토큰 예외] glow stop 은 genuineBlue.350(brand)·light 계열 기반 rgba */
.offering::before{content:'';position:absolute;inset:-30%;z-index:0;pointer-events:none;filter:blur(8px);
  background:
    radial-gradient(50% 42% at 28% 18%, rgba(0,161,255,.12), transparent 70%),
    radial-gradient(46% 38% at 78% 8%, rgba(122,196,255,.16), transparent 72%);
  animation:of-drift 9s ease-in-out infinite alternate}
.offering > *{position:relative;z-index:1}
@keyframes of-drift{
  0%  {transform:translate3d(-4%,-2%,0) scale(1)}
  100%{transform:translate3d(5%,3%,0) scale(1.08)}
}
.offering .of-row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.offering .of-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;color:var(--ods-foreground)}

/* ── 진입 애니메이션 ────────────────────────────────────
   Figma 에 키프레임이 저작돼 있지 않아(get_motion_context 결과 없음)
   hidden(64:20184) → show(37:10085) 두 상태의 차이를 전환으로 구현한다.
   키비주얼(calculator 에셋)이 제거되면서 그 크기 전환(kv-settle)은 함께 걷어냈고,
   텍스트·인풋의 stagger 리빌만 남는다.
   easing 은 ODS BoxButton 의 인터랙션 커브 cubic-bezier(.2,0,.2,1.05) 를 따른다.

   fill-mode 은 none 이고 animation-delay 도 쓰지 않는다. 휴지 상태(= CSS 기본값)가
   언제나 show 여야 하기 때문이다 — fill 을 걸면 애니메이션이 시작되기 전 단계에서
   from(=hidden) 상태가 유지돼, 프레임이 생성되지 않는 환경에서 콘텐츠가 숨은 채
   남는다. 대신 stagger 를 delay 가 아니라 keyframe 백분율 안에 넣어
   "시작 직후부터 hidden" 이 보장되므로 깜빡임도 없다.
   reduced-motion 에서는 전역 규칙이 duration 을 0.01ms 로 줄여 즉시 show 가 된다. */
:root{
  --kv-dur:600ms;
  --kv-ease:cubic-bezier(.2,0,.2,1.05);
}
/* 텍스트·인풋: stagger 를 백분율로 표현 (10% / 20% / 30% 지연 효과) */
@keyframes of-rise-1{
  0%,10%{opacity:0;transform:translateY(6px)}
  75%,100%{opacity:1;transform:none}
}
@keyframes of-rise-2{
  0%,20%{opacity:0;transform:translateY(6px)}
  85%,100%{opacity:1;transform:none}
}
@keyframes of-rise-3{
  0%,30%{opacity:0;transform:translateY(8px)}
  100%{opacity:1;transform:none}
}
.offering .of-title > span:nth-child(1){animation:of-rise-1 var(--kv-dur) var(--kv-ease)}
.offering .of-title > span:nth-child(2){animation:of-rise-2 var(--kv-dur) var(--kv-ease)}

/* ── 인풋 스트로크 그라디언트 애니메이션 (Figma 112:27939, 1.5px stroke) ──
   기법: padding-box(흰 배경) + border-box(conic 그라디언트)로 보더에만 그라디언트를 칠하고
   @property 로 각도를 등록해 스무스하게 회전시킨다.
   [토큰 예외] 장식용 그라디언트라 ODS 단일 토큰이 없어
   genuineBlue.100(#DDF3FF) ↔ genuineBlue.350(brand/#00A1FF) 스톱으로 근사(Figma #adf 는 그 사이).
   @property 미지원 브라우저는 --pill-ang:0deg 로 정적 그라디언트 보더로 폴백된다. */
@property --pill-ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.offering .pillinput{
  --pill-ang:0deg;
  border:1.5px solid transparent;
  background:
    linear-gradient(var(--ods-background),var(--ods-background)) padding-box,
    conic-gradient(from var(--pill-ang),
      var(--ods-palette-genuineblue-100), var(--ods-foreground-brand),
      var(--ods-palette-genuineblue-100), var(--ods-foreground-brand),
      var(--ods-palette-genuineblue-100)) border-box;
  animation:of-rise-3 var(--kv-dur) var(--kv-ease), pill-spin 4s linear infinite}
@keyframes pill-spin{to{--pill-ang:360deg}}

/* pill input — Figma input 컴포넌트
   r100 · border .5px border · pl16.5 pr8.5 py12.5 · ext.o2o.shadow.card(2 2 20 #C2C8CC33)
   home(64:20194): send 가 32×32 btn 프레임 → 12.5+32+12.5 = 57
   chat(58:19548): 높이 45 고정 */
.pillinput{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:12.5px 8.5px 12.5px 16.5px;border:.5px solid var(--ods-border);border-radius:100px;
  background:var(--ods-background);box-shadow:2px 2px 20px 0 rgba(194,200,204,.2);
  cursor:pointer;font-family:inherit;text-align:left;overflow:hidden}
.pillinput .ph{flex:1;min-width:0;color:var(--ods-foreground-weak);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pillinput .send{flex:0 0 auto;display:grid;place-items:center;color:var(--ods-foreground)}

/* ── 플레이스홀더 텍스트 롤링 ───────────────────────────
   body15L24 의 line-height(24px) 를 한 칸 높이로 삼아 세로로 굴린다.
   마지막 항목은 첫 항목의 복제라 한 바퀴가 이음매 없이 이어진다.
   easing 은 ODS Spinner 의 커브 cubic-bezier(.65,0,.35,1) 를 따른다. */
.pillinput .roll{flex:1;min-width:0;height:24px;overflow:hidden;display:block}
.pillinput .roll-track{display:flex;flex-direction:column;
  animation:ph-roll 6s cubic-bezier(.65,0,.35,1) infinite}
.pillinput .roll-item{height:24px;line-height:24px;color:var(--ods-foreground-weak);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes ph-roll{
  0%,   40%  {transform:translateY(0)}
  48%,  90%  {transform:translateY(-24px)}
  98%,  100% {transform:translateY(-48px)}
}
.pillinput[data-size="home"] .send{width:32px;height:32px}
.pillinput[data-size="chat"]{height:45px}
.pillinput[data-size="chat"] .send{width:20px;height:20px}
/* 홈 인풋 전송 버튼 — Figma(64:20194)는 '원형 채움 + 오른쪽 화살표'인데
   @bucketplace/icons 3.25.0 에는 ArrowRightCircleFilled 가 없다(Up 변형만 존재).
   [예외 기록] ODS_PROTOTYPE_GUIDE §7 에 따라 IconArrowRight + semantic 토큰으로 조합한다. */
.send-circle{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
  background:var(--ods-background-inverse);color:var(--ods-foreground-inverse)}

/* Menu 영역 */
/* 메뉴 블록 배경 = 오퍼링 그라디언트 끝 색(background-weak) — 경계 없이 자연스럽게 연결 */
.menu-wrap{display:flex;flex-direction:column;gap:6px;padding:12px 16px 16px;background:var(--ods-background-weak)}
.menu-h{display:block;color:var(--ods-foreground);padding:6px 0 2px}
/* Grid/Extention/SM — 2-up 카드 */
.ext-grid{display:flex;gap:6px;align-items:stretch}
.ext-card{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px;
  padding:12px 12px 10px;background:var(--ods-background);border:.5px solid var(--ods-border);
  border-radius:12px;box-shadow:0 2px 18px 0 rgba(0,0,0,.06);overflow:hidden;
  cursor:pointer;font-family:inherit;text-align:left}
.ext-card .ec-h{display:flex;align-items:center;justify-content:space-between;gap:4px;width:100%}
.ext-card .ec-h b{color:var(--ods-foreground);white-space:nowrap}
.ext-card .ec-h .chev{color:var(--ods-foreground-weak);display:grid;place-items:center;flex:0 0 auto}
.ext-card .ec-d{color:var(--ods-foreground-weak)}
.ext-card .ec-img{display:flex;align-items:center;justify-content:flex-end;width:100%}

/* Section — 흰 카드 */
.sec-card{background:var(--ods-background);border-radius:12px;padding:16px 12px;
  box-shadow:2px 2px 20px 0 rgba(194,200,204,.2);overflow:hidden}
.sec-card > .sc-t{color:var(--ods-foreground);display:block}
/* 부분 시공 4-up + 더보기 */
.part-row{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.part-left{flex:1 1 0;min-width:0;display:flex;align-items:flex-start;justify-content:space-between;height:62px}
.part-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;
  cursor:pointer;font-family:inherit;position:relative}
.part-item .p-lb{width:56px;text-align:center;color:var(--ods-foreground)}
.part-item .p-badge{position:absolute;top:-4px;left:36px}
.part-more{flex:0 0 41px;height:62px;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding-top:5px;background:none;border:0;cursor:pointer;font-family:inherit}
.part-more .pm-c{width:28px;height:28px;border-radius:100px;border:1px solid var(--ods-background);
  background:linear-gradient(90deg, rgba(0,0,0,.04), rgba(0,0,0,.04)), var(--ods-background);
  display:grid;place-items:center;color:var(--ods-foreground-weak)}
.part-more .pm-l{color:var(--ods-foreground)}
/* 이사 계획 중이라면 5-up — 아이템별 쉐도우·강조 배경 없음(섹션 카드에만 쉐도우) */
/* 이사 준비 중이라면 5-up — Figma 112:26851: gap10, 프레임 폭 균등 분포(edge-to-edge) */
.compact-row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:8px}
.compact-item{display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;background:none;border:0;cursor:pointer;font-family:inherit;overflow:hidden}
.compact-item .ci-img{width:56px;height:56px;padding:4px;display:flex;align-items:center;
  border-radius:12px;overflow:hidden}
.compact-item .ci-lb{min-width:100%;text-align:center;color:var(--ods-foreground)}

/* ═══ 진입 하단 번들 (Figma 208:2387) — 추천업체/서비스숏컷/리뷰/시공사례 ═══
   콘텐츠 사진은 ODS 미보유(콘텐츠 이미지)라 backgroundWeak placeholder 로 대체 */
.bundle-div{height:10px;background:var(--ods-background-weak);width:100%;flex:0 0 auto}
.bx{background:var(--ods-background);padding:20px 0;display:flex;flex-direction:column}
.bx-t{padding:0 16px 16px;color:var(--ods-foreground);display:block}
.bx-t .bx-sub{display:block;margin-top:4px;color:var(--ods-foreground)}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:0 0 auto}
/* 추천 시공업체 카드 */
.pcard{width:280px;border:1px solid var(--ods-border);border-radius:8px;overflow:hidden;background:var(--ods-background)}
/* 썸네일(208:2478) — 좌 1장 + 우 2장 모자이크, 사이 seam 1.5/3px */
.pc-thumb{height:150px;background:var(--ods-background);position:relative;
  display:grid;grid-template-columns:3fr 1fr;grid-template-rows:1fr 1fr;gap:3px 1.5px}
.pc-thumb .pc-im{width:100%;height:100%;object-fit:cover;display:block}
.pc-thumb .pc-main{grid-row:1/3}
.pc-thumb .pc-tag{position:absolute;left:0;right:0;bottom:0;height:32px;display:flex;align-items:center;
  justify-content:center;gap:4px;background:#2e3b5c;color:#fff}
.pc-info{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pc-nm{display:flex;align-items:center;gap:4px;color:var(--ods-foreground)}
.pc-badge{border:1px solid var(--ods-palette-gray-100);border-radius:4px;padding:2px 6px;color:#12b667/*ODS positive 토큰 미보유*/}
.pc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--ods-foreground)}
.pc-star{display:inline-flex;align-items:center;gap:1px}
.pc-star svg{color:var(--ods-foreground-brand)}
.pc-star b{color:var(--ods-foreground-brand)}
.pc-dot{color:var(--ods-palette-gray-200)}
.c-fg-weakest{color:var(--ods-foreground-weak)}
/* 서비스 숏컷 4열 */
.svc-short{display:flex;justify-content:space-between;padding:0 16px;gap:8px}
.ss-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;font-family:inherit}
.ss-ic{width:50px;height:50px;border-radius:16px;background:var(--ods-background-weak);display:flex;align-items:center;justify-content:center;color:var(--ods-foreground)}
.ss-lb{color:var(--ods-foreground);text-align:center}
/* 리뷰/시공사례 카드 */
.rcard{width:159px;display:flex;flex-direction:column;gap:8px}
.rc-thumb{width:159px;height:159px;border-radius:4px;background:var(--ods-background-weak);position:relative;overflow:hidden}
.rc-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* IMG_3891 1(208:2616) — Figma 크롭 프레임 그대로 */
.rc-thumb img.rc-crop{inset:auto;left:-63.75%;top:-177.02%;width:371.41%;height:864.76%;object-fit:fill;max-width:none}
.rc-nm{color:var(--ods-foreground)}
.rc-txt{color:var(--ods-foreground);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rc-by{color:var(--ods-foreground-weak)}
.rc-meta{display:flex;gap:3px;color:var(--ods-foreground-weak)}
.pf-chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.pf-chips::-webkit-scrollbar{display:none}
.pf-chips>*{flex:0 0 auto}
.more-btn{margin:16px 16px 0;height:44px;border:1px solid var(--ods-border);border-radius:4px;background:var(--ods-background);
  display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-family:inherit;color:var(--ods-foreground)}
.more-btn svg{color:var(--ods-foreground)}
/* 하단 고정 GNB (Figma 208:2649) — GNB chrome, ODS 아이콘 규칙 제외 */
.home-gnb{position:sticky;bottom:0;z-index:7;background:var(--ods-background);border-top:.5px solid var(--ods-border);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.gnb-row{display:flex}
.gnb-item{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:none;border:0;cursor:pointer;font-family:inherit;color:var(--ods-foreground)}
.gnb-item .gnb-lb{font-size:10px;line-height:14px;letter-spacing:-.3px}
.gnb-item.on .gnb-lb{font-weight:600}
.gnb-ind{height:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.gnb-ind i{display:block;width:134px;height:5px;border-radius:100px;background:var(--ods-foreground)}

.h-lead{padding:14px 16px 6px}
.h-lead h2{margin:0}
.h-lead p{color:var(--ods-foreground-weak);margin-top:9px}

/* ═══ 서비스 선택 (Figma 64:20897) ═════════════════════
   화면 배경 backgroundWeak(#F5F5F5) 위에 흰 list 카드 */
.sel-screen{background:var(--ods-background-weak);min-height:100%;display:flex;flex-direction:column}
.sel-title{display:flex;flex-direction:column;padding:16px;color:var(--ods-foreground)}
.picks{padding:0 16px 24px;display:flex;flex-direction:column;gap:6px}
/* list 카드 — p16 · r12 · border 1px border · 우측 Checkbox */
.pick{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:4px;
  border:1px solid var(--ods-border);border-radius:12px;padding:16px;cursor:pointer;
  background:var(--ods-background);transition:.15s;text-align:left;font-family:inherit;width:100%}
.pick:hover{border-color:var(--ods-palette-gray-200)}
.pick .pk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.pick b{display:block;color:var(--ods-foreground);width:100%}
.pick span.d{display:block;color:var(--ods-foreground-weak);width:100%}
/* 선택 상태 — border 1.5px borderStrong + Checkbox checked */
.pick[aria-pressed="true"]{border-color:var(--ods-border-strong);border-width:1.5px;padding:15.5px}

/* 서비스 선택 — 부분시공 체크 시 타이틀 행 + 시공 범위 타일이 한 카드(Figma 131:58526)
   pl12 · pr16 · py16 · gap12 · r12 · border 1.5px borderStrong */
.svccard{display:flex;flex-direction:column;gap:12px;overflow:hidden;background:var(--ods-background);
  border:1.5px solid var(--ods-border-strong);border-radius:12px;padding:14.5px 14.5px 14.5px 10.5px}
.svccard .pick{border:0;border-radius:0;padding:0;gap:12px;background:none;width:auto}
.svccard .pick:hover{border-color:var(--ods-transparent)}
/* contents(131:58576) — 5열 grid · column gap 0 · row gap 4 */
.svc-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:0;row-gap:4px}
/* CategoryTile — h77 · r8 · asset 44 + label(detail12L16). 선택 시 backgroundWeak */
.svc-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  height:77px;padding:4px;border:0;border-radius:8px;background:none;cursor:pointer;
  font-family:inherit;color:var(--ods-foreground);overflow:hidden;transition:.15s}
.svc-tile.on{background:var(--ods-background-weak)}
/* Sticky Action — 투명→backgroundWeak 그라디언트 위 solid BoxButton */
.sticky-action{position:sticky;bottom:0;z-index:6;padding:32px 16px calc(16px + env(safe-area-inset-bottom,0px));margin-top:auto;
  background:linear-gradient(180deg, rgba(245,245,245,0) 0%, var(--ods-background-weak) 100%)}

/* ═══ 입력폼 로딩 (Figma 56:19496) ══════════════════════ */
.load-screen{background:var(--ods-background-weak);min-height:100%}

/* ═══ 상단 floatingProgress 바 (Figma 178:23717/23769/23928) ═══════════
   폼 챗봇 상단 고정 — 입력중 progress(n/총) / 견적후 confirm(총 예상 견적+상담신청) */
/* floatingProgress 래퍼 — 스크롤 무관, 상단 네비게이션(44px) 하단에 sticky 고정 */
.fbar-wrap{position:sticky;top:44px;z-index:3;background:var(--ods-background-weak);padding:4px}
.fbar{padding:8px 12px;background:var(--ods-background);border-radius:4px;
  box-shadow:2px 2px 10px 0 rgba(194,200,204,.2);display:flex;align-items:center;gap:8px}
.fbar .fb-t{flex:1;min-width:0;display:flex;align-items:center;gap:7px;color:var(--ods-foreground);overflow:hidden}
.fbar .fb-lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar .fb-ring{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center}
/* arc 는 직전 렌더의 채움(--from) → 현재 단계(--off) 로만 이어서 채운다 */
.fbar .fb-arc{animation:fb-fill .5s cubic-bezier(.65,0,.35,1) both}
@keyframes fb-fill{from{stroke-dashoffset:var(--from)}to{stroke-dashoffset:var(--off)}}
.fbar .fb-doc{flex:0 0 auto;display:grid;place-items:center;color:var(--ods-foreground-weak)}
.fbar .fb-spin{flex:0 0 auto;display:grid;place-items:center}
.fbar .fb-count{flex:0 0 auto;color:var(--ods-foreground-weak)}
/* 채팅 안 인라인 견적 price 버블 (Figma type=price) */
.chat-price{align-self:flex-start;max-width:320px;width:320px;background:var(--ods-background);
  border-radius:12px;padding:12px;box-shadow:2px 2px 10px 0 rgba(194,200,204,.2);animation:pop .26s ease both}
/* 접힘: 카드 목록을 220px 로 클립 + 하단 shade fade + 펼쳐보기. 펼침(.open): 전체 노출 */
.chat-price .cp-clip{position:relative;max-height:220px;overflow:hidden;border-radius:8px;margin-top:12px}
.chat-price .cp-clip.open{max-height:none;overflow:visible}
.chat-price .cp-shade{position:absolute;left:0;right:0;bottom:0;padding:32px 0 0;display:flex;justify-content:center;
  background:linear-gradient(180deg, rgba(255,255,255,0) 0%, var(--ods-background) 45%)}
.chat-price .cp-lb{color:var(--ods-foreground)}
.chat-price .cp-val{color:var(--ods-foreground-brand)}
.chat-price .cp-sub{color:var(--ods-foreground);margin:2px 0 12px}
.chat-price .cp-card{display:flex;gap:10px;padding-bottom:12px}
.chat-price .cp-card .cp-rows{flex:1;min-width:0}
.chat-price .cp-row{display:flex;gap:8px;padding-bottom:4px}
.chat-price .cp-row .cp-k{width:48px;flex:0 0 auto;color:var(--ods-foreground-weak)}
.chat-price .cp-row .cp-v{flex:1;min-width:0;color:var(--ods-foreground-weak)}
.chat-price .cp-done{display:flex;align-items:center;gap:4px;color:var(--ods-foreground);margin-bottom:8px}

/* ═══ 견적서 확인(CFM) — Figma 178:23974 Flow1-1 ═══════════════════════════ */
.cfm{background:var(--ods-background);min-height:100%}
.cfm-head{padding:16px}
.cfm-head .cfm-total{margin:2px 0 8px}
.cfm-head .cfm-sub{color:var(--ods-foreground)}
.cfm-cards{padding:4px 16px 24px}
.cfm-card{display:flex;gap:10px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--ods-background-weak)}
.cfm-card:last-child{border-bottom:0}
.cfm-card .cfm-ic{flex:0 0 auto}
.cfm-card .cfm-body{flex:1;min-width:0}
.cfm-card .cfm-th{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:9px}
.cfm-card .cfm-th b{color:var(--ods-foreground)}
.cfm-card .cfm-edit{flex:0 0 auto;width:24px;height:24px;background:none;border:0;cursor:pointer;
  display:grid;place-items:center;color:var(--ods-foreground-weak)}
.cfm-card .cfm-row{display:flex;gap:8px;padding-bottom:4px}
.cfm-card .cfm-row .cfm-k{flex:0 0 auto;width:72px;color:var(--ods-foreground-weak)}
.cfm-card .cfm-row .cfm-v{flex:1;min-width:0;color:var(--ods-foreground)}
/* 상담 신청 완료 바텀시트 (Figma 137:114484) */
.cfm-sheet .cfm-done{padding:24px 24px 12px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cfm-sheet .cd-check{width:60px;height:60px;border-radius:50%;background:var(--ods-background-brand);
  color:var(--ods-foreground-inverse);display:grid;place-items:center;margin-bottom:20px}
.cfm-sheet .cd-t{color:var(--ods-foreground);margin-bottom:8px}
.cfm-sheet .cd-d{color:var(--ods-foreground-weak)}
/* 비교견적 크로스셀 바텀시트 (Figma 124:52772) */
.cross-sheet .cross-body{padding:8px 20px 12px;text-align:center}
.cross-sheet .cs-t{color:var(--ods-foreground);margin-bottom:8px}
.cross-sheet .cs-d{color:var(--ods-foreground-weak);margin-bottom:16px}
/* 견적서 도착 카드 — 뒤에 한 장 더 겹쳐진 스택 표현 */
.cross-sheet .cs-stack{position:relative;padding-bottom:12px}
.cross-sheet .cs-stack::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:24px;
  border-radius:0 0 16px 16px;background:var(--ods-background-disabled);z-index:0}
.cross-sheet .cs-card{position:relative;z-index:1;border-radius:16px;padding:16px;text-align:left;
  background:var(--ods-background-weak)}
.cross-sheet .cs-card-h{display:flex;align-items:center;gap:6px;color:var(--ods-foreground);margin-bottom:12px}
.cross-sheet .cs-card-h .cs-card-ic{flex:0 0 auto;display:grid;place-items:center;color:var(--ods-foreground-weak)}
.cross-sheet .cs-card-b{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--ods-background);border-radius:12px;padding:14px 16px}
.cross-sheet .cross-foot{display:flex;gap:8px}
.cross-sheet .cross-foot .ods-btn:first-child{flex:0 0 96px}
.cross-sheet .cross-foot .ods-btn:last-child{flex:1}

/* ═══ 상담 내역 · 업체 매칭 리스트 (Figma 124:51989) ═══════════════════════════ */
.mlist{background:var(--ods-background);min-height:100%}
.ml-tabs{display:flex;border-bottom:1px solid var(--ods-border)}
.ml-tab{flex:1;padding:10px 0 12px;background:none;border:0;cursor:pointer;font-family:inherit;
  color:var(--ods-foreground-weak);position:relative}
.ml-tab.on{color:var(--ods-foreground)}
.ml-tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ods-foreground)}
.ml-chips{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
.ml-chips::-webkit-scrollbar{display:none}
.ml-chips>*{flex:0 0 auto}
.ml-period{display:inline-flex;align-items:center;gap:2px;margin:8px 16px 0;padding:0;
  background:none;border:0;cursor:pointer;font-family:inherit;color:var(--ods-foreground)}
.ml-period .ml-caret{display:inline-grid;place-items:center;color:var(--ods-foreground-weak);transform:rotate(90deg)}
.ml-cards{padding:8px 0 90px}
.ml-card{display:flex;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--ods-background-weak)}
.ml-card .ml-ic{flex:0 0 auto}
.ml-card .ml-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ml-card .ml-nm{color:var(--ods-foreground)}
.ml-card .ml-stat{color:var(--ods-foreground)}
.ml-card .ml-sub{color:var(--ods-foreground-weak)}
.ml-card .ml-time{flex:0 0 auto;color:var(--ods-foreground-weak)}
/* 하단 스낵바 (ODS Snackbar) */
.ml-snack{position:sticky;bottom:16px;margin:0 16px;padding:14px 16px;border-radius:8px;
  background:var(--ods-background-inverse);color:var(--ods-foreground-inverse);
  box-shadow:0 6px 20px -6px rgba(0,0,0,.35)}
.load-box{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:16px}
.load-usp{display:flex;align-items:center;gap:4px;padding-bottom:8px;color:var(--ods-foreground)}
.load-chips{display:flex;gap:4px;align-items:flex-start;flex-wrap:wrap}
/* 로딩 버블 — Figma 121:47710 (배경 없는 인라인: Spinner + 그라디언트 텍스트) */
.load-bub{align-self:flex-start;display:flex;align-items:center;gap:4px}
.grad-load{background:linear-gradient(90deg,var(--ods-foreground-weak),var(--ods-foreground));
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}

/* 로딩 — 항목 조립 */
.assembling{padding:80px 24px 0;display:flex;flex-direction:column;align-items:center}
.assembling h2{margin:24px 0 6px;text-align:center}
.assembling>p{color:var(--ods-foreground-weak);margin-bottom:26px}
.asm-list{width:100%;display:flex;flex-direction:column;gap:9px}
.asm{display:flex;align-items:center;gap:10px;color:var(--ods-foreground);
  opacity:0;transform:translateY(6px);animation:pop .32s ease forwards}
.asm .dotx{width:18px;height:18px;border-radius:50%;background:var(--ods-background-brand-weak);
  color:var(--ods-foreground-brand);display:grid;place-items:center;flex:0 0 auto}
.asm.skip{color:var(--ods-foreground-weak);text-decoration:line-through;text-decoration-color:var(--ods-border)}
.asm.skip .dotx{background:var(--ods-background-weak);color:var(--ods-foreground-weak)}
@keyframes pop{to{opacity:1;transform:none}}
.asm-div{color:var(--ods-foreground-weak);margin:14px 0 4px;padding-top:12px;
  border-top:1px dashed var(--ods-border);opacity:0;transform:translateY(6px);animation:pop .32s ease forwards}

/* ═══ 입력폼 · A안 대화형 (Figma 58:15461 / 58:19520) ════
   화면 배경 backgroundWeak · 봇 말풍선 white · 유저 말풍선 backgroundInverse */
.chat-screen{background:var(--ods-background-weak);min-height:100%;display:flex;flex-direction:column;position:relative}
.chat{flex:1;padding:16px;display:flex;flex-direction:column;gap:8px}
.svc-tag{align-self:flex-start;color:var(--ods-foreground-weak);background:var(--ods-background);
  border-radius:var(--ods-radius-full);padding:5px 10px;margin-top:4px}
/* Bubble — max-w 280 · px14 py12 · r12 · body16L20 Regular (Figma 64:23686) */
.bub{max-width:280px;padding:12px 14px;border-radius:12px;animation:pop .26s ease both;
  word-break:break-word}
.bub.bot{align-self:flex-start;background:var(--ods-background);color:var(--ods-foreground)}
.bub.me{align-self:flex-end;background:var(--ods-background-inverse);color:var(--ods-foreground-inverse)}
.bub.note{align-self:flex-start;background:var(--ods-background);color:var(--ods-foreground);
  display:flex;gap:8px;align-items:flex-start}
.bub.note svg{flex:0 0 auto;margin-top:3px;color:var(--ods-foreground-brand)}
/* 상담 신청 완료 카드 (Figma 137:115367 · 208:3065) — 제목+체크 / Divider / 상세 */
.done-card{display:flex;flex-direction:column;gap:12px;padding:12px;max-width:280px}
.done-card .dc-h{display:flex;align-items:center;gap:4px}
.done-card .dc-h .dc-t{line-height:22px;color:var(--ods-foreground)}
.done-card .dc-h .dc-chk{display:inline-flex;color:var(--ods-foreground)}
.done-card .dc-body{color:var(--ods-foreground)}

/* ── bundle_progress (Figma 75:25314) ─────────────────
   p4 바깥 여백 · 흰 카드 p12 · r4 · shadow(2 2 10 #C2C8CC33)
   좌측은 ODS Basic Loading(20px) 위에 IconCheck 를 겹친 마크 */
.bundle-progress{padding:4px;background:var(--ods-background-weak)}
.bundle-progress .bp-card{display:flex;align-items:center;gap:8px;padding:12px;
  background:var(--ods-background);border-radius:var(--ods-radius-4);
  box-shadow:2px 2px 10px 0 rgba(194,200,204,.2)}
.bundle-progress .bp-title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;
  color:var(--ods-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bundle-progress .bp-mark{position:relative;width:20px;height:20px;flex:0 0 auto}
.bundle-progress .bp-mark .ods-spinner{position:absolute;inset:0}
.bundle-progress .bp-check{position:absolute;inset:0;display:grid;place-items:center;
  color:var(--ods-foreground)}
.bundle-progress .bp-count{flex:0 0 auto;color:var(--ods-foreground-weak)}

/* ── BottomSheet — 배송지 목록 (Figma 64:22782) ────────
   ODS BottomSheet: r16 16 0 0 · Grabber 32×4 r9999 */
.screen.has-sheet{overflow:hidden}
.bs-overlay{position:absolute;inset:0;background:var(--ods-background-dim);z-index:20}
.bsheet{position:absolute;left:0;right:0;bottom:0;z-index:21;display:flex;flex-direction:column;
  max-height:82%;background:var(--ods-background);border-radius:16px 16px 0 0;
  animation:bs-up 260ms cubic-bezier(.2,0,.2,1.05)}
@keyframes bs-up{from{transform:translateY(100%)}}
.bsheet .bs-grab{flex:0 0 24px;display:flex;justify-content:center;align-items:center}
.bsheet .bs-grab i{display:block;height:4px;width:32px;border-radius:9999px;background:var(--ods-border)}
.bsheet .bs-head{display:flex;align-items:center;gap:8px;padding:8px 16px 16px}
.bsheet .bs-head .bs-title{flex:1;text-align:center;color:var(--ods-foreground);
  padding-left:24px} /* 우측 닫기 버튼(24px) 만큼 보정해 가운데 정렬 */
.bsheet .bs-body{flex:1;min-height:0;overflow-y:auto}
.bs-item{display:flex;align-items:flex-start;gap:12px;padding:16px;width:100%;
  background:none;border:0;border-top:1px solid var(--ods-background-weak);
  cursor:pointer;font-family:inherit;text-align:left}
.bs-item:first-child{border-top:0}
.bs-item .bs-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bs-item .bs-txt b{color:var(--ods-foreground)}
.bs-item .bs-txt span{color:var(--ods-foreground-weak)}
.bsheet .bs-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
/* floatingfullpage 시트 (Figma 209:5705/6278) — 총 예상 견적 상세 + dual 버튼 */
.fp-sheet{max-height:92%}
.fp-sheet .fp-x{background:none;border:0;padding:0;cursor:pointer;color:var(--ods-foreground);display:inline-flex;flex:0 0 auto}
.fp-sheet .fp-body{padding:0}
.fp-sheet .fp-foot{display:flex;gap:8px}
.fp-sheet .fp-foot .ods-btn{flex:1}

/* ═══ 하단 액션 모달 — 직접입력/갤러리/캘린더 (Figma 미정의 동작) ═══════════════ */
.fm-sheet .fm-h{display:flex;align-items:center;gap:6px;padding:8px 16px 14px;color:var(--ods-foreground)}
.fm-sheet .fm-body{padding:0 16px 8px}
.fm-input{width:100%;height:48px;padding:0 14px;border:1.5px solid var(--ods-border);border-radius:12px;
  background:var(--ods-background);color:var(--ods-foreground);font-family:inherit;outline:none;letter-spacing:-.3px}
.fm-input:focus{border-color:var(--ods-border-strong)}
.fm-input::placeholder{color:var(--ods-foreground-weak)}
.fm-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fm-tile{position:relative;aspect-ratio:1;border:0;border-radius:8px;overflow:hidden;cursor:pointer;padding:0;background:none}
.fm-tile .fg-ph{display:block;width:100%;height:100%;
  background:linear-gradient(135deg,var(--ods-palette-gray-200),var(--ods-background-weak))}
.fm-tile.on{outline:2px solid var(--ods-border-brand);outline-offset:-2px}
.fm-tile .fg-chk{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;
  background:var(--ods-background-brand);color:var(--ods-foreground-inverse);display:grid;place-items:center}
.fm-cal .fc-wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;
  color:var(--ods-foreground-weak);font-size:12px;padding-bottom:8px}
.fm-cal .fc-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.fm-cal .fc-day{aspect-ratio:1;border:0;background:none;border-radius:50%;cursor:pointer;
  color:var(--ods-foreground);font-family:inherit;font-size:15px}
.fm-cal .fc-day:hover{background:var(--ods-background-weak)}
.fm-cal .fc-day.on{background:var(--ods-background-brand);color:var(--ods-foreground-inverse)}
/* ═══ 짐 정보 직접 입력 시트 (Figma 8577:42566) ═══════════════════════════════
   섹션(가전·가구·기타 가구) 타일 그리드 + 잔 짐 박스 수량 + 추가 설명 */
.cargo-sheet{max-height:92%}
.cargo-sheet .bs-body{display:flex;flex-direction:column;gap:20px;padding:16px 0 8px}
.cg-sec{display:flex;flex-direction:column}
.cg-sub{padding:0 16px 12px;color:var(--ods-foreground)}
.cg-sub .cg-desc{display:block;margin-top:2px;color:var(--ods-foreground)}
/* FurnitureSelector/Tile (2292:39421) — r4 · border 1px · px16 py10 · asset 36 + label 13/18 */
.cg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:4px;padding:0 16px}
.cg-tile{max-width:100px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;padding:10px 16px;border:1px solid var(--ods-border);border-radius:4px;
  background:var(--ods-background);cursor:pointer;font-family:inherit;color:var(--ods-foreground);transition:.14s}
.cg-tile[aria-pressed="true"]{border-color:var(--ods-border-strong);background:var(--ods-background-weak)}
.cg-tile img{width:36px;height:36px;object-fit:contain;display:block}
/* 라벨은 Figma 와 동일하게 줄바꿈 없이 한 줄 유지(긴 라벨은 좌우 패딩을 넘어 표시) */
.cg-tile span{white-space:nowrap}
.cg-div{height:1px;background:var(--ods-background-disabled);flex:0 0 auto}
/* 잔 짐 박스 수량 — backgroundWeak r8 카드 + NumberField */
.cg-box{margin:0 16px;background:var(--ods-background-weak);border-radius:8px;padding:0 20px;
  display:flex;align-items:center;justify-content:center;gap:24px}
.cg-box img{width:173px;height:153px;object-fit:contain;display:block}
.cg-cnt{display:flex;flex-direction:column;align-items:center;gap:12px}
.cg-cnt .cg-unit{color:var(--ods-foreground)}
.cg-num{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 8px;
  border:1px solid var(--ods-border);border-radius:4px;background:var(--ods-background)}
.cg-num button{width:16px;height:16px;padding:0;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;color:var(--ods-foreground)}
.cg-num button[disabled]{color:var(--ods-foreground-disabled);cursor:not-allowed}
.cg-num .cg-v{width:28px;text-align:center;color:var(--ods-foreground)}
.cg-notes{display:flex;flex-direction:column;gap:8px;padding:12px 16px 0}
.cg-note{display:flex;align-items:center;gap:6px;color:var(--ods-foreground-weak)}
.cg-note i{flex:0 0 auto;width:4px;height:4px;border-radius:50%;background:currentColor}
/* 추가 설명 — Textarea r4 · h108 · p16 */
.cg-ta{display:block;width:calc(100% - 32px);margin:0 16px;height:108px;padding:16px;resize:none;
  border:1px solid var(--ods-border);border-radius:4px;background:var(--ods-background);
  color:var(--ods-foreground);font-family:inherit;font-size:16px;line-height:24px;letter-spacing:-.3px;outline:none}
.cg-ta:focus{border-color:var(--ods-border-strong)}
.cg-ta::placeholder{color:var(--ods-foreground-weak)}
/* ═══ 세부 항목 추가 입력 시트 (가견적 신청 전 서비스별 4문항) ══════════════
   ODS BottomSheet 골격(.bsheet)·RadioGroup(.ods-radio)·Chip·Calendar 를 그대로 재사용한다.
   신규 컴포넌트를 만들지 않고 질문 헤더 레이아웃만 조합한다. */
.x-sheet{max-height:88%}
.x-sheet .x-q{padding:0 16px 14px}
.x-sheet .x-step{display:inline-block;margin-bottom:6px;color:var(--ods-foreground-brand)}
.x-sheet .x-q b{display:block;color:var(--ods-foreground)}
.x-sheet .x-desc{margin-top:6px;color:var(--ods-foreground-weak)}
.x-sheet .bs-body{padding-bottom:8px}
/* 인터넷 상담 신청 — 연락처 확인·완료 단계 */
.x-summary{padding:0 16px}
.x-contact{margin:8px 16px 0;padding:12px 16px;border-radius:12px;background:var(--ods-background-weak);
  display:flex;flex-direction:column;gap:2px}
.x-contact span{color:var(--ods-foreground-weak)}
.x-contact b{color:var(--ods-foreground)}
.x-sheet .x-done{padding:24px 24px 12px;display:flex;flex-direction:column;align-items:center;text-align:center}
.x-sheet .x-done .cd-check{width:60px;height:60px;border-radius:50%;background:var(--ods-background-brand);
  color:var(--ods-foreground-inverse);display:grid;place-items:center;margin-bottom:20px}
.x-sheet .x-done .cd-t{color:var(--ods-foreground);margin-bottom:8px}
.x-sheet .x-done .cd-d{color:var(--ods-foreground-weak)}
.x-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px}
.x-cal{padding:0 16px}
.x-cal-nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:0 0 12px;
  color:var(--ods-foreground)}
.x-cal-nav button{border:0;background:none;padding:4px;cursor:pointer;color:var(--ods-foreground);
  display:grid;place-items:center}
.x-cal-nav button[disabled]{color:var(--ods-foreground-disabled);cursor:not-allowed}
.fm-cal .fc-day[disabled]{color:var(--ods-foreground-disabled);cursor:not-allowed}
.fm-cal .fc-day[disabled]:hover{background:none}
.x-cal-none{padding:14px 16px 0;display:flex;justify-content:center}
/* 남은 문항 안내 — 예상 견적 행 아래 caption */
.o2h-order-hint{padding:2px 0 8px;color:var(--ods-foreground-weak);text-align:right}
/* 리스트 셀렉 (포장종류 등) — 하단 액션 리스트 */
.q-list{width:100%;display:flex;flex-direction:column;gap:8px}
.q-li{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;width:100%;
  padding:14px 16px;border:1px solid var(--ods-border);border-radius:12px;background:var(--ods-background);
  cursor:pointer;font-family:inherit}
.q-li:hover{border-color:var(--ods-border-strong)}
.q-li .ql-t{color:var(--ods-foreground)}
.q-li .ql-s{color:var(--ods-foreground-weak)}
/* ODS RadioGroup.Indicator — 20px · r9999 · checked 시 backgroundInverse */
.ods-radio{width:20px;height:20px;border-radius:9999px;border:1px solid var(--ods-border);
  background:var(--ods-background);display:grid;place-items:center;flex:0 0 auto;margin-top:2px}
.ods-radio i{display:none;width:6px;height:6px;border-radius:50%;background:var(--ods-foreground-inverse)}
.ods-radio[data-state="checked"]{border-color:var(--ods-transparent);background:var(--ods-background-inverse)}
.ods-radio[data-state="checked"] i{display:block}
/* Action — selection(칩 그리드) + input(pill) */
.chatdock{position:sticky;bottom:0;z-index:6;background:var(--ods-background-weak)}
.quick{display:flex;flex-wrap:wrap;gap:4px;padding:12px 16px;justify-content:flex-end;align-items:flex-end}
.quick > *{max-width:100%}
.chatbar{padding:0 16px 16px;display:flex;background:var(--ods-background-weak)}

/* B안 스텝형 */
.prog{padding:4px 16px 0}
/* ODS 에 progress bar 컴포넌트가 없어 Box + semantic 토큰으로 조합 [예외 기록] */
.prog .bar{height:3px;border-radius:2px;background:var(--ods-background-weak);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ods-background-brand);border-radius:2px;
  transition:width .35s cubic-bezier(.4,0,.2,1)}
.prog .meta{display:flex;justify-content:space-between;color:var(--ods-foreground-weak);margin-top:9px}
.form{padding:8px 16px 24px}
.fsec{margin-top:26px}
.fsec:first-child{margin-top:14px}
.fsec-h{display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--ods-foreground)}
.fsec>p.desc{color:var(--ods-foreground-weak);margin-bottom:14px}
.field{margin-top:18px}
.field .lb{display:flex;align-items:center;gap:6px;margin-bottom:9px;color:var(--ods-foreground);font-weight:600}
.field .why{color:var(--ods-foreground-weak);margin:-4px 0 9px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.stepdesc{color:var(--ods-foreground-weak);margin:12px 0 -6px}

/* 컨펌폼 — 서비스별 신청서 */
.deck-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 9px}
.deck-nav span{color:var(--ods-foreground-weak)}
.deck-dots{display:flex;gap:6px}
.deck-dots button{width:6px;height:6px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:var(--ods-border);transition:.18s}
.deck-dots button.on{width:18px;border-radius:3px;background:var(--ods-foreground)}
.deck{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 4px;
  align-items:stretch;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.deck::-webkit-scrollbar{display:none}
.deck.single{padding-top:16px}
.deck > .sheet{flex:0 0 calc(100% - 32px);scroll-snap-align:start}
.deck.single > .sheet{flex:0 0 100%}
.sheet{overflow:hidden;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:12px;padding:15px;background:var(--ods-background-brand-weak);
  border-bottom:1px solid var(--ods-border)}
.sheet .sh-ic{width:40px;height:40px;border-radius:var(--ods-radius-8);background:var(--ods-background-brand);
  color:var(--ods-foreground-inverse);display:grid;place-items:center;flex:0 0 auto}
.sheet .sh-t{flex:1;min-width:0}
.sheet .sh-t b{display:block;color:var(--ods-foreground)}
.sheet .sh-t span{display:block;color:var(--ods-foreground-weak);margin-top:3px}
.sh-body{padding:12px 15px;flex:1}
.sh-row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--ods-background-weak)}
.sh-row:first-child{border-top:0}
.sh-row>span{color:var(--ods-foreground-weak);flex:0 0 auto}
.sh-row>b{font-weight:500;color:var(--ods-foreground);text-align:right;display:flex;align-items:center;gap:5px;
  justify-content:flex-end;flex-wrap:wrap}
.sh-est{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 15px 12px;padding:11px 12px;
  border-radius:var(--ods-radius-8);background:var(--ods-background-inverse);color:var(--ods-foreground-inverse)}
.sh-est span{color:var(--ods-foreground-brand)}
.sh-est em{font-style:normal;color:rgba(255,255,255,.6);flex-basis:100%}
.sh-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 15px;background:var(--ods-background-weak)}
.sh-f b{font-weight:600;color:var(--ods-foreground)}
.sh-f span{color:var(--ods-foreground-weak)}
.sh-f em{font-style:normal;margin-left:auto}

/* 업체 추천 */
.filterbar{margin:14px 16px 0;background:var(--ods-background-inverse);color:var(--ods-foreground-inverse);
  border-radius:var(--ods-radius-8);padding:15px 16px}
.filterbar .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.filterbar .top span{color:var(--ods-foreground-brand)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{background:rgba(255,255,255,.11);border-radius:var(--ods-radius-4);padding:5px 8px;
  display:flex;align-items:center;gap:5px;color:rgba(255,255,255,.88)}
.fchip svg{color:var(--ods-foreground-brand)}
.plist{padding:14px 16px 24px;display:flex;flex-direction:column;gap:10px}
.pcard{padding:16px;cursor:pointer;transition:.15s;text-align:left;font-family:inherit;width:100%}
.pcard:hover{border-color:var(--ods-palette-gray-200)}
.pcard .ph{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.pcard .nm{flex:1;min-width:0}
.pcard .nm b{display:block;color:var(--ods-foreground)}
.pcard .nm span{color:var(--ods-foreground-weak);display:inline-flex;align-items:center;gap:3px}
.pcard .tags,.ph-head .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.why2{color:var(--ods-foreground);background:var(--ods-background-brand-weak);
  border-radius:var(--ods-radius-4);padding:10px 11px}
.why2 b{font-weight:700}
/* 상품 카드 */
.prod{width:100%;text-align:left;font-family:inherit;padding:15px;cursor:pointer;transition:.15s}
.prod:hover{border-color:var(--ods-palette-gray-200)}
.prod[aria-pressed="true"]{border-color:var(--ods-border-brand);background:var(--ods-background-brand-weak)}
.pr-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pr-n{flex:1;min-width:0;color:var(--ods-foreground)}
.pr-price{color:var(--ods-foreground);margin-bottom:10px}

/* 파트너홈 */
.ph-head{padding:20px 16px 16px;text-align:center}
.ph-head .ods-avatar{width:64px;height:64px;border-radius:var(--ods-radius-16);margin:0 auto 14px}
.ph-head p{color:var(--ods-foreground-weak);margin:7px 0 12px}
.ph-head .tags{justify-content:center}
.ph-stat{display:grid;grid-template-columns:repeat(3,1fr);margin:0 16px;overflow:hidden}
.ph-stat div{padding:14px 8px;text-align:center;border-left:1px solid var(--ods-background-weak)}
.ph-stat div:first-child{border-left:0}
.ph-stat b{display:block;color:var(--ods-foreground)}
.ph-stat span{display:block;color:var(--ods-foreground-weak);margin-top:4px}
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.ph-th{aspect-ratio:4/3}
.ph-rev{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.rv{padding:13px 14px}
.rv b{color:var(--ods-foreground);display:inline-flex;align-items:center;gap:3px}
.rv p{color:var(--ods-foreground);margin-top:6px}

/* 완료 — harness 레일의 li.done 과 충돌하지 않도록 #screen 으로 스코프 */
#screen .done{padding:44px 16px 24px;text-align:center}
.seal{width:64px;height:64px;border-radius:50%;background:var(--ods-background-brand-weak);
  color:var(--ods-foreground-brand);display:grid;place-items:center;margin:0 auto 20px;animation:pop .4s ease both}
#screen .done h2{margin-bottom:10px}
#screen .done>p{color:var(--ods-foreground)}
.expect{margin:24px 0 0;overflow:hidden;text-align:left}
.expect .er{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--ods-background-weak);align-items:flex-start}
.expect .er:first-child{border-top:0}
.expect .er .k{color:var(--ods-foreground-weak);flex:0 0 44px;padding-top:2px}
.expect .er .v{color:var(--ods-foreground)}
.expect .er .v b{font-weight:700}
.optout{margin-top:16px;color:var(--ods-foreground-weak)}
.statlist{margin-top:22px;padding:14px 15px;text-align:left}
.st-cap{color:var(--ods-foreground-weak);margin-bottom:10px}
.st-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ods-background-weak)}
.st-row:first-of-type{border-top:0}
.st-ic{width:28px;height:28px;border-radius:var(--ods-radius-8);background:var(--ods-background-weak);
  color:var(--ods-foreground-weak);display:grid;place-items:center;flex:0 0 auto}
.st-t{flex:1;min-width:0}
.st-t b{display:block;color:var(--ods-foreground)}
.st-t span{display:block;color:var(--ods-foreground-weak);margin-top:2px}
.st-note{color:var(--ods-foreground-weak);margin-top:11px;padding-top:11px;border-top:1px solid var(--ods-background-weak)}

/* 상단 고정 진입점 */
.pbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:11px;
  margin:12px 16px 0;padding:13px 14px;border-radius:var(--ods-radius-8);
  border:1px solid var(--ods-border);background:var(--ods-background)}
.pbar .pdot{white-space:nowrap;flex:0 0 auto}
.pbar .ptxt{flex:1;min-width:0}
.pbar .ptxt b{display:block;color:var(--ods-foreground)}
.pbar .ptxt span{display:block;color:var(--ods-foreground-weak);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 상태별 시각 구분 — 행동 필요(작성 중·추가 정보)는 강조, 대기(매칭·예약)는 차분 (§3.4) */
.pbar[data-tone="wait"]{background:var(--ods-background-brand-weak);border-color:var(--ods-background-brand-weak)}
.pbar[data-tone="act"]{background:var(--ods-background-attention-weak);border-color:var(--ods-border-attention)}
.pbar[data-tone="quoted"]{background:var(--ods-background-brand-weak);border-color:var(--ods-border-brand)}

/* 예상 견적 range */
.estcard{margin:16px 16px 0;border-radius:var(--ods-radius-8);padding:22px 20px;
  background:var(--ods-background-inverse);color:var(--ods-foreground-inverse)}
.estcard .cap{color:var(--ods-foreground-brand);margin-bottom:14px}
.estcard .range{display:flex;align-items:baseline;gap:8px}
.estcard .range span{color:rgba(255,255,255,.45)}
.estcard .rbar{height:5px;border-radius:3px;background:rgba(255,255,255,.14);margin:18px 0 14px;overflow:hidden}
.estcard .rbar i{display:block;height:100%;width:56%;margin-left:18%;border-radius:3px;
  background:var(--ods-background-brand)}
.estcard .rwhy{display:flex;flex-wrap:wrap;gap:5px}
.estcard .rwhy span{background:rgba(255,255,255,.11);border-radius:var(--ods-radius-4);padding:5px 8px;
  color:rgba(255,255,255,.85)}
.runknown,.rdelta{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.16);
  color:rgba(255,255,255,.68)}
.runknown b,.rdelta b{color:var(--ods-foreground-brand);font-weight:600}

/* ═══ FLOW C · 02 Map Discovery ══════════════════════════
   Figma 917:14693(기본 · 주변 업체 BottomSheet) / 917:14669(판교라운지 popover).
   구성: Search Top Navigation + bundle_location(공통 chrome) → 전체 지도 + Pin
        → Floating BottomSheet(주변 업체 목록).
   라운지 핀을 누르면 지도 판이 110px 내려가고 popover 가 열리며 시트는 닫힌다(917:14669).
   [토큰 매핑] Figma 원본은 legacy BDS 팔레트다 — base_1 #2F3438→foreground,
   base_2 #828C94→foregroundWeak, base_3 #C2C8CC→foregroundDisabled,
   divider #EAEDEF→border, badge bg #F3F4F6→backgroundWeak, badge fg #595959→foregroundWeak. */
.screen:has(.md-page){overflow:hidden;display:flex;flex-direction:column}
.md-page{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;
  background:var(--ods-background)}
.md-map{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--ods-background-weak)}
/* 지도 판 — 지도 이미지와 핀이 함께 움직인다 (917:14693 → 917:14669 는 +110px 팬) */
.md-plane{position:absolute;inset:0}
.md-plane .md-img{position:absolute;left:-130px;top:-211px;width:881px;height:881px;
  max-width:none;pointer-events:none;user-select:none}

/* Pin (892:15014) — Map Marker Icon(흰 박스 + Depth20) + 라벨.
   크기 축: data-state="default"(sheet 1행) / "active"(2행). 타입 축: data-kind. */
.md-pin{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:0;padding:0;font-family:inherit;color:var(--ods-foreground);z-index:1}
.md-pin[data-state="active"]{gap:4px}
.md-pin[data-act="1"]{cursor:pointer}
.md-pin .mp-ic{display:flex;align-items:center;justify-content:center;padding:2px;
  background:var(--ods-background);filter:drop-shadow(0 2px 5px rgba(63,71,77,.25))}
.md-pin .mp-ic img{display:block}
.md-pin .mp-lb{max-width:72px;max-height:36px;overflow:hidden;text-align:center;
  color:var(--ods-foreground)}
.md-pin:focus-visible{outline:2px solid var(--ods-foreground-brand);outline-offset:3px;border-radius:8px}
/* standard — r8 박스 + backgroundBrand r6 이너(22→24) + 심볼(16→18) */
.md-pin[data-kind="standard"] .mp-ic{border-radius:8px}
.md-pin[data-kind="standard"] .mp-in{width:22px;height:22px;border-radius:6px;overflow:hidden;
  background:var(--ods-background-brand);display:grid;place-items:center}
.md-pin[data-state="active"][data-kind="standard"] .mp-in{width:24px;height:24px}
/* lightplus · membership — r22 박스 + 이너(20→22) */
.md-pin[data-kind="lightplus"] .mp-ic,.md-pin[data-kind="membership"] .mp-ic{border-radius:22px}
/* light — r18 박스 + backgroundBrand 원(12→14) */
.md-pin[data-kind="light"] .mp-ic{border-radius:18px}
.md-pin[data-kind="light"] .mp-in{width:12px;height:12px;border-radius:21px;background:var(--ods-background-brand)}
.md-pin[data-state="active"][data-kind="light"] .mp-in{width:14px;height:14px}
/* common — r18 박스 + backgroundBrand 10 원 (라벨 없음) */
.md-pin[data-kind="dot"] .mp-ic{border-radius:18px}
.md-pin[data-kind="dot"] .mp-in{width:10px;height:10px;border-radius:21px;background:var(--ods-background-brand)}
/* 오늘의집 라운지 — r8 박스(26→28) + Ohouse 심볼(22→24) */
.md-pin[data-kind="lounge"] .mp-ic{border-radius:8px;width:26px;height:26px}
.md-pin[data-state="active"][data-kind="lounge"] .mp-ic{width:28px;height:28px}
/* 선택된업체 — pin container teardrop (32×41 → 36×46).
   지면에서는 라운지 핀이 선택되면 이 타입으로 교체된다 (917:14669) */
.md-pin[data-kind="selected"] .mp-ic{width:32px;height:41px;padding:0;background:none;
  filter:drop-shadow(0 2px 5px rgba(63,71,77,.25));border-radius:0}
.md-pin[data-state="active"][data-kind="selected"] .mp-ic{width:36px;height:46px}
/* 우리집 — backgroundInverse 원형(32→36) + PlaceHouseFilled (2460:15638 / 2460:17071) */
.md-pin[data-kind="home"] .mp-ic{width:32px;height:32px;border-radius:24px;padding:0;filter:none;
  background:var(--ods-background-inverse);color:var(--ods-foreground-inverse)}
.md-pin[data-state="active"][data-kind="home"] .mp-ic{width:36px;height:36px}

/* Pin/Contents (917:18033 default / 917:18032 active) — 단지 콘텐츠 썸네일 핀.
   pin container w52 · px2 py3 · drop-shadow(0 3px 2px #3F474D45).
   default: img36 · 라벨/tip 없음 / active: img48 + tip(14×10) + 라벨 */
.md-pin[data-kind="contents"] .mp-ic{position:relative;flex-direction:column;width:52px;
  padding:3px 2px;background:none;border-radius:0;
  filter:drop-shadow(0 3px 2px rgba(63,71,77,.27))}
.md-pin[data-kind="contents"] .mpc-box{position:relative;display:block}
.md-pin[data-kind="contents"] .mpc-img{display:block;width:36px;height:36px;box-sizing:border-box;
  border:2px solid var(--ods-background);border-radius:8px;overflow:hidden;
  background:var(--ods-background-weak)}
.md-pin[data-state="active"][data-kind="contents"] .mpc-img{width:48px;height:48px}
.md-pin[data-kind="contents"] .mpc-img img{width:100%;height:100%;object-fit:cover;display:block}
.md-pin[data-kind="contents"] .mpc-tip{width:14px;height:10px}
/* PillBadge size=16 (100:74323) — 썸네일 우상단에 겹친다 */
.md-pin .mp-pill{position:absolute;top:-5px;right:-6px;z-index:1;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;min-height:16px;max-height:16px;padding:0 6px;
  border-radius:15px;background:var(--ods-background-inverse);
  border:1.5px solid var(--ods-border-inverse);color:var(--ods-foreground-inverse)}

/* ═══ 실시간 지도 (Kakao Maps JavaScript SDK) ═══════════════════════
   ODS 에는 지도 컴포넌트가 없어 카카오 지도를 쓰되, 그 위의 Pin·BottomSheet 는
   모두 ODS 스펙 그대로다. SDK·도메인 등록이 실패하면 Figma 지도 에셋으로 폴백한다. */
.map-slot{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--ods-background-weak)}
.live-map{position:absolute;inset:0}
.live-map *{font-family:inherit}
/* CustomOverlay — 좌표에 콘텐츠 좌상단이 붙으므로, 여기서 앵커만큼 되돌린다 */
.mk-pin{transform:translate(-50%,calc(-1 * var(--mk-y,0px)));white-space:nowrap;display:block}
.mk-pin .md-pin{position:static}
/* SDK 거절 안내 — 지도 위에 얹는 CautionBox 형태 */
.map-err{position:absolute;left:16px;right:16px;top:12px;z-index:5;
  padding:14px 16px;border-radius:8px;box-sizing:border-box;
  background:var(--ods-background);border:1px solid var(--ods-border);
  box-shadow:0 2px 10px 0 rgba(63,71,77,.16);color:var(--ods-foreground);
  max-height:calc(100% - 24px);overflow-y:auto}
.map-err b{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.map-err b svg{flex:0 0 auto;color:var(--ods-foreground-attention)}
.map-err p{margin:0;color:var(--ods-foreground-weak)}
.map-err ol{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.map-err li{color:var(--ods-foreground-weak)}
.map-err li b{display:inline;color:var(--ods-foreground);font-weight:600}
.map-err code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  background:var(--ods-background-weak);padding:1px 5px;border-radius:4px;
  color:var(--ods-foreground);word-break:break-all}
.map-err .mx-hint{margin-top:10px;padding-top:10px;border-top:1px solid var(--ods-border)}
.map-err .mx-ok{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:4px;
  font-size:10px;line-height:14px;background:var(--ods-background-brand-weak);
  color:var(--ods-foreground-brand);vertical-align:1px}
.map-err .mx-close{position:absolute;right:8px;top:8px;width:24px;height:24px;padding:0;
  display:grid;place-items:center;border:0;border-radius:9999px;background:none;cursor:pointer;
