<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>O2O 통합 오퍼링 — ODS 프로토타입</title>
<link rel="stylesheet" href="https://assets.ohou.se/fonts/pretendard/v1.3.8/pretendardvariable-dynamic-subset.css">
<style>
/* ═════════════════════════════════════════════════════════════
   O2O 통합 신청폼 — ODS 토큰 프로토타입

   [1] harness 토큰 — preview stage / 컨트롤 패널 / 폰 베젤 / statusbar
       CLAUDE.md 규칙상 GNB·statusbar·preview harness 는 feature 가 아니므로
       ODS 규칙(컴포넌트·아이콘·토큰) 적용 대상에서 제외한다.
   [2] ODS semantic 토큰 — 폰 내부(feature) 전 영역
       값 = @bucketplace/tokens PALETTE 실측 hex, 변수명 = ODS semantic 토큰명.
       raw hex 를 직접 쓰지 않고 반드시 이 변수를 경유한다.
   ═════════════════════════════════════════════════════════════ */

/* ── [1] harness 전용 (ODS 대상 아님) ───────────────────────── */
:root{
  /* harness = 라이트 그레이 솔리드 캔버스 + 블랙 디바이스 목업 (ODS 대상 아님) */
  --hz-canvas:#E9EAEC;        /* 프리뷰 바깥 솔리드 그레이 배경 */
  --hz-bezel:#0B0B0C;         /* 디바이스 블랙 베젤 */
  --hz-chalk:#2E2F33;         /* 패널 기본 텍스트 (dark) */
  --hz-chalk-dim:#70757B;     /* 패널 보조 텍스트 (medium gray) */
  --hz-mint:#0E9F6E;          /* 패널 accent (light 배경에서 읽히는 dark green) */
  --hz-line:rgba(0,0,0,.14);  /* 패널 구분선/보더 */
  --hz-hover:rgba(0,0,0,.05); /* 패널 hover 배경 */
  --hz-accent-weak:rgba(14,159,110,.12); /* accent tint */
  --hz-mono:"IBM Plex Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
}

/* ── [2] ODS semantic color 토큰 (light) ────────────────────── */
:root{
  /* background */
  --ods-background:#FFFFFF;                 /* colors.background        = white */
  --ods-background-weak:#F5F5F5;            /* colors.backgroundWeak    = gray.50 */
  --ods-background-disabled:#EDEDED;        /* colors.backgroundDisabled= gray.100 */
  --ods-background-inverse:#141414;         /* colors.backgroundInverse = gray.900 */
  --ods-background-brand:#00A1FF;           /* colors.backgroundBrand   = genuineBlue.350 */
  --ods-background-brand-weak:#F0F8FC;      /* colors.backgroundBrandWeak = genuineBlue.50 */
  --ods-background-critical:#FD3D4A;        /* colors.backgroundCritical = red.400 */
  --ods-background-critical-weak:#FCF1F1;   /* colors.backgroundCriticalWeak = red.50 */
  --ods-background-attention:#D19506;       /* colors.backgroundAttention = yellow.350 */
  --ods-background-attention-weak:#FCF4DD;  /* colors.backgroundAttentionWeak = yellow.50 */
  --ods-background-dim:rgba(0,0,0,.4);      /* colors.backgroundDim     = blackAlpha.400 */
  /* border */
  --ods-border:#E0E0E0;                     /* colors.border            = gray.150 */
  --ods-border-strong:#141414;              /* colors.borderStrong      = gray.900 */
  --ods-border-brand:#00A1FF;               /* colors.borderBrand       = genuineBlue.350 */
  --ods-border-critical:#FD3D4A;            /* colors.borderCritical    = red.400 */
  --ods-border-attention:#D19506;           /* colors.borderAttention   = yellow.350 */
  --ods-border-inverse:#FFFFFF;             /* colors.borderInverse     = white */
  /* foreground */
  --ods-foreground:#141414;                 /* colors.foreground        = gray.900 */
  --ods-foreground-weak:#8C8C8C;            /* colors.foregroundWeak    = gray.400 */
  --ods-foreground-disabled:#C1C1C1;        /* colors.foregroundDisabled= gray.250 */
  --ods-foreground-inverse:#FFFFFF;         /* colors.foregroundInverse = white */
  --ods-foreground-brand:#00A1FF;           /* colors.foregroundBrand   = genuineBlue.350 */
  --ods-foreground-critical:#FD3D4A;        /* colors.foregroundCritical= red.400 */
  --ods-foreground-attention:#B27800;       /* colors.foregroundAttention = yellow.450 */
  /* accent */
  --ods-accent-purple:#6F3DDE;              /* colors.accentPurple      = purple.550 */
  --ods-accent-blue:#0079FA;                /* colors.accentBlue        = @bucketplace/tokens 3.12.0 */
  --ods-accent-yellow:#FFC300;              /* colors.accentYellow      = 별점(리뷰) */
  /* palette — theme 미지원 컨텍스트(그라데이션·투명도)에서만 사용 */
  --ods-palette-gray-100:#EDEDED;
  --ods-palette-gray-200:#CECECE;
  --ods-palette-genuineblue-100:#DDF3FF;
  --ods-transparent:transparent;

  /* ODS 는 spacing/radius semantic 토큰이 없고 컴포넌트에 값이 내장돼 있다.
     실측 radius: Input/badge/CautionBox 4 · BoxButton s·xs 6 · BoxButton m·l·xl 8
     · BottomSheet 16 · Chip 9999 */
  --ods-radius-4:4px;
  --ods-radius-6:6px;
  --ods-radius-8:8px;
  --ods-radius-16:16px;
  --ods-radius-full:9999px;

  /* ODS GLOBAL_STYLE_FONT */
  --ods-font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}

/* ── ODS textStyle (TEXT_STYLE 실측값) ──────────────────────── */
.t-heading32{font-size:32px;line-height:42px;letter-spacing:-.3px}
.t-heading24{font-size:24px;line-height:32px;letter-spacing:-.3px}
.t-heading20{font-size:20px;line-height:28px;letter-spacing:-.3px}
.t-heading18{font-size:18px;line-height:24px;letter-spacing:-.3px}
.t-heading17{font-size:17px;line-height:26px;letter-spacing:-.3px}
.t-body20L28{font-size:20px;line-height:28px;letter-spacing:-.3px}
.t-body17L22{font-size:17px;line-height:22px;letter-spacing:-.3px}
.t-body16L28{font-size:16px;line-height:28px;letter-spacing:-.3px}
.t-body16L24{font-size:16px;line-height:24px;letter-spacing:-.3px}
.t-body16L20{font-size:16px;line-height:20px;letter-spacing:-.3px}
.t-body15L24{font-size:15px;line-height:24px;letter-spacing:-.3px}
.t-body14L20{font-size:14px;line-height:20px;letter-spacing:-.3px}
.t-body14L18{font-size:14px;line-height:18px;letter-spacing:-.3px}
.t-detail13L18{font-size:13px;line-height:18px;letter-spacing:-.3px}
.t-detail12L20{font-size:12px;line-height:20px;letter-spacing:-.3px}
.t-detail12L16{font-size:12px;line-height:16px;letter-spacing:-.3px}
.t-detail11L14{font-size:11px;line-height:14px;letter-spacing:-.3px}
.t-detail10L14{font-size:10px;line-height:14px;letter-spacing:-.3px}
/* FONT_WEIGHT */
.w-regular{font-weight:400}.w-medium{font-weight:500}.w-semibold{font-weight:600}.w-bold{font-weight:700}
/* semantic color 유틸 */
.c-fg{color:var(--ods-foreground)}
.c-fg-weak{color:var(--ods-foreground-weak)}
.c-fg-brand{color:var(--ods-foreground-brand)}
.c-fg-inverse{color:var(--ods-foreground-inverse)}
.c-fg-critical{color:var(--ods-foreground-critical)}
.c-fg-attention{color:var(--ods-foreground-attention)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ods-font);
  color:var(--hz-chalk);
  background:var(--hz-canvas);
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.3px;
  padding:26px 22px 60px;
}
:focus-visible{outline:2px solid var(--hz-mint);outline-offset:2px;border-radius:4px}

/* ═══════════ harness — stage / 컨트롤 패널 / 폰 ═══════════ */
.stage{max-width:700px;margin:0 auto;display:flex;gap:52px;align-items:flex-start;justify-content:center}
.panel{position:sticky;top:26px;width:196px;flex:0 0 auto;padding-top:6px;display:flex;flex-direction:column;gap:34px}
.panel h3{font-family:var(--hz-mono);font-size:10px;letter-spacing:.2em;color:var(--hz-mint);font-weight:400;margin-bottom:14px}
.panel ul,.panel ol{list-style:none}

.panel-menu li{margin-bottom:1px}
.panel-menu button{
  width:100%;text-align:left;background:none;border:0;cursor:pointer;font-family:inherit;
  font-size:12px;letter-spacing:-.02em;color:var(--hz-chalk-dim);padding:7px 9px;border-radius:6px;
  display:flex;gap:9px;align-items:baseline;transition:.14s;
}
.panel-menu button i{font-style:normal;font-family:var(--hz-mono);font-size:9.5px;opacity:.6;flex:0 0 22px}
.panel-menu button:hover{background:var(--hz-hover);color:var(--hz-chalk)}
.panel-menu button[aria-current="true"]{background:var(--hz-accent-weak);color:var(--hz-chalk);font-weight:700}
.panel-menu button[aria-current="true"] i{color:var(--hz-mint);opacity:1}
.branch-group{margin-bottom:14px}
.branch-group .branch-cap{display:block;font-family:var(--hz-mono);font-size:9px;letter-spacing:.12em;
  color:var(--hz-chalk-dim);padding:2px 9px 7px}
.branch-group ul{list-style:none;padding-left:2px}
.panel-section.hidden{display:none}
/* Flow A/B 토글 + 화면 보기 서브 옵션 */
.flow-panel{display:flex;flex-direction:column;gap:10px;align-self:stretch}
.flow-tabs{display:flex;gap:4px;padding:3px;border:1px solid var(--hz-line);border-radius:10px;background:var(--hz-hover)}
.flow-tab{flex:1;padding:7px 4px;border:0;border-radius:7px;background:transparent;color:var(--hz-chalk-dim);
  font-family:var(--hz-mono);font-size:10px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:.14s}
.flow-tab:hover{color:var(--hz-chalk)}
.flow-tab[aria-pressed="true"]{background:var(--hz-canvas);color:var(--hz-chalk);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.flow-views{display:flex;gap:6px;flex-wrap:wrap}
.flow-views.hidden{display:none}
.flow-views .preview-toggle{margin:0}
/* Flow A·B 숨김 — .flow-tab/.flow-views 가 display 를 갖고 있어 UA 의 [hidden] 규칙을 이긴다 */
.flow-tab[hidden],.flow-views[hidden]{display:none}

#rail{position:relative}
#rail::before{content:"";position:absolute;left:5px;top:8px;bottom:12px;width:1px;background:var(--hz-line)}
#rail li{position:relative}
#rail li button{
  width:100%;text-align:left;background:none;border:0;cursor:pointer;font-family:inherit;
  font-size:12.5px;letter-spacing:-.02em;color:var(--hz-chalk-dim);padding:5px 6px 5px 24px;border-radius:6px;
  margin-bottom:9px;transition:.14s;
}
#rail li button::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:50%;
  border:1px solid rgba(0,0,0,.28);background:var(--hz-canvas)}
#rail li button .n{font-family:var(--hz-mono);font-size:10px;opacity:.55;margin-right:7px}
#rail li button:hover{background:var(--hz-hover);color:var(--hz-chalk)}
#rail li.done button{color:rgba(46,47,51,.45)}
#rail li.done button::before{background:var(--hz-chalk-dim);border-color:var(--hz-chalk-dim)}
#rail li.now button{color:var(--hz-chalk);font-weight:700}
#rail li.now button::before{background:var(--hz-mint);border-color:var(--hz-mint);box-shadow:0 0 0 4px rgba(14,159,110,.2)}
#rail li.split{padding:2px 0 12px 24px;list-style:none}
#rail li.split::before{display:none}
#rail li.split span{font-family:var(--hz-mono);font-size:9px;letter-spacing:.14em;color:var(--hz-chalk-dim);
  border-top:1px dashed var(--hz-line);display:block;padding-top:11px}
#rail li.p2{opacity:.78}
/* 화면 보기 — 플로우 메뉴 최상단 고정 버튼 + 프리뷰(폰) 전체화면 토글
   -1: 기본 진입(홈 상단 종합 상담 인풋) / -2: 하단 플로팅 CTA 진입점 */
.preview-toggles{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-start}
.preview-toggle{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  padding:8px 13px;border:1px solid var(--hz-line);border-radius:9999px;background:var(--hz-hover);
  color:var(--hz-chalk);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.14s}
.preview-toggle:hover{background:var(--hz-accent-weak)}
.preview-toggle svg{opacity:.75}
.preview-exit{display:none}
body.preview-only{padding:0}
body.preview-only .panel{display:none}
/* 모바일 브라우저는 100vh 가 주소창·하단 툴바까지 포함한 큰 뷰포트라 하단이 툴바 뒤로 잘린다.
   실제 보이는 높이(100dvh)를 쓰고, 미지원 브라우저는 위 100vh 로 폴백. */
body.preview-only .phone{position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:min(100vw,420px);height:100vh;height:100dvh;max-width:none;border-radius:0;box-shadow:none}
/* statusbar·home indicator(OS chrome) 미노출 — 실기기에선 OS/브라우저 바가 그 자리를 차지한다 */
body.preview-only .statusbar,
body.preview-only .gnb-ind{display:none}
/* [메뉴 보기] — 폰 우측 상단 플로팅 아이콘 버튼(아이콘만) */
body.preview-only .preview-exit{display:inline-flex;align-items:center;justify-content:center;
  position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:30;
  width:48px;height:48px;padding:0;border:0;border-radius:9999px;background:rgba(20,20,20,.72);color:#fff;
  cursor:pointer;backdrop-filter:blur(4px);box-shadow:0 8px 22px -8px rgba(0,0,0,.55)}
body.preview-only .preview-exit:hover{background:rgba(20,20,20,.92)}
body.preview-only .preview-exit svg{opacity:.9}
/* Simple Browser — 프리뷰 위에 프로토타입 메뉴 오버레이 */
.panel-head{display:none}
body.preview-only.menu-open .preview-exit{display:none}
body.preview-only.menu-open .panel{
  display:flex;flex-direction:column;gap:22px;
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:min(100vw,420px);height:100vh;height:100dvh;max-width:none;
  z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px));
  background:var(--hz-canvas);box-shadow:none;
}
body.preview-only.menu-open .panel section{flex:none;width:100%;min-width:0}
body.preview-only.menu-open .panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:1;margin:-16px -16px 0;padding:16px 16px 12px;
  background:var(--hz-canvas);
}
.panel-head h2{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--hz-chalk)}
.panel-close{display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;padding:0;border:0;border-radius:9999px;
  background:var(--hz-hover);color:var(--hz-chalk);cursor:pointer}
.panel-close:hover{background:var(--hz-accent-weak)}
/* 엔트리 헤더(navi + 주소변경)는 스크롤 고정, 아래 block container 만 스크롤 */
body.preview-only .o2o-home .home-top{position:sticky;top:0;z-index:6;background:var(--ods-background)}

/* ═══ 화면 보기-2 진입점 — 홈 하단 플로팅 CTA (Figma 90:34954 · 90:35959/35960) ═══
   90:35960 에서 상단 totalConsulting(종합 상담 인풋) 은 hidden 이고, 진입점이 이 버튼으로 대체된다. */
body.view2 .offering{display:none}
body.view3 .offering{display:none}
body.view4 .offering{display:none}

/* ═══ 화면 보기-3 · O2H 통합 비교견적 플로우 (Figma 340:39827 · 홈 402:34413 · 430:93197) ═══ */
body.view3 .o2o-home{padding-bottom:120px}
.o2h-banner{margin:16px 16px 0;border-radius:12px;overflow:hidden;height:82px;position:relative;
  background:var(--ods-background-brand-weak)}
.o2h-banner-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.o2h-banner-cap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:0 16px;background:linear-gradient(90deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.55) 55%,transparent 100%)}
.o2h-banner-cap b{display:block;color:var(--ods-foreground)}
.o2h-banner-cap span{color:var(--ods-foreground-weak)}
.o2h-banner-ind{position:absolute;right:12px;bottom:8px;padding:2px 8px;border-radius:100px;
  background:rgba(0,0,0,.45);color:#fff;line-height:14px}
.o2h-menu-wrap{background:var(--ods-background-weak);padding:16px}
.o2h-menu-stack{display:flex;flex-direction:column;gap:6px}
.o2h-feat-card{display:flex;align-items:center;gap:10px;width:100%;min-height:80px;padding:18px 16px;
  border:0;border-radius:12px;background:var(--ods-background);cursor:pointer;font-family:inherit;text-align:left;
  box-shadow:2px 2px 20px rgba(194,200,204,.2)}
.o2h-feat-body{flex:1;min-width:0}
.o2h-feat-body b{display:block;color:var(--ods-foreground)}
.o2h-feat-body span{display:block;color:var(--ods-foreground-weak);margin-top:2px}
.o2h-feat-ic,.o2h-feat-chev{flex:0 0 auto;color:var(--ods-foreground-weak)}
.o2h-sec-card{padding:16px;border-radius:12px;background:var(--ods-background);
  box-shadow:2px 2px 20px rgba(194,200,204,.2)}
.o2h-sec-t{display:block;margin-bottom:12px;color:var(--ods-foreground)}
.o2h-part-row{display:flex;gap:8px;align-items:flex-start}
.o2h-part-left{display:flex;gap:12px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.o2h-part-left::-webkit-scrollbar{display:none}
.o2h-part-item{flex:0 0 56px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:0;cursor:pointer;font-family:inherit;padding:0}
.o2h-part-more{flex:0 0 41px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:0;cursor:pointer;font-family:inherit;padding:0;color:var(--ods-foreground)}
.o2h-part-more-ic{width:28px;height:28px;border-radius:50%;background:var(--ods-background-weak);
  display:grid;place-items:center;color:var(--ods-foreground-weak)}
.o2h-menu-row{display:flex;align-items:center;gap:8px;padding:12px 4px;margin-top:8px;
  border-top:1px solid var(--ods-border);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;
  width:100%;font-family:inherit;text-align:left}
.o2h-menu-row-ic{flex:0 0 24px}
.o2h-menu-row-t{flex:1;color:var(--ods-foreground)}
/* "이사 계획 중이라면" 5-up — Figma 638:33016 › Menu-LS.
   카드 좌우 패딩 12 · 타이틀 아래 8 · 아이콘 프레임 56(padding 4)에 강조 배경 없음 */
.o2h-plan-card{padding:16px 12px}
.o2h-plan-card .o2h-sec-t{margin-bottom:8px}
.o2h-compact{display:flex;gap:10px;justify-content:space-between;align-items:center}
.o2h-compact-item{display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:none;border:0;cursor:pointer;font-family:inherit;padding:0;
  border-radius:12px;overflow:hidden}
.o2h-compact-ic{width:56px;height:56px;padding:4px;border-radius:12px;overflow:hidden;
  display:grid;place-items:center}
.o2h-compact-lb{min-width:100%;text-align:center;color:var(--ods-foreground)}
.o2h-nudge{position:absolute;left:50%;bottom:16px;z-index:8;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;padding:12px 16px;border-radius:100px;border:0;cursor:pointer;
  font-family:inherit;white-space:nowrap;background:var(--ods-background-inverse);color:var(--ods-foreground-inverse);
  box-shadow:0 -4px 2.5px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.06)}
.o2h-nudge svg{flex:0 0 auto;opacity:.95}
.phone:has(.home-gnb) .o2h-nudge{bottom:104px}
body.preview-only .phone:has(.home-gnb) .o2h-nudge{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.o2h-inprogress{position:absolute;left:0;right:0;bottom:0;z-index:9;display:flex;align-items:center;
