/* 상담 신청 완료 카드 (Figma 137:115367 · 208:3065) — 제목+체크 / Divider / 상세 안내 */
function doneCard(t){
  const lead = t ? `<b class="w-semibold">${t} 희망 시간대</b>에` : `<b class="w-semibold">희망하시는 시간대</b>에`;
  return `<div class="bub bot done-card">
    <div class="dc-h"><span class="dc-t t-heading17 w-semibold">상담 신청 완료</span><span class="dc-chk">${ic('IconCheckCircleFilled',16)}</span></div>
    <hr class="ods-divider">
    <div class="dc-body t-body16L20 w-medium">${lead} 오늘의집 전문 상담원이 연락을 드릴게요.<br><br>*늦어도 평일 기준 24시간 이내 연락을 드릴 예정이에요.<br>*모르는 번호로 연락이 갈 수 있으니 확인해주세요.</div>
  </div>`;
}

/* 현재 진행 스텝 목록 — 선택 서비스 문항 + 크로스셀 + 견적/제안/연락처/완료 */
function formSteps(){
  const steps=[]; const seen=new Set();
  /* 공통 항목(id 동일)은 한 번만 push → 중복 문항·progress 총합 부풀림 방지 */
  const pushQ=(svc,q)=>{ if(!q) return; if(q.id && seen.has(q.id)) return; if(q.id) seen.add(q.id); steps.push({kind:'q', svc, ...q}); };
  const picked = FSVC_ORDER.filter(k=>S.picked.has(k));

  /* ── 시공(종합/부분): 평수·주소·범위·공간·일정은 공통 1회, 예산만 종합/부분 각각 1회(예산끼리 인접) ── */
  const con = picked.filter(k=>k==='full'||k==='part');
  if(con.length){
    const P=con[0], byId=id=>(QMX[P]||[]).find(q=>q.id===id);
    pushQ(P, byId('size'));
    pushQ(P, byId('caddr'));
    if(S.picked.has('full')) pushQ('full', QMX.full.find(q=>q.id==='fbudget'));  // 종합시공-예산 1회
    if(S.picked.has('part')) pushQ('part', QMX.part.find(q=>q.id==='pbudget'));  // 부분시공-예산 1회
    pushQ(P, byId('scope'));
    pushQ(P, byId('space'));
    pushQ(P, byId('cdate'));
    /* 크로스셀: 짐있음 → 이사 / 시공 → 청소 */
    if((S.ans.space||[])[0]==='시공 시 짐 (일부) 있을 예정' && !S.picked.has('move') && !(S.dismiss||{}).move)
      steps.push({kind:'cross', svc:'move', q:'짐이 있으시군요. 보관이사도 함께 상담 받아보시겠어요?'});
    if(!S.picked.has('clean') && !(S.dismiss||{}).clean)
      steps.push({kind:'cross', svc:'clean', q:'시공 후 인테리어 청소도 함께 상담 받아보시겠어요?'});
  }
  /* ── 이사·청소·인터넷·렌탈 (평수 등 공통 id는 dedup 되어 prefill) ── */
  const hasConAddr = (S.ans.caddr||[]).length>0;   // 시공 주소 입력 여부
  picked.filter(k=>k!=='full'&&k!=='part').forEach(k=>{ (QMX[k]||[]).forEach(q=>{
    /* 시공지 주소가 있으면 이사 도착지·이사청소 주소지는 물어보지 않고 시공 주소로 채운다 */
    if(hasConAddr && q.skipIfConAddr){ S.ans[q.id]=[S.ans.caddr[0]]; return; }
    pushQ(k,q);
  }); });

  steps.push({kind:'gen'},{kind:'offer'},{kind:'contact'},{kind:'time'},{kind:'done'});
  return steps;
}
/* 첫 미해결 스텝 */
function curStep(steps){
  for(const s of steps){
    /* 멀티 문항은 '고른 걸로 할게요' 확정 전까지 현재 스텝 유지(첫 선택에 넘어가지 않게) */
    if(s.kind==='q'    && (s.multi ? !(S.confirmed&&S.confirmed.has(s.id)) : !(S.ans[s.id]||[]).length)) return s;
    if(s.kind==='cross') return s;                 // 미해결일 때만 생성됨
    if(s.kind==='gen'    && !S.genDone)    return s;
    if(s.kind==='offer'  && !S.offerDone)  return s;
    if(s.kind==='contact'&& !S.contactDone)return s;
    if(s.kind==='time'   && !S.timeDone)   return s;
    if(s.kind==='done') return s;
  }
  return null;
}

VIEW.form = ()=>{
  const steps = formSteps();
  const cur = curStep(steps);
  const qSteps = steps.filter(s=>s.kind==='q');
  const qDone = qSteps.filter(s=> s.multi ? (S.confirmed&&S.confirmed.has(s.id)) : (S.ans[s.id]||[]).length).length;
  const isGen = cur && cur.kind==='gen';   // 견적 생성중 → floatingProgress/loading
  /* 견적 발송(genDone) → confirm / 상담 신청 완료(S.ffin) → inquiry */
  const bar = S.genDone
    ? floatingBar({mode:'confirm', value:estText(), action:S.ffin?'상담예약중':'맞춤 상담 신청', disabled:S.ffin})
    : isGen
    ? floatingBar({mode:'loading', label:'총 예상 견적 계산 중...'})
    : floatingBar({mode:'progress', label:'필수 정보 입력', done:Math.min(qDone,qSteps.length), total:qSteps.length});

  screen.innerHTML = `<div class="chat-screen">
    ${topNav({title:'견적 한번에 받기', backId:'bk'})}
    ${bar}
    <div class="chat" id="chat"></div>
    <div class="chatdock"><div class="quick" id="quick"></div></div>
    ${S.modal?formModal():''}
    ${S.sheet==='fullpage'?fullpageSheet():S.sheet==='cfmDone'?cfmDoneSheet():S.sheet==='cross'?crossSheet():''}
  </div>`;
  screen.classList.toggle('has-sheet', !!S.modal || !!S.sheet);
  $('#bk').onclick = ()=> go('select');
  /* confirm 상태 floatingProgress 클릭 → floatingfullpage 바텀시트로 이동 (inquiry면 버튼 disabled) */
  const fb=$('#fbGo'); if(fb) fb.onclick = ()=>{ if(!S.ffin){ S.sheet='fullpage'; render(); } };
  if(S.sheet==='fullpage'){
    const close=()=>{ S.sheet=null; render(); };
    const ov=$('#fpOv'); if(ov) ov.onclick=close;
    const x=$('#fpX'); if(x) x.onclick=close;
    /* 비교 견적 받기 → 비교견적 컨펌 모달 */
    const cmp=$('#fpCmp'); if(cmp) cmp.onclick=()=>{ S.sheet='cross'; render(); };
    /* 맞춤 상담 신청 → 상담 신청 완료 컨펌 모달 */
    const ap=$('#fpApply'); if(ap && !S.ffin) ap.onclick=()=>{
      S.offerDone=S.contactDone=S.timeDone=true; S.ffin=true; setStage('applied');
      S.sheet='cfmDone'; render();
    };
  } else if(S.sheet==='cfmDone'){                    // 맞춤상담 완료 → [신청 내역 보기] → 매칭 목록(종합 상담)
    const ov=screen.querySelector('.bs-overlay'); if(ov) ov.onclick=()=>{ S.sheet=null; render(); };
    const cd=$('#cdGo'); if(cd) cd.onclick=()=>{ S.sheet=null; S.listTrack='total'; go('list'); };
  } else if(S.sheet==='cross'){                       // 비교견적 컨펌 → [네, 받아볼래요] → 매칭 목록(서비스별)
    const ov=screen.querySelector('.bs-overlay'); if(ov) ov.onclick=()=>{ S.sheet='fullpage'; render(); };
    const csClose=$('#csClose'); if(csClose) csClose.onclick=()=>{ S.sheet='fullpage'; render(); };
    const csGo=$('#csGo'); if(csGo) csGo.onclick=()=>{ S.sheet=null; S.listTrack='compare'; setStage('applied'); go('list'); };
  }

  const chat=$('#chat');
  chat.innerHTML = `<div class="bub bot t-body16L20"><b class="w-bold">${pickedList().map(label).join(', ')}</b><br>한번에 상담을 도와드릴게요.</div>`;
  (S.log||[]).forEach(m=>{
    if(m.kind==='price'){ chat.insertAdjacentHTML('beforeend', chatPrice()); return; }
    if(m.kind==='done'){ chat.insertAdjacentHTML('beforeend', doneCard(m.time||(S.ans.ctime||[])[0])); return; }
    chat.insertAdjacentHTML('beforeend', `<div class="bub ${m.who} t-body16L20">${m.text}</div>`);
  });
  /* price 버블 '펼쳐보기' → 서비스 카드 전체 노출(price-dropdown). cur 없어도 동작하도록 조기 return 전에 배선 */
  const cpt=$('#cpToggle'); if(cpt) cpt.onclick=()=>{ S.priceOpen=true; render(); };

  const quick=$('#quick');
  const rec = (bot,me)=>{ S.log=S.log||[]; S.log.push({who:'bot',text:bot}); if(me!=null) S.log.push({who:'me',text:me}); };

  if(!cur){ setTimeout(()=>screen.scrollTop=screen.scrollHeight,10); return; }

  const say = (html)=> chat.insertAdjacentHTML('beforeend', `<div class="bub bot t-body16L20">${html}</div>`);

  if(cur.kind==='q'){
    const pre = cur.prefill && (S.ans[cur.prefill]||[]).length ? (S.ans[cur.prefill][0]) : null;
    say(cur.q);
    const sel = S.ans[cur.id]||[];

    if(cur.list){                       /* 리스트 셀렉 (title+subtitle) */
      quick.innerHTML = `<div class="q-list">${cur.list.map(it=>`
        <button class="q-li" data-l="${it.t}"><span class="ql-t t-body16L20 w-semibold">${it.t}</span>
          <span class="ql-s t-detail13L18">${it.s}</span></button>`).join('')}</div>`;
      quick.querySelectorAll('[data-l]').forEach(b=> b.onclick=()=>{ S.ans[cur.id]=[b.dataset.l]; rec(cur.q, b.dataset.l); render(); });

    } else if(cur.cal){                 /* 캘린더 피커 → 하단 모달 */
      quick.innerHTML = (cur.opts||[]).map(o=>selChip(o,false,`data-o="${o}"`)).join('')
        + chip({label:'날짜 직접 선택', size:'md', variant:'outlined', attrs:'id="calOpen"'});
      quick.querySelectorAll('[data-o]').forEach(b=> b.onclick=()=>{ S.ans[cur.id]=[b.dataset.o]; rec(cur.q, b.dataset.o); render(); });
      $('#calOpen').onclick=()=>{ S.modal={type:'cal', id:cur.id, q:cur.q, title:cur.q.replace(/을.*$|를.*$/,''), day:null}; render(); };

    } else if(cur.gallery){             /* 갤러리 피커 → 하단 모달 */
      quick.innerHTML = chip({label:'사진·영상 첨부', size:'md', variant:'outlined', attrs:'id="galOpen"'})
                      + chip({label:'건너뛰기', size:'md', variant:'normal', attrs:'id="galSkip"'});
      $('#galOpen').onclick=()=>{ S.modal={type:'gallery', id:cur.id, q:cur.q, picked:new Set()}; render(); };
      $('#galSkip').onclick=()=>{ S.ans[cur.id]=['건너뛰기']; rec(cur.q,'건너뛰기'); render(); };

    } else {                            /* 기본 chip. '직접 입력' → 텍스트 모달 */
      quick.innerHTML = optsOf(cur).map(o=>selChip(o, sel.includes(o), `data-o="${o}"`)).join('')
        + (cur.multi?boxButton({label:'고른 걸로 할게요', size:'small', variant:'solid', id:'mok', disabled:!sel.length}):'');
      quick.querySelectorAll('[data-o]').forEach(b=> b.onclick=()=>{
        const o=b.dataset.o;
        if(o==='직접 입력'){ S.modal={type:'text', id:cur.id, q:cur.q, num:false}; render(); return; }
        if(cur.multi){ const arr=S.ans[cur.id]||[]; S.ans[cur.id]=arr.includes(o)?arr.filter(x=>x!==o):[...arr,o]; render(); }
        else { let v=o; if(o==='(시공 주소와 동일)'&&pre) v=pre; S.ans[cur.id]=[v]; rec(cur.q, v); render(); }
      });
      if(cur.multi){ const ok=$('#mok'); if(ok) ok.onclick=()=>{ const arr=S.ans[cur.id]||[]; if(!arr.length)return; (S.confirmed=S.confirmed||new Set()).add(cur.id); rec(cur.q, arr.join(', ')); render(); }; }
    }

  } else if(cur.kind==='cross'){
    say(cur.q);
    quick.innerHTML = chip({label:'네, 함께 볼게요', size:'md', variant:'outlined', attrs:'id="cy"'})
                    + chip({label:'필요 없어요', size:'md', variant:'normal', attrs:'id="cn"'});
    $('#cy').onclick=()=>{ S.picked.add(cur.svc); rec(cur.q,'네, 함께 볼게요'); render(); };
    $('#cn').onclick=()=>{ S.dismiss=S.dismiss||{}; S.dismiss[cur.svc]=true; rec(cur.q,'필요 없어요'); render(); };

  } else if(cur.kind==='gen'){
    chat.insertAdjacentHTML('beforeend', `<div class="bub bot t-body16L20" style="display:flex;align-items:center;gap:8px">${spinner(16)}<span>예상 견적 만드는 중...</span></div>`);
    quick.innerHTML='';
    if(!S.genFired){ S.genFired=true; setTimeout(()=>{ if(S.screen==='form'){ S.genDone=true; S.log=S.log||[]; S.log.push({kind:'price'}); render(); } }, 2500); }

  } else if(cur.kind==='offer'){
    say('견적을 토대로 딱 맞는 파트너와 맞춤 상담을 받아보세요.<br><span class="t-detail12L16 c-fg-weak">오늘의집 담당 상담원이 원하는 시간대에만 연락드려 안심하세요.</span>');
    quick.innerHTML = chip({label:'네, 받아볼래요', size:'md', variant:'outlined', attrs:'id="oy"'})
                    + chip({label:'다음에 할게요', size:'md', variant:'normal', attrs:'id="on"'});
    $('#oy').onclick=()=>{ S.offerDone=true; rec('맞춤 상담을 받아보세요.','네, 받아볼래요'); render(); };
    $('#on').onclick=()=>{ S.offerDone=S.contactDone=S.timeDone=true; S.ffin=true; setStage('applied'); rec('맞춤 상담을 받아보세요.','다음에 할게요'); render(); };

  } else if(cur.kind==='contact'){
    say('010-9104-1024 번호로 연락 받으시겠어요?');
    quick.innerHTML = chip({label:'이 번호로 받기', size:'md', variant:'outlined', attrs:'id="c1"'})
                    + chip({label:'다른 번호로 받기', size:'md', variant:'normal', attrs:'id="c2"'});
    $('#c1').onclick=()=>{ S.contactDone=true; rec('연락 받을 번호를 확인해주세요.','010-9104-1024로 받기'); render(); };
    /* 다른 번호로 받기 → 숫자 입력 하단 바텀시트 노출 */
    $('#c2').onclick=()=>{ S.modal={type:'phone', q:'연락 받을 번호를 확인해주세요.'}; render(); };

  } else if(cur.kind==='time'){
    say('마지막으로 통화 희망 시간대를 알려주세요.');
    quick.innerHTML = TIME4.map(o=>selChip(o,false,`data-t="${o}"`)).join('');
    quick.querySelectorAll('[data-t]').forEach(b=> b.onclick=()=>{
      S.ans.ctime=[b.dataset.t]; S.timeDone=true; S.ffin=true; setStage('applied');
      rec('통화 희망 시간대를 알려주세요.', b.dataset.t); render();
    });

  } else if(cur.kind==='done'){
    /* Figma 137:115367 — 희망 시간대 선택 직후 '상담 신청 완료' 카드가 종착(상단 바 [상담예약중]).
       done 은 완료 상태라 cur 로 계속 남으므로 render() 재호출 금지(무한 재귀). 카드만 append. */
    const t=(S.ans.ctime||[])[0];
    S.log=S.log||[];
    if(!S.log.some(m=>m.kind==='done')){ S.log.push({kind:'done', time:t}); chat.insertAdjacentHTML('beforeend', doneCard(t)); }
    quick.innerHTML='';
    setTimeout(()=>{ if(!S.modal) screen.scrollTop=screen.scrollHeight; },10);
    return;
  }

  /* ── 하단 액션 모달 핸들러 (직접입력 text / 갤러리 / 캘린더) ── */
  if(S.modal){
    const m=S.modal;
    const ov=screen.querySelector('.bs-overlay'); if(ov) ov.onclick=()=>{ S.modal=null; render(); };
    if(m.type==='text'){
      const inp=$('#fmInput'); if(inp) setTimeout(()=>inp.focus(),30);
      const submit=()=>{ const v=(inp.value||'').trim(); if(!v)return; S.ans[m.id]=[v]; S.modal=null; rec(m.q, v); render(); };
      const ok=$('#fmOk'); if(ok) ok.onclick=submit;
      if(inp) inp.onkeydown=e=>{ if(e.key==='Enter') submit(); };
    } else if(m.type==='gallery'){
      /* 선택 시 render() 하지 않고 시트 DOM만 갱신 → 시트가 닫혔다 다시 열리지 않게 함 */
      const ok=$('#fmGalOk'), cnt=screen.querySelector('.fm-cnt');
      const setFoot=()=>{ const n=m.picked.size;
        ok.disabled=!n; ok.toggleAttribute('data-disabled',!n);
        ok.querySelector('.ods-btn-label').textContent = n?`${n}개 첨부하기`:'사진·영상을 선택해주세요';
        if(cnt) cnt.textContent=`${n}/5`; };
      screen.querySelectorAll('[data-g]').forEach(b=> b.onclick=()=>{
        const i=+b.dataset.g;
        if(m.picked.has(i)){ m.picked.delete(i); b.classList.remove('on'); b.querySelector('.fg-chk')?.remove(); }
        else if(m.picked.size<5){ m.picked.add(i); b.classList.add('on'); b.insertAdjacentHTML('beforeend', `<span class="fg-chk">${ic('IconCheck',12)}</span>`); }
        setFoot();
      });
      if(ok) ok.onclick=()=>{ const n=m.picked.size; if(!n)return; S.ans[m.id]=[`사진·영상 ${n}개 첨부`]; S.modal=null; rec(m.q, `사진·영상 ${n}개 첨부`); render(); };
    } else if(m.type==='cal'){
      /* 날짜 탭 시 render() 하지 않고 시트 DOM만 갱신 → 시트 유지 */
      const ok=$('#fmCalOk');
      screen.querySelectorAll('[data-d]').forEach(b=> b.onclick=()=>{
        m.day=+b.dataset.d;
        screen.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on', +x.dataset.d===m.day));
        if(ok){ ok.disabled=false; ok.removeAttribute('data-disabled'); ok.querySelector('.ods-btn-label').textContent=`8월 ${m.day}일 선택`; }
      });
      if(ok) ok.onclick=()=>{ if(!m.day)return; const v=`2026.08.${String(m.day).padStart(2,'0')}`; S.ans[m.id]=[v]; S.modal=null; rec(m.q, v); render(); };
    } else if(m.type==='phone'){
      /* 다른 번호 입력 — 입력 중 render() 하지 않고 시트 유지, 자동 하이픈 포맷 */
      const inp=$('#fmPhone'), ok=$('#fmPhoneOk');
      if(inp) setTimeout(()=>inp.focus(),30);
      const fmt=s=>{ const d=(s||'').replace(/\D/g,'').slice(0,11);
        return d.length>7?`${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`:d.length>3?`${d.slice(0,3)}-${d.slice(3)}`:d; };
      const valid=()=> (inp.value||'').replace(/\D/g,'').length>=10;
      const sync=()=>{ inp.value=fmt(inp.value); ok.disabled=!valid(); ok.toggleAttribute('data-disabled',!valid()); };
      if(inp) inp.oninput=sync;
      const submit=()=>{ if(!valid())return; const v=fmt(inp.value); S.contactDone=true; S.modal=null; rec(m.q, `${v}로 받기`); render(); };
      if(ok) ok.onclick=submit;
      if(inp) inp.onkeydown=e=>{ if(e.key==='Enter') submit(); };
    }
  }
  setTimeout(()=>{ if(!S.modal) screen.scrollTop=screen.scrollHeight; },10);
};

/* 하단 액션 모달 (Figma 미정의 동작 → 바텀시트로 구현): 직접입력 text / 갤러리 피커 / 캘린더 피커 */
function formModal(){
  const m=S.modal; if(!m) return '';
  if(m.type==='text') return `<div class="bs-overlay"></div>
    <div class="bsheet fm-sheet">
      <div class="bs-grab"><i></i></div>
      <div class="fm-h t-body16L20 w-bold">직접 입력</div>
      <div class="fm-body"><input class="fm-input t-body16L20" id="fmInput" placeholder="직접 입력해주세요" ${m.num?'inputmode="numeric"':''} autocomplete="off"></div>
      <div class="bs-foot">${boxButton({label:'확인', size:'large', variant:'brand-solid', id:'fmOk', full:true})}</div>
    </div>`;
  if(m.type==='phone') return `<div class="bs-overlay"></div>
    <div class="bsheet fm-sheet">
      <div class="bs-grab"><i></i></div>
      <div class="fm-h t-body16L20 w-bold">다른 번호 입력</div>
      <div class="fm-body"><input class="fm-input t-body16L20" id="fmPhone" inputmode="numeric" placeholder="숫자만 입력 (예: 010 1234 5678)" autocomplete="off"></div>
      <div class="bs-foot">${boxButton({label:'이 번호로 받기', size:'large', variant:'brand-solid', id:'fmPhoneOk', full:true, disabled:true})}</div>
    </div>`;
  if(m.type==='gallery'){ const c=m.picked.size;
    return `<div class="bs-overlay"></div>
    <div class="bsheet fm-sheet">
      <div class="bs-grab"><i></i></div>
      <div class="fm-h t-body16L20 w-bold">사진·영상 첨부 <span class="fm-cnt c-fg-weak t-body14L18 w-regular">${c}/5</span></div>
      <div class="fm-body"><div class="fm-gal">${Array.from({length:9},(_,i)=>
        `<button class="fm-tile${m.picked.has(i)?' on':''}" data-g="${i}"><span class="fg-ph"></span>${m.picked.has(i)?`<span class="fg-chk">${ic('IconCheck',12)}</span>`:''}</button>`).join('')}</div></div>
      <div class="bs-foot">${boxButton({label:c?`${c}개 첨부하기`:'사진·영상을 선택해주세요', size:'large', variant:'brand-solid', id:'fmGalOk', full:true, disabled:!c})}</div>
    </div>`; }
  if(m.type==='cal'){
    const Y=2026, M=8, firstDay=new Date(Y,M-1,1).getDay(), days=new Date(Y,M,0).getDate();
    const cells=[]; for(let i=0;i<firstDay;i++) cells.push(0); for(let d=1;d<=days;d++) cells.push(d);
    return `<div class="bs-overlay"></div>
    <div class="bsheet fm-sheet">
      <div class="bs-grab"><i></i></div>
      <div class="fm-h t-body16L20 w-bold">날짜 선택 <span class="c-fg-weak t-body14L18 w-regular">${Y}년 ${M}월</span></div>
      <div class="fm-body"><div class="fm-cal">
        <div class="fc-wk">${['일','월','화','수','목','금','토'].map(w=>`<span>${w}</span>`).join('')}</div>
        <div class="fc-days">${cells.map(d=>d?`<button class="fc-day${m.day===d?' on':''}" data-d="${d}">${d}</button>`:`<span></span>`).join('')}</div>
      </div></div>
      <div class="bs-foot">${boxButton({label:m.day?`${M}월 ${m.day}일 선택`:'날짜를 선택해주세요', size:'large', variant:'brand-solid', id:'fmCalOk', full:true, disabled:!m.day})}</div>
    </div>`;
  }
  return '';
}

const _legacyForm = ()=> S.mode==='chat' ? chatView() : stepView();

/* ── A안 대화형 ─────────────────────────── */
function chatView(){
  const qs = formQueue();
  const cur = qs[S.qi];
  const done = S.qi>=qs.length;
  const ask = f => f.type ? txt(f) : f.q;

  /* 주소 계열 문항에서는 Figma 58:19520 처럼 pill 검색 input 을 함께 노출한다 */
  const ADDR_FIELDS = new Set(['addr','move.from']);
  const isAddr = !done && cur && !cur.type && ADDR_FIELDS.has(keyOf(cur));

  /* 상단 프로그레스 — 현재 문항 번호 / 전체 문항 수 (prefill 확인 항목은 제외) */
  const qTotal = qs.filter(f=>!f.type).length;
  const qDone  = Math.min(Math.max(qs.slice(0, S.qi+1).filter(f=>!f.type).length, 1), qTotal);

  screen.innerHTML = `
    <div class="chat-screen">
      ${topNav({title:'견적 한번에 받기', backId:'bk'})}
      ${bundleProgress(done?qTotal:qDone, qTotal)}
      <div class="chat" id="chat"></div>
      <div class="chatdock">
        <div class="quick" id="quick"></div>
        ${isAddr?`<div class="chatbar">
          <button class="pillinput" data-size="chat" id="addrOpen">
            <span class="ph t-body15L24 w-medium">도로명, 지번 검색</span>
            <span class="send">${ic('IconArrowUpCircleFilled',20)}</span>
          </button>
        </div>`:''}
      </div>
      ${S.sheet==='addr'?addrSheet():''}
    </div>`;
  screen.classList.toggle('has-sheet', S.sheet==='addr');
  $('#bk').onclick = ()=>{
    if(S.qi===0) return go('select');
    S.qi--; S.log.splice(-2);
    const back = qs[S.qi]; if(back) delete S.ans[keyOf(back)];
    render();
  };

  const chat = $('#chat');
  chat.innerHTML = `<div class="bub bot t-body16L20">
    <b class="w-bold">${pickedList().map(label).join(', ')}</b><br>한번에 상담을 도와드릴게요.</div>`;
  let lastSvc = '__';
  S.log.forEach(m=>{
    if(m.svc && m.svc!==lastSvc){ chat.insertAdjacentHTML('beforeend',`<div class="svc-tag t-detail11L14 w-semibold">${label(m.svc)}</div>`); lastSvc=m.svc; }
    if(!m.svc) lastSvc='__';
    chat.insertAdjacentHTML('beforeend',`<div class="bub ${m.who} t-body16L20">${m.text}</div>`);
  });

  /* 답할 때 봇 질문과 유저 답변을 함께 기록에 남긴다 */
  const answer = (text)=>{ S.log.push({who:'bot',text:ask(cur),svc:cur.svc},{who:'me',text,svc:cur.svc}); S.qi++; render(); };

  const quick = $('#quick');
  if(done){
    quick.innerHTML = boxButton({label:'입력 완료', size:'medium', variant:'solid', id:'fin'});
    $('#fin').onclick = ()=>{ S.gen=true; go(afterForm()); };
  } else {
    if(cur.svc && cur.svc!==lastSvc) chat.insertAdjacentHTML('beforeend',`<div class="svc-tag t-detail11L14 w-semibold">${label(cur.svc)}</div>`);
    if(cur.type==='note' || cur.type==='prefill'){
      chat.insertAdjacentHTML('beforeend',`<div class="bub note t-body16L20">${ic('IconInfoCircle',16)}<span>${txt(cur)}</span></div>`);
      quick.innerHTML = chip({label:cur.ack, size:'md', variant:'normal', attrs:'id="ack"'});
      $('#ack').onclick = ()=>answer(cur.ack);
    } else {
      chat.insertAdjacentHTML('beforeend',
        `<div class="bub bot t-body16L20">${cur.q}${cur.why?`<br><span class="t-detail12L16 c-fg-weak">${cur.why}</span>`:''}</div>`);
      const sel = S.ans[keyOf(cur)] || [];
      quick.innerHTML = optsOf(cur).map(o=>selChip(o, sel.includes(o), `data-o="${o}"`)).join('')
        + (cur.multi?boxButton({label:'고른 걸로 할게요', size:'small', variant:'solid', id:'ok', disabled:!sel.length}):'');
      quick.querySelectorAll('[data-o]').forEach(b=> b.onclick=()=>{
        const o=b.dataset.o;
        if(cur.multi){
          const arr = S.ans[keyOf(cur)]||[];
          S.ans[keyOf(cur)] = arr.includes(o)?arr.filter(x=>x!==o):[...arr,o];
          render();
        } else { S.ans[keyOf(cur)]=[o]; answer(o); }
      });
      if(cur.multi) $('#ok') && ($('#ok').onclick=()=>{
        const arr=S.ans[keyOf(cur)]||[]; if(!arr.length) return;
        answer(arr.join(', '));
      });
    }
  }

  /* 배송지 목록 시트 — pill input 으로 열고, 고른 주소를 그대로 답변으로 넘긴다 */
  const openBtn = $('#addrOpen');
  if(openBtn) openBtn.onclick = ()=>{ S.sheet='addr'; S.sheetPick = S.sheetPick ?? 0; render(); };
  if(S.sheet==='addr'){
    const close = ()=>{ S.sheet=null; render(); };
    screen.querySelector('.bs-overlay').onclick = close;
    const x = screen.querySelector('[data-bs-close]'); if(x) x.onclick = close;
    screen.querySelectorAll('[data-bs-i]').forEach(b=> b.onclick=()=>{
      S.sheetPick = +b.dataset.bsI; render();
    });
    const okBtn = screen.querySelector('#bsOk');
    if(okBtn) okBtn.onclick = ()=>{
      const a = ADDR_BOOK[S.sheetPick||0];
      S.ans[keyOf(cur)] = [a.addr];
      S.sheet = null;
      /* 정보 항목 답변 버블은 '라벨: 값' 구조 (Figma 64:23857) */
      answer(`${cur.label}: <span class="w-medium">${a.addr}</span>`);
    };
  }
  setTimeout(()=>{ if(S.sheet!=='addr') screen.scrollTop = screen.scrollHeight; },10);
}

/* 배송지 목록 BottomSheet (Figma 64:21663 / 64:22782) */
function addrSheet(){
  const pick = S.sheetPick ?? 0;
  return `<div class="bs-overlay"></div>
  <section class="bsheet" role="dialog" aria-label="배송지 목록">

function stepView(){

  /* 서비스 단위로 묶어 표시하되 순서는 유지한다 */
  const blocks=[]; let last='__';
  cur.forEach(f=>{

      ${b.items.map(f=>{

    <div class="fsec">

        <div class="lb t-detail13L18">개인정보 제공 동의 <span class="c-fg-brand t-detail11L14">필수</span></div>
        <p class="why t-detail11L14"><b>업체 최대 5곳</b>에만 전달됩니다.</p>
        <label class="ods-cbx" data-agree="1">
          ${cbxIndicator(!!S.ans['agree'])}
          <span class="ods-cbx-label">동의하고 진행할게요</span>
        </label>
      </div>
    </div>`:'');

  const canNext = cur.filter(f=>!f.type).every(f=>S.ans[keyOf(f)]?.length)
    && (S.step===1 ? !!S.ans['agree'] : true);

  screen.innerHTML = `
    ${topNav({title:'통합 상담 신청', backId:'bk'})}
    <div class="prog"><div class="bar"><i style="width:${pct}%"></i></div>

  $('#bk').onclick = ()=> S.step>0 ? (S.step--,render()) : go('select');

/* ── 예상 견적가 range (이사) ─────────────
   phase 1 = 최소 정보만 있는 상태 → 범위가 넓다
   phase 2 = 층수·엘베·추가짐까지 채운 상태 → 범위가 좁아진다 */
function estimate(phase){
  const size=(S.ans['size']||[])[0]||'30평대';
  const type=(S.ans['move.type']||[])[0]||'가정이사';
  const md=(S.ans['move.mdate']||[])[0]||'';
  const ff=(S.ans['move.ffloor']||[])[0], tf=(S.ans['move.tfloor']||[])[0];
  const ex=(S.ans['move.extra']||[]);
  const BASE={'10평 이하':38,'10평대':52,'20평대':68,'30평대':85,'40평대':105,'50평대':125,'60평대':145,'70평 이상':170};
  const MUL={'가정이사':1,'소형 포장':0.62,'소형 반포장':0.5,'소형 일반(용달)':0.38};
  const ladder = s => !s ? 0 : (s.includes('엘베 없음') ? (s.startsWith('6층')?25:12) : 0);
  let v=(BASE[size]||85)*(MUL[type]??1);
  const why=[type, size], unknown=[];
  const kn = s => s && s!==UNKNOWN;
  if((S.ans['move.from']||[])[0]==='아직 안 정했어요') unknown.push('출발지'); else why.push('수도권 내 이동');
  if(md==='손없는날로 맞출래요'){ v*=1.18; why.push('손없는날 +18%'); }
  if(kn(ff)&&kn(tf)){
    const L=ladder(ff)+ladder(tf); v+=L;
    why.push(L>0?`사다리차 ${L}만원`:'양쪽 엘베 있음');
  } else unknown.push('층수·엘베');
  if(phase===2){
    if(ex.includes('에어컨 이전설치')){ v+=12; why.push('에어컨 이전'); }
    if(ex.includes('보관이사')){ v*=1.25; why.push('보관이사'); }
    if(ex.includes('피아노·금고')){ v+=10; why.push('피아노·금고'); }
    if(!ex.length) unknown.push('추가 짐');
  } else unknown.push('추가 짐');
  const w = unknown.length===0 ? [0.9,1.12] : unknown.length===1 ? [0.86,1.28] : [0.82,1.5];
  return {lo:Math.round(v*w[0]/5)*5, hi:Math.round(v*w[1]/5)*5, why, unknown};
}

      </div>`
    : pickedList().map(k=>{
        const isProd = k==='net'||k==='rent';
        return `<div class="ml-card">
          <span class="ml-ic">${asset(PRICE_ART[k],28)}</span>
          <div class="ml-body">
            <b class="ml-nm t-body16L20 w-semibold">${label(k)}</b>
            <span class="ml-stat t-detail13L18">${isProd?'상담원 매칭중':'업체 매칭 중'}</span>
            ${isProd?'':`<span class="ml-sub t-detail13L18">딱 맞는 업체를 찾고 있어요</span>`}
          </div>
          <span class="ml-time t-detail11L14">방금</span>
        </div>`;
      }).join('');
  const snack = track==='total' ? '신청 완료!  알림으로 알려드릴게요.'
    : '비교견적 신청 완료 · 매칭이 완료되면 알림으로 알려드릴게요.';
  screen.innerHTML = `
    ${topNav({title:'시공/생활 상담내역', backId:'bk'})}
    <div class="mlist">
      <div class="ml-tabs">${ML_TABS.map((t,i)=>`<button class="ml-tab${i?'':' on'}"><span class="t-body16L28 ${i?'w-medium':'w-bold'}">${t}</span></button>`).join('')}</div>
      <div class="ml-chips">${ML_CHIPS.map((c,i)=>chip({label:c, size:'sm', variant:i?'normal':'outlined', pressed:i===0})).join('')}</div>
      <button class="ml-period t-detail13L18 w-medium">6개월 이내 <span class="ml-caret">${ic('IconChevronRight',14)}</span></button>
      <div class="ml-cards">${cards}</div>
    </div>
    <div class="ml-snack t-detail13L18">${snack}</div>`;
  $('#bk').onclick = ()=>go('entry');
};
